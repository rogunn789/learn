<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>N1词汇例句集·卡片版（单词+文法）</title>
<style>
body{margin:0;background:#faf7f0;color:#222;font-family:serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:21px;text-align:center}
.key{text-align:center;font-size:14px;color:#666;margin:6px 0 18px}
.ent{background:#fff;border:1px solid #e5ddcb;border-radius:12px;padding:12px 16px;margin:0 0 14px}
.wh{font-size:19px;margin:0 0 6px}
.wh .ww{font-weight:bold;color:#d6006d;font-family:"Hiragino Maru Gothic ProN","TsukuA Maru Gothic","TsukuB Maru Gothic","Hiragino Mincho ProN",YuMincho,"Yu Mincho",sans-serif}
.wh .rr{color:#f06400;font-weight:bold;font-size:16px}
.wh .gg{font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;font-size:16px;color:#444}
.ex{margin:6px 0 2px}
.ex .src{display:inline-block;font-size:11px;color:#fff;background:#8b7d5a;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
.ex .src.s1{background:#0b5cad}.ex .src.s2{background:#2e7d32}.ex .src.s3{background:#b26a00}.ex .src.s4{background:#6a4a8c}.ex .src.s5{background:#8b1818}
.jp{font-family:"Hiragino Maru Gothic ProN","TsukuA Maru Gothic","TsukuB Maru Gothic","Hiragino Mincho ProN",YuMincho,"Yu Mincho",sans-serif;font-size:19px;line-height:1.8}
.jp rt{font-size:.58em;color:#f06400}
.jp .kw{background:#ffe3f1;color:#d6006d;font-weight:bold;border-radius:4px;padding:0 2px}
.jp .pt{background:#dbeafe;color:#0b5cad;font-weight:bold;border-radius:4px;padding:0 2px}
.cn{font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;font-size:15px;color:#666;margin:1px 0 6px 0;line-height:1.6}
.none{font-size:14px;color:#999}
.gr{margin:10px 0 2px;border:1px solid #c9d8ef;background:#f4f8ff;border-radius:8px;padding:8px 10px}
.gr .lbl{display:inline-block;font-size:11px;color:#fff;background:#0b5cad;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
.gr .lbl.zb{background:#b26a00}
.gr .gt{font-weight:bold;color:#0b5cad;font-size:17px;font-family:"Hiragino Maru Gothic ProN","TsukuA Maru Gothic","TsukuB Maru Gothic","Hiragino Mincho ProN",YuMincho,"Yu Mincho",sans-serif}
.gr .gc{font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;font-size:14px;color:#555;margin:2px 0 4px;line-height:1.6}
.nbtn{position:fixed;top:10px;right:10px;z-index:9;border:1px solid #d8cfb8;background:#fff;color:#555;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
body.dark{background:#17141f;color:#e8e2d4}
body.dark .ent{background:#221e30;border-color:#3a3450}
body.dark .wh .gg{color:#cfc9ae}
body.dark .cn{color:#a49e86}
body.dark .gr{background:#1e2338;border-color:#39406a}
body.dark .gr .gc{color:#b7bdd4}
body.dark .nbtn{background:#262233;color:#cfc9e8;border-color:#4a4266}

.stage{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 56px;box-sizing:border-box;touch-action:manipulation}
.stage .ent{max-width:860px;margin:0 auto}
.hint{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:13px;color:#999;padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:transparent;pointer-events:none}
.hide{display:none!important}
.lockwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:50}
.lockbox{max-width:420px;width:100%;text-align:center}
.locktitle{font-size:24px;font-weight:800;margin-bottom:10px}
.lockhint{font-size:15px;color:#888;line-height:1.6;margin:0 0 16px}
.lockinput{width:100%;font-size:19px;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;margin-bottom:12px;background:var(--card);color:var(--ink)}
.lockbtn{width:100%;appearance:none;border:none;border-radius:10px;padding:13px;font-size:19px;font-weight:800;background:#d6006d;color:#fff;cursor:pointer}
.lockmsg{color:#d92b0c;font-size:15px;min-height:22px;margin:10px 0 0}
</style>

<script>// Shared renderer: structured DATA -> entry HTML (byte-identical to build_fused output)
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}
var KANJI = /[一-鿿]/;
function tokHtml(t){
  var f = t.split('|');
  var s = f[0], rd = f[1] || '', cls = +(f[2] || 0);
  var h;
  if (rd && KANJI.test(s) && rd !== s) h = '<ruby>' + esc(s) + '<rt>' + esc(rd) + '</rt></ruby>';
  else h = esc(s);
  if (cls === 1) return '<span class="kw">' + h + '</span>';
  if (cls === 2) return '<span class="pt">' + h + '</span>';
  return h;
}
function sentHtml(str){ return str.split('^').map(tokHtml).join(''); }
function entHtml(e){
  var h = '<p class="wh"><span class="ww">' + esc(e.w) + '</span>（<span class="rr">' + esc(e.r) + '</span>）<span class="gg">' + esc(e.g) + '</span></p>';
  if (!e.ex.length) h += '<p class="none">（暂无例句）</p>';
  for (var i = 0; i < e.ex.length; i++){
    var x = e.ex[i];
    h += '<div class="ex"><span class="src ' + x.c + '">' + esc(x.s) + '</span><span class="jp">' + sentHtml(x.t) + '</span>' + (x.n ? '<p class="cn">' + esc(x.n) + '</p>' : '') + '</div>';
  }
  var g = e.gr; var P = PATS[g.p];
  var gc = (P.conn || P.sense) ? '<p class="gc">' + (P.conn ? esc(P.conn) + ' ' : '') + esc(P.sense) + '</p>' : '';
  var sub = P.sub ? '<span class="gt">（' + esc(P.sub) + '）</span>' : '';
  if (g.k === 'b'){
    h += '<div class="gr"><span class="lbl">文法·书中</span><span class="gt">' + esc(P.pat) + '</span>' + sub + gc;
    if (g.t === null) h += '<p class="cn">（例句见上）</p></div>';
    else h += '<span class="jp">' + sentHtml(g.t) + '</span>' + (g.n ? '<p class="cn">' + esc(g.n) + '</p>' : '') + '</div>';
  } else {
    h += '<div class="gr"><span class="lbl zb">文法·自编</span><span class="gt">' + esc(P.pat) + '</span>' + sub + gc +
         '<span class="jp">' + sentHtml(g.t) + '</span><p class="cn">' + esc(g.n) + '</p></div>';
  }
  return '<div class="ent">' + h + '</div>';
}

function lsG(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function applyT(t){document.body.classList.toggle('dark',t==='dark')}
applyT(lsG('n1ex_theme')||'light');
var started = false;
function startApp(){
  if (started) return; started = true;
  document.getElementById('lock').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  var btn=document.getElementById('nbtn');
  btn.addEventListener('click',function(ev){ev.stopPropagation();var d=document.body.classList.contains('dark')?'light':'dark';lsS('n1ex_theme',d);applyT(d);});
  jump();
}
var cur = -1; var recent = [];
function jump(){
  var n;
  do { n = Math.floor(Math.random()*DATA.length); } while (n===cur || recent.indexOf(n)>=0);
  recent.push(n); if (recent.length>12) recent.shift();
  cur = n;
  document.getElementById('stage').innerHTML = entHtml(DATA[n]);
  document.getElementById('stage').scrollTop = 0;
  document.getElementById('hint').textContent = '双击换一张 · 第 ' + (n+1) + ' / ' + DATA.length + ' 词';
}
document.addEventListener('dblclick', function(){ if (started) jump(); });
var lastTap = 0;
document.addEventListener('touchend', function(ev){
  if (!started) return;
  var now = Date.now();
  if (now - lastTap < 320) { ev.preventDefault(); jump(); lastTap = 0; }
  else lastTap = now;
}, {passive:false});

    text = await new Response(stream).text();
    var obj = JSON.parse(text);
    PATS = obj.PATS; DATA = obj.DATA;
  } catch(e){ throw new Error('gunzip'); }
  startApp();
}
function lockFail(msg){
  document.getElementById('lockMsg').textContent = msg;
}
async function tryUnlock(pwd){
  if (!window.crypto || !crypto.subtle) { lockFail('当前浏览器不支持解密，请换用最新版 Chrome / Safari 打开本文件。'); return; }
  try { await unlock(pwd); }
  catch(e){
    if (e && e.message === 'gunzip') lockFail('数据解压失败，请换个浏览器打开。');
    else lockFail('密码不正确，无法解密。');
  }
}
document.getElementById('unlockBtn').addEventListener('click', function(){
  var v = document.getElementById('pwdInput').value.trim();
  if (v) tryUnlock(v);
});
document.getElementById('pwdInput').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter') document.getElementById('unlockBtn').click();
});
var q = new URLSearchParams(location.search).get('pwd') || (location.hash.match(/pwd=([^&]+)/) || [])[1];
if (q) tryUnlock(decodeURIComponent(q).trim());
</script>
