<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>N1 历年选择题 · 卡片版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Sans","Noto Sans CJK SC",sans-serif;background:#fdf9ef;color:#222;-webkit-text-size-adjust:100%}
body.dark{background:#191922;color:#e8e4da}
.hide{display:none!important}
.lockwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fdf9ef;z-index:50;padding:20px}
body.dark .lockwrap{background:#191922}
.lockbox{max-width:340px;width:100%;text-align:center}
.locktitle{font-size:24px;font-weight:700;margin:0 0 8px;color:#d6006d}
.lockhint{font-size:14px;color:#777;margin:0 0 16px;line-height:1.6}
.lockinput{width:100%;font-size:17px;padding:11px;border:1.5px solid #d8d0ba;border-radius:8px;margin:0 0 10px;background:#fff;color:#222}
body.dark .lockinput{background:#23232e;border-color:#444;color:#eee}
.lockbtn{width:100%;font-size:17px;padding:11px;border:none;border-radius:8px;background:#d6006d;color:#fff;cursor:pointer}
.lockmsg{color:#c0392b;font-size:14px;min-height:20px;margin:10px 0 0}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:#fdf9ef;border-bottom:1px solid #e8e0cd;padding:8px 10px calc(8px + env(safe-area-inset-top, 0px));padding-top:calc(8px + env(safe-area-inset-top, 0px))}
body.dark .topbar{background:#191922;border-color:#333}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
select.sessel{font-size:14px;padding:5px 6px;border:1px solid #d8d0ba;border-radius:6px;background:#fff;color:#222;max-width:44vw}
body.dark select.sessel{background:#23232e;color:#eee;border-color:#444}
.chip{appearance:none;border:1px solid #d8d0ba;background:#fff;color:#555;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
body.dark .chip{background:#23232e;color:#bbb;border-color:#444}
.chip.on{background:#d6006d;border-color:#d6006d;color:#fff}
.nbtn{margin-left:auto;appearance:none;border:1px solid #d8d0ba;background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:#555}
body.dark .nbtn{background:#23232e;color:#bbb;border-color:#444}
.stage{padding:118px 12px 96px;max-width:860px;margin:0 auto}
.qhead{font-size:13px;color:#999;margin:0 0 8px}
.qhead .tp{color:#d6006d;font-weight:700}
.qstem{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",serif;font-size:21px;line-height:2.05;margin:0 0 16px;font-weight:600}
.qstem rt{font-size:.52em;color:#e07f28}
.kw{color:#d6006d;font-weight:700;background:#ffe9f4;border-radius:3px;padding:0 2px}
body.dark .kw{color:#ff4da6;background:#3d1630}
.star{background:#e07f28;color:#fff;font-weight:700;border-radius:4px;padding:0 5px;font-size:1.2em;white-space:nowrap}
.ahint{font-size:13px;color:var(--sub);margin:2px 0 0}
.seq{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.slot{flex:1;min-width:58px;border:2px dashed var(--line);border-radius:8px;padding:9px 4px;text-align:center;font-size:15px;position:relative;background:var(--card);color:var(--sub)}
.slot.f{border-style:solid;color:var(--ink)}
.slot.st{border-color:#e07f28}
.slot .stbadge{position:absolute;top:-9px;left:5px;background:#e07f28;color:#fff;font-size:11px;border-radius:6px;padding:0 5px;line-height:1.5}
.slot.ok{border-color:#12994a;background:#e9f9ef;color:var(--ink)}
.slot.ng{border-color:#d43d2a;background:#fdecea;color:var(--ink)}
body.dark .slot.ok{background:#12351f}
body.dark .slot.ng{background:#3d1710}
.opt.placed{opacity:.4}
#judgebtn{display:block;margin:12px auto 2px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:11px 44px;font-size:16px;font-weight:700;cursor:pointer}
#judgebtn.off{opacity:.35}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{appearance:none;text-align:left;border:1.5px solid #d8d0ba;background:#fffdf6;border-radius:10px;padding:11px 13px;font-size:18px;line-height:1.9;cursor:pointer;color:#222;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",serif}
body.dark .opt{background:#23232e;border-color:#444;color:#e8e4da}
.opt rt{font-size:.52em;color:#e07f28}
.opt .ono{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#efe8d2;color:#8a7a3a;font-size:14px;margin-right:9px;vertical-align:2px;font-family:sans-serif}
body.dark .opt .ono{background:#333;color:#cbb}
.opt.right{border-color:#12994a;background:#e9f9ef}
body.dark .opt.right{background:#14301d;border-color:#12994a}
.opt.right .ono{background:#12994a;color:#fff}
.opt.wrong{border-color:#d92b0c;background:#fdeeea}
body.dark .opt.wrong{background:#3a1a12;border-color:#d92b0c}
.opt.wrong .ono{background:#d92b0c;color:#fff}
.opt.dim{opacity:.55}
.exp{margin-top:16px;border:1.5px solid #0b5cad;border-radius:10px;background:#f2f7fd;padding:12px 14px}
body.dark .exp{background:#16283d;border-color:#2c5a8a}
.exphead{font-weight:700;margin:0 0 6px;font-size:16px}
.exphead .ok{color:#12994a}
.exphead .ng{color:#d92b0c}
.exptext{margin:0;font-size:16.5px;line-height:1.85;font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif CJK SC",serif;white-space:pre-wrap}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fdf9ef;border-top:1px solid #e8e0cd;padding:9px 12px calc(9px + env(safe-area-inset-bottom, 0px));display:flex;gap:8px;align-items:center}
body.dark .botbar{background:#191922;border-color:#333}
.navbtn{appearance:none;border:1px solid #d8d0ba;background:#fff;border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer;color:#333}
body.dark .navbtn{background:#23232e;color:#ddd;border-color:#444}
.stats{margin-left:auto;font-size:13px;color:#888;text-align:right;line-height:1.5}
</style>

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');}
var KANJI = /[一-鿿]/;
function tokHtml(t){
  var f = t.split('|');
  var s = f[0], rd = f[1] || '', cls = +(f[2] || 0);
  var h;
  if (rd && KANJI.test(s) && rd !== s) h = '<ruby>' + esc(s) + '<rt>' + esc(rd) + '</rt></ruby>';
  else h = esc(s);
  if (cls === 1) return '<span class="kw">' + h + '</span>';
  if (cls === 2) return '<span class="star">' + h + '</span>';
  return h;
}
function sentHtml(str){ return str.split('^').map(tokHtml).join(''); }
function lsG(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsS(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var DATA = null, QS = [], SESS = [];
var started = false;
var TNAMES = {1:'漢字読み', 2:'文脈規定', 3:'言い換え', 4:'使い方', 5:'文法形式', 6:'文の組み立て'};
var sessFilter = lsG('n1qz_sess') || 'ALL';
var typeFilter = +(lsG('n1qz_type') || 0);
var cur = +(lsG('n1qz_cur') || 0);
var res = {};
try { res = JSON.parse(lsG('n1qz_res') || '{}'); } catch(e){ res = {}; }
var seqStore = {};
try { seqStore = JSON.parse(lsG('n1qz_seq') || '{}'); } catch(e){ seqStore = {}; }
var curSeq = [], curJudged = false;
function isArrange(q){ return q && q.type === 6 && q.ord; }
function plainOf(enc){ return enc.split('^').map(function(t){ return t.split('|')[0]; }).join(''); }
function renderSeq(){
  var q = QS[cur]; if (!isArrange(q)) return;
  var el = document.getElementById('seq'); if (!el) return;
  var h = '';
  for (var i = 0; i < 4; i++){
    var cls = 'slot';
    var v = curSeq[i];
    if (v) cls += ' f';
    if (q.star === i) cls += ' st';
    if (curJudged) cls += (v === q.ord[i]) ? ' ok' : ' ng';
    h += '<span class="' + cls + '" data-slot="' + i + '">' + (q.star === i ? '<span class="stbadge">★</span>' : '') + (v ? esc(plainOf(q.opts[v - 1])) : '＿＿') + '</span>';
  }
  el.innerHTML = h;
  var slots = document.querySelectorAll('.slot');
  for (var j = 0; j < slots.length; j++){
    slots[j].addEventListener('click', function(ev){
      ev.stopPropagation();
      if (curJudged) return;
      var i = +this.getAttribute('data-slot');
      if (curSeq[i]){ curSeq.splice(i, 1); syncArrange(); }
    });
  }
}
function syncArrange(){
  renderSeq();
  var q = QS[cur];
  var opts = document.querySelectorAll('.opt');
  for (var j = 0; j < opts.length; j++){
    opts[j].classList.toggle('placed', curSeq.indexOf(+opts[j].getAttribute('data-opt')) >= 0);
  }
  var jb = document.getElementById('judgebtn');
  if (jb) jb.classList.toggle('off', curSeq.length < 4);
}
function placeOpt(n){
  if (curJudged) return;
  var i = curSeq.indexOf(n);
  if (i >= 0) curSeq.splice(i, 1);
  else if (curSeq.length < 4) curSeq.push(n);
  syncArrange();
}
function judgeArrange(){
  var q = QS[cur];
  if (curJudged || curSeq.length < 4) return;
  var correct = curSeq.join(',') === q.ord.join(',');
  var picked = (q.star != null) ? curSeq[q.star] : (correct ? q.ans : (q.ans % 4) + 1);
  res[cur] = picked;
  seqStore[cur] = curSeq.slice();
  lsS('n1qz_res', JSON.stringify(res));
  lsS('n1qz_seq', JSON.stringify(seqStore));
  show(cur);
}
function applyT(t){ document.body.classList.toggle('dark', t === 'dark'); }
applyT(lsG('n1qz_theme') || 'light');
function pool(){
  return QS.filter(function(q){ return (sessFilter === 'ALL' || q.sess === sessFilter) && (!typeFilter || q.type === typeFilter); });
}
function stats(){
  var done = 0, ok = 0;
  for (var k in res){ done++; var q = QS[+k]; if (q && res[k] === q.ans) ok++; }
  return { done: done, ok: ok, ng: done - ok };
}
function show(qid){
  var p = pool();
  if (!p.length){ document.getElementById('stage').innerHTML = '<p class="qhead">这个筛选下没有题目。</p>'; return; }
  var q = QS[qid];
  if (!q || p.indexOf(q) < 0) q = p[0];
  cur = q.id; lsS('n1qz_cur', String(cur));
  var pos = p.indexOf(q) + 1;
  var arrange = isArrange(q);
  var picked = res[q.id];
  curSeq = (arrange && picked && seqStore[q.id]) ? seqStore[q.id].slice() : [];
  curJudged = arrange && !!picked;
  var h = '<p class="qhead">' + esc(q.sess) + ' · <span class="tp">問題' + q.type + ' ' + TNAMES[q.type] + '</span> · 第 ' + q.n + ' 题 · 本组 ' + pos + ' / ' + p.length + '</p>';
  h += '<p class="qstem">' + sentHtml(q.stem) + '</p>';
  if (arrange){
    h += '<p class="ahint">组句题：按顺序点选四个选项，排成通顺的句子，再点「判定」。</p>';
    h += '<div class="seq" id="seq"></div>';
  }
  h += '<div class="opts">';
  for (var i = 0; i < 4; i++){
    var cls = 'opt';
    if (picked && !arrange){
      if (i + 1 === q.ans) cls += ' right';
      else if (i + 1 === picked) cls += ' wrong';
      else cls += ' dim';
    }
    if (arrange && curSeq.indexOf(i + 1) >= 0) cls += ' placed';
    h += '<button class="' + cls + '" data-opt="' + (i + 1) + '"><span class="ono">' + (i + 1) + '</span>' + sentHtml(q.opts[i]) + '</button>';
  }
  h += '</div>';
  if (arrange && !picked) h += '<button id="judgebtn" class="off">判定</button>';
  if (picked && arrange){
    var seqOk = seqStore[q.id] && seqStore[q.id].join(',') === q.ord.join(',');
    var ordTxt = q.ord.map(function(n){ return plainOf(q.opts[n - 1]); }).join(' → ');
    h += '<div class="exp"><p class="exphead">' + (seqOk ? '<span class="ok">✓ 答对了，顺序完全正确</span>' : '<span class="ng">✗ 顺序不对</span>') + ' · 正确顺序：' + esc(ordTxt) + '</p><p class="exptext">' + esc(q.exp) + '</p></div>';
  } else if (picked){
    var right = picked === q.ans;
    h += '<div class="exp"><p class="exphead">' + (right ? '<span class="ok">✓ 答对了</span>' : '<span class="ng">✗ 你选了 ' + picked + '</span>') + ' · 正解 ' + q.ans + '</p><p class="exptext">' + esc(q.exp) + '</p></div>';
  }
  document.getElementById('stage').innerHTML = h;
  document.getElementById('stage').scrollTop = 0;
  window.scrollTo(0, 0);
  var st = stats();
  document.getElementById('stats').textContent = '已答 ' + st.done + ' · 对 ' + st.ok + ' · 错 ' + st.ng + '（共 ' + QS.length + ' 题）';
  var opts = document.querySelectorAll('.opt');
  for (var j = 0; j < opts.length; j++){
    opts[j].addEventListener('click', function(ev){
      ev.stopPropagation();
      if (arrange){ placeOpt(+this.getAttribute('data-opt')); return; }
      if (res[cur]) return;
      res[cur] = +this.getAttribute('data-opt');
      lsS('n1qz_res', JSON.stringify(res));
      show(cur);
    });
  }
  if (arrange){
    renderSeq();
    var jb = document.getElementById('judgebtn');
    if (jb) jb.addEventListener('click', function(ev){ ev.stopPropagation(); judgeArrange(); });
  }
}
function jumpRandom(){
  var p = pool(); if (p.length < 2) return;
  var q; do { q = p[Math.floor(Math.random() * p.length)]; } while (q.id === cur);
  show(q.id);
}
function step(d){
  var p = pool(); if (!p.length) return;
  var i = -1;
  for (var k = 0; k < p.length; k++) if (p[k].id === cur) i = k;
  if (i < 0) i = 0;
  show(p[(i + d + p.length) % p.length].id);
}
function markFilters(){
  var sel = document.getElementById('sessSel'); if (sel) sel.value = sessFilter;
  var chips = document.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('on', +chips[i].getAttribute('data-t') === typeFilter);
}
function startApp(){
  if (started) return; started = true;
  document.getElementById('lock').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  var sel = document.getElementById('sessSel');
  var oh = '<option value="ALL">全部期次</option>';
  for (var i = 0; i < SESS.length; i++) oh += '<option value="' + esc(SESS[i]) + '">' + esc(SESS[i]) + '</option>';
  sel.innerHTML = oh;
  sel.addEventListener('change', function(){ sessFilter = sel.value; lsS('n1qz_sess', sessFilter); show(cur); });
  var chips = document.querySelectorAll('.chip');
  for (var j = 0; j < chips.length; j++){
    chips[j].addEventListener('click', function(ev){
      ev.stopPropagation();
      typeFilter = +this.getAttribute('data-t');
      lsS('n1qz_type', String(typeFilter));
      markFilters(); show(cur);
    });
  }
  document.getElementById('nbtn').addEventListener('click', function(ev){
    ev.stopPropagation();
    var d = document.body.classList.contains('dark') ? 'light' : 'dark';
    lsS('n1qz_theme', d); applyT(d);
  });
  document.getElementById('prevBtn').addEventListener('click', function(ev){ ev.stopPropagation(); step(-1); });
  document.getElementById('nextBtn').addEventListener('click', function(ev){ ev.stopPropagation(); step(1); });
  document.getElementById('randBtn').addEventListener('click', function(ev){ ev.stopPropagation(); jumpRandom(); });
  markFilters();
  show(cur);
  var lastTap = 0;
  document.addEventListener('dblclick', function(ev){
    if (ev.target.closest('.opt') || ev.target.closest('.topbar') || ev.target.closest('.botbar') || ev.target.closest('select') || ev.target.closest('.seq') || ev.target.closest('#judgebtn')) return;
    jumpRandom();
  });
  document.addEventListener('touchend', function(ev){
    if (ev.target.closest('.opt') || ev.target.closest('.topbar') || ev.target.closest('.botbar') || ev.target.closest('select') || ev.target.closest('.seq') || ev.target.closest('#judgebtn')) return;
    var now = Date.now();
    if (now - lastTap < 330){ jumpRandom(); lastTap = 0; } else lastTap = now;
  });
}
async function tryUnlock(pwd){
  var msg = document.getElementById('lockMsg');
  try {
    if (!window.crypto || !crypto.subtle){ msg.textContent = '当前浏览器不支持解密，请换 Safari/Chrome 打开。'; return; }
    var enc = JSON.parse(document.getElementById('encdata').textContent);
    function b64(s){ var bin = atob(s); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
    var salt = b64(enc.s), iv = b64(enc.i), ct = b64(enc.c);
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt: salt, iterations: 210000, hash:'SHA-256'}, km, {name:'AES-GCM', length: 256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
    var gz = new DecompressionStream('gzip');
    var text = await new Response(new Blob([pt]).stream().pipeThrough(gz)).text();
    var obj = JSON.parse(text);
    QS = obj.qs; SESS = obj.sess; DATA = obj;
    startApp();
  } catch(e){
    msg.textContent = '密码不正确，无法解密。';
  }
}
document.getElementById('unlockBtn').addEventListener('click', function(){
  var v = document.getElementById('pwdInput').value.trim();
  if (v) tryUnlock(v);
});
document.getElementById('pwdInput').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter') document.getElementById('unlockBtn').click();
});
var q = new URLSearchParams(location.search).get('pwd') || (location.hash.match(/pwd=([^&]+)/) || [])[1];
if (q) tryUnlock(decodeURIComponent(q).trim());
</script>
