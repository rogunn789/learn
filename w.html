<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>SuperMemo优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="https://rogunn789.github.io/learn/looup.js"></script>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; background-color: #000000; color: #ffffff; }
        body { 
             font-family: "LXGW WenKai", cursive;
            font-weight: 400;
            font-style: normal;
}
        [v-cloak] { display: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        button, input { touch-action: manipulation; }
    </style>
</head>
<body>

    <div id="app" v-cloak class="h-full w-full flex flex-col items-center justify-center p-4 box-border relative overflow-hidden">
         
        <button @click="speakBlock" 
                v-if="currentBlock && !loading && !needManualUpload"
                class="absolute top-4 left-4 md:top-8 md:left-8 w-12 h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm z-10">
            <i class="fa-solid fa-volume-high text-xl"></i>
        </button>

        <button @click="showSearch = true" 
                class="absolute top-4 right-4 md:top-8 md:right-8 w-12 h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm z-10">
            <i class="fa-solid fa-magnifying-glass text-xl"></i>
        </button>

        <div v-if="showSearch" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-start z-50 pt-16 md:pt-24" @click.self="closeSearch">
            <div class="bg-gray-900 w-11/12 max-w-2xl rounded-xl shadow-2xl flex flex-col max-h-[75vh] overflow-hidden border border-gray-700 transform transition-all">
                <div class="p-4 border-b border-gray-700 flex items-center gap-3 bg-gray-800">
                    <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
                    <input ref="searchInput" v-model="searchQuery" type="text" placeholder="输入关键字精准搜索 (如 ABC)..." class="w-full text-lg bg-transparent border-none focus:outline-none text-white placeholder-gray-500" @keyup.esc="closeSearch">
                    <button @click="closeSearch" class="text-gray-500 hover:text-white px-2 text-2xl leading-none">&times;</button>
                </div>
                <div class="overflow-y-auto flex-grow p-2">
                    <div v-if="searchQuery.trim()" class="flex flex-col gap-1">
                        <div v-for="(item, index) in searchResults" :key="index" 
                             @click="selectBlock(item)" 
                             class="p-4 rounded-lg hover:bg-gray-800 cursor-pointer transition-colors border-b border-gray-800 last:border-0 text-gray-300 text-base active:bg-gray-700" 
                             v-html="highlightText(item, searchQuery)">
                        </div>
                        <div v-if="searchResults.length === 0" class="text-gray-500 text-center py-10">未找到包含该关键字的文本块</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-lg flex-1 flex flex-col py-2 min-h-0">
            
            <div class="flex flex-row items-center justify-center mb-6 shrink-0 font-bold tracking-widest" v-if="!loading && !needManualUpload">
                <!-- 整体进度与分数并排 -->
                <div class="text-lg md:text-xl text-gray-300 flex items-center flex-wrap justify-center gap-4">
                    <div>
                        <span title="已背诵个数" class="text-blue-400">{{ totalMemorized }}</span> 
                        <span class="text-gray-500 mx-1">/</span> 
                        <span title="总个数">{{ totalItems }}</span>
                    </div>
                    <div class="text-yellow-400 flex items-center" title="当前内容分数">
                        <i class="fa-solid fa-star text-sm mr-1"></i>分数: {{ currentScore }}
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col rounded-xl min-h-0">
                <template v-if="loading">
                    <div class="flex-grow flex items-center justify-center text-gray-400"><span>古卷加载中...</span></div>
                </template>
                <template v-else-if="needManualUpload">
                    <div class="flex-grow flex flex-col items-center justify-center text-center">
                        <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-600 py-3 px-8 rounded-md transition text-white shadow-lg">
                            开启 w.txt 文件
                            <input type="file" class="hidden" accept=".txt" @change="handleFileUpload">
                        </label>
                    </div>
                </template>
                <template v-else>
                    <div class="flex-1 flex flex-col items-center justify-center py-2 overflow-y-auto w-full min-h-0">
                        <!-- 修改渲染方式：一行一个div，第一行32px居中 -->
                        <div class="w-full flex flex-col min-h-full justify-center">
                            <div v-for="(line, index) in currentBlockLines" :key="index"
                                 :class="index === 0 ? 'text-[32px] text-center font-bold mb-4' : 'text-xl md:text-2xl text-left'"
                                 class="w-full break-words whitespace-pre-wrap leading-relaxed text-white looupwrap">
                                {{ line }}
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-8 mt-4 shrink-0">
                        <button @click="handleAnswer('Simple')" class="flex flex-col items-center p-4 text-green-500 hover:bg-gray-800 rounded-xl transition-all active:scale-95">
                            <i class="fa-solid fa-leaf text-4xl mb-2"></i>
                            <span class="text-sm font-bold tracking-widest mt-2">简单 (+1分)</span>
                        </button>
                        <button @click="handleAnswer('Blur')" class="flex flex-col items-center p-4 text-yellow-500 hover:bg-gray-800 rounded-xl transition-all active:scale-95">
                            <i class="fa-solid fa-cloud text-4xl mb-2"></i>
                            <span class="text-sm font-bold tracking-widest mt-2">模糊 (-1分)</span>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

        const DB_NAME = 'VocabAppDB';
        const STORE_NAME = 'records';
        const initDB = () => {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
            });
        };

        const getRecordsFromDB = async (db) => {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => {
                    const data = {};
                    req.result.forEach(item => { data[item.id] = item; });
                    resolve(data);
                };
            });
        };

        const saveRecordToDB = async (db, id, record) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put({ id, ...record });
        };

        const cleanupDB = async (db, validBlocks) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAllKeys();
            req.onsuccess = () => {
                const keys = req.result;
                const validSet = new Set(validBlocks);
                keys.forEach(key => {
                    if (!validSet.has(key)) {
                        store.delete(key);
                    }
                });
            };
        };

        const shuffleArray = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        createApp({
            setup() {
                const db = ref(null);
                const blocks = ref([]);     
                const records = ref({}); 
                const queue = ref([]); 
                const currentBlockObj = ref(null);
                const loading = ref(true);
                const needManualUpload = ref(false);
                const showSearch = ref(false);
                const searchQuery = ref('');
                const searchInput = ref(null);

                const currentBlock = computed(() => currentBlockObj.value || '');

                // 当前背诵内容的分数
                const currentScore = computed(() => {
                    const r = records.value[currentBlock.value];
                    return r ? (r.score || 0) : 0;
                });

                // 总共背过的个数（只要背过一次就算）
                const totalMemorized = computed(() => blocks.value.filter(b => {
                    const r = records.value[b];
                    return r && (r.simpleCount > 0 || r.blurCount > 0);
                }).length);

                // 总个数
                const totalItems = computed(() => blocks.value.length);
                
                // 按行分割供页面循环渲染
                const currentBlockLines = computed(() => {
                    if (!currentBlock.value) return [];
                    return currentBlock.value.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                });

                watch(showSearch, (newVal) => {
                    if (newVal) {
                        nextTick(() => { if (searchInput.value) searchInput.value.focus(); });
                    }
                });

                const searchResults = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return [];
                    return blocks.value.filter(b => b.toLowerCase().includes(q)).slice(0, 100);
                });

                const highlightText = (text, query) => {
                    if (!text) return '';
                    let cleanQuery = query.trim();
                    if (!cleanQuery) return text;
                    const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({
                        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                    })[m]);
                    let escapedText = escapeHtml(text);
                    let escapedQuery = escapeHtml(cleanQuery);
                    const safeRegexQuery = escapedQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`(${safeRegexQuery})`, 'gi');
                    return escapedText.replace(regex, '<span class="bg-yellow-500 text-black font-bold px-1 rounded shadow-sm">$1</span>');
                };

                const closeSearch = () => { showSearch.value = false; searchQuery.value = ''; };
                const selectBlock = (block) => { 
                    currentBlockObj.value = block; 
                    closeSearch(); 
                    queue.value = []; 
                };

                // --- 核心算法：基于分数的新定制算法 ---
                const pickNextBlock = () => {
                    if (blocks.value.length === 0) return;

                    if (queue.value.length > 0) {
                        currentBlockObj.value = queue.value.shift();
                        return;
                    }

                    const now = Date.now();
                    const dataList = blocks.value.map(b => {
                        let r = records.value[b] || { simpleCount: 0, blurCount: 0, lastTime: 0, score: 0 };
                        if (r.score === undefined) r.score = 0;
                        return { text: b, ...r };
                    });

                    let selected = [];
                    let usedTexts = new Set();

                    // 1. 抽取 1 张随机（优先从未背诵中取）
                    let unreviewedPool = dataList.filter(d => d.simpleCount === 0 && d.blurCount === 0);
                    if (unreviewedPool.length > 0) {
                        unreviewedPool = shuffleArray(unreviewedPool);
                        let randomOne = unreviewedPool[0];
                        selected.push(randomOne);
                        usedTexts.add(randomOne.text);
                    } else {
                        // 如果没有未背诵的了，从所有卡片中随机取1张
                        let allShuffled = shuffleArray([...dataList]);
                        let randomOne = allShuffled[0];
                        selected.push(randomOne);
                        usedTexts.add(randomOne.text);
                    }

                    // 2. 抽取 9 张，条件：上次背诵 >= 30秒(30000ms)，按分数升序取前20个，从中随机取9个
                    let reviewedPool = dataList
                        .filter(d => (d.simpleCount > 0 || d.blurCount > 0) && (now - d.lastTime >= 30000) && !usedTexts.has(d.text))
                        .sort((a, b) => a.score - b.score); 
                    
                    // 取分数最低的前20个
                    let lowest20 = reviewedPool.slice(0, 20);
                    lowest20 = shuffleArray(lowest20); // 打乱这20个
                    let selectedReviewed = lowest20.slice(0, 9); // 取出9个
                    
                    selected.push(...selectedReviewed);
                    selectedReviewed.forEach(d => usedTexts.add(d.text));

                    // 3. 兜底策略: 如果不够10张（比如刚开始背，符合30秒条件的少于9个）
                    if (selected.length < 10) {
                        let needCount = 10 - selected.length;
                        // 先从未背诵的补齐
                        let remainingUnreviewed = unreviewedPool.filter(d => !usedTexts.has(d.text));
                        let fillUnreviewed = remainingUnreviewed.slice(0, needCount);
                        selected.push(...fillUnreviewed);
                        fillUnreviewed.forEach(d => usedTexts.add(d.text));
                    }
                    if (selected.length < 10) {
                        let needCount = 10 - selected.length;
                        // 依然不够，无视30秒限制，从剩下的已背卡片中按分数从低到高补齐
                        let remainingReviewed = dataList
                            .filter(d => (d.simpleCount > 0 || d.blurCount > 0) && !usedTexts.has(d.text))
                            .sort((a, b) => a.score - b.score);
                        let fillReviewed = remainingReviewed.slice(0, needCount);
                        selected.push(...fillReviewed);
                        fillReviewed.forEach(d => usedTexts.add(d.text));
                    }

                    // 4. 将选出的 10 张打乱顺序进入队列
                    selected = shuffleArray(selected);
                    queue.value = selected.map(item => item.text);

                    if (queue.value.length > 0) {
                        currentBlockObj.value = queue.value.shift();
                    } else {
                        currentBlockObj.value = blocks.value[0];
                    }
                };

                // --- 核心操作：更新统计与时间 ---
                const handleAnswer = async (type) => {
                    const b = currentBlock.value;
                    if (!b) return;

                    let rec = records.value[b] || { 
                        simpleCount: 0, blurCount: 0, lastTime: 0, score: 0 
                    };
                    
                    // 兼容旧数据
                    if (rec.score === undefined) rec.score = 0;

                    const now = Date.now();

                    // 点击容易加1分，点击模糊减1分
                    if (type === 'Simple') {
                        rec.simpleCount++;
                        rec.score += 1;
                    } else { 
                        rec.blurCount++;
                        rec.score -= 1;
                    }
                    
                    rec.lastTime = now; // 记录最近的背诵时间
                    
                    records.value[b] = rec;

                    if (db.value) await saveRecordToDB(db.value, b, rec);
                    
                    pickNextBlock();
                };

                const parseText = (text) => {
                    const normalizedText = text.replace(/\r\n/g, '\n');
                    // 直接按照空行分割背诵内容
                    const finalBlocks = normalizedText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);

                    blocks.value = finalBlocks;

                    const currentSet = new Set(finalBlocks);
                    for (const key in records.value) {
                        if (!currentSet.has(key)) {
                            delete records.value[key];
                        }
                    }

                    if (db.value) {
                        cleanupDB(db.value, finalBlocks);
                    }
                    
                    queue.value = []; 
                    if (blocks.value.length > 0) pickNextBlock();
                    loading.value = false;
                    needManualUpload.value = false;
                };

                const initData = async () => {
                    db.value = await initDB();
                    records.value = await getRecordsFromDB(db.value);
                    try {
                        const res = await fetch('w.txt?_=' + Date.now(), { cache: 'no-store' });
                        if (!res.ok) throw new Error();
                        const text = await res.text();
                        parseText(text);
                    } catch (e) {
                        needManualUpload.value = true;
                        loading.value = false;
                    }
                };

                const handleFileUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    loading.value = true;
                    const reader = new FileReader();
                    reader.onload = (e) => parseText(e.target.result);
                    reader.readAsText(file);
                };

                const speakBlock = () => {
                    if (!currentBlockLines.value || currentBlockLines.value.length === 0) return;
                    window.speechSynthesis.cancel();
                    // 仅读取第一行内容
                    const textToSpeak = currentBlockLines.value[0];
                    const u = new SpeechSynthesisUtterance(textToSpeak);
                    u.lang = 'ja-JP';
                    window.speechSynthesis.speak(u);
                };

                onMounted(() => initData());

                return {
                    loading, needManualUpload, currentBlock, currentBlockLines,
                    currentScore, totalMemorized, totalItems,
                    handleAnswer, handleFileUpload, speakBlock,
                    showSearch, searchQuery, searchResults, searchInput,
                    closeSearch, selectBlock, highlightText
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
