<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>文本块记忆 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000000; color: #ffffff; }
        body { font-family: 'Noto Serif JP', serif; }
        [v-cloak] { display: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        button, input { touch-action: manipulation; }
    </style>
</head>
<body>

    <div id="app" v-cloak class="h-full w-full flex flex-col items-center justify-center p-4 box-border relative">
         
        <!-- 左上角发音按钮 -->
        <button @click="speakBlock" 
                v-if="currentBlock && !loading && !needManualUpload && blocks.length > 0"
                class="absolute top-4 left-4 md:top-8 md:left-8 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm z-10">
            <i class="fa-solid fa-volume-high text-lg md:text-xl"></i>
        </button>

        <!-- 顶部居中显示该卡片的平均浏览时间 -->
        <div v-if="currentBlock && !loading && !needManualUpload && blocks.length > 0" 
             class="absolute top-5 md:top-9 left-1/2 transform -translate-x-1/2 flex items-center justify-center bg-gray-800 px-4 py-1.5 rounded-full border border-gray-600 shadow-md z-10 text-gray-300 font-bold tracking-wider text-base md:text-lg">
            <i class="fa-regular fa-clock mr-2 text-sm text-gray-400"></i>
            {{ Math.round(currentAvgTime) }}s
        </div>

        <!-- 右上角按钮组：搜索 + 移除 -->
        <div class="absolute top-4 right-4 md:top-8 md:right-8 flex space-x-3 z-10">
            <button @click="showSearch = true" 
                    class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm">
                <i class="fa-solid fa-magnifying-glass text-lg md:text-xl"></i>
            </button>
            <button @click="removeCurrentCard" 
                    v-if="currentBlock && !loading && !needManualUpload && blocks.length > 0"
                    title="移除此卡片"
                    class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-red-800 text-gray-100 transition-colors shadow-sm">
                <i class="fa-solid fa-trash-can text-lg md:text-xl"></i>
            </button>
        </div>

        <div v-if="showSearch" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-start z-50 pt-16 md:pt-24" @click.self="closeSearch">
            <div class="bg-gray-900 w-11/12 max-w-2xl rounded-xl shadow-2xl flex flex-col max-h-[75vh] overflow-hidden border border-gray-700 transform transition-all">
                <div class="p-4 border-b border-gray-700 flex items-center gap-3 bg-gray-800">
                    <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
                    <input ref="searchInput" v-model="searchQuery" type="text" placeholder="输入关键字精准搜索 (如 ABC)..." class="w-full text-lg bg-transparent border-none focus:outline-none text-white placeholder-gray-500" @keyup.esc="closeSearch">
                    <button @click="closeSearch" class="text-gray-500 hover:text-white px-2 text-2xl leading-none">&times;</button>
                </div>
                <div class="overflow-y-auto flex-grow p-2">
                    <div v-if="searchQuery.trim()" class="flex flex-col gap-1">
                        <div v-for="(item, index) in searchResults" :key="index" 
                             @click="selectBlock(item)" 
                             class="p-4 rounded-lg hover:bg-gray-800 cursor-pointer transition-colors border-b border-gray-800 last:border-0 text-gray-300 text-base active:bg-gray-700" 
                             v-html="highlightText(item, searchQuery)">
                        </div>
                        <div v-if="searchResults.length === 0" class="text-gray-500 text-center py-10">未找到包含该关键字的文本块</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-lg h-full flex flex-col py-2 mt-12 md:mt-16">
            <!-- 顶部统计：已学习卡片数 / 未学习卡片数 -->
            <div v-if="blocks.length > 0" class="flex justify-center items-center space-x-16 mb-4 text-2xl md:text-3xl font-bold tracking-widest shrink-0">
                <span class="text-green-500" title="已浏览">{{ countRead }}</span>
                <span class="text-red-500" title="未浏览">{{ countUnread }}</span>
            </div>

            <div class="flex-grow flex flex-col rounded-xl overflow-hidden" style="height: 100%;">
                <template v-if="loading">
                    <div class="flex-grow flex items-center justify-center text-gray-400"><span>古卷加载中...</span></div>
                </template>
                <template v-else-if="needManualUpload">
                    <div class="flex-grow flex flex-col items-center justify-center text-center">
                        <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-600 py-3 px-8 rounded-md transition text-white shadow-lg">
                            开启 w.txt 文件
                            <input type="file" class="hidden" accept=".txt" @change="handleFileUpload">
                        </label>
                    </div>
                </template>
                <template v-else-if="blocks.length === 0">
                    <div class="flex-grow flex flex-col items-center justify-center text-center text-gray-400 px-4">
                        <i class="fa-solid fa-box-open text-5xl mb-4"></i>
                        <p>所有卡片已被移除或文件为空。<br>请检查源文件或清空浏览器缓存重置。</p>
                    </div>
                </template>
                <template v-else>
                    <!-- 文本展示区，居中且上部对齐 -->
                    <div @click="revealCard" class="flex-grow flex items-start justify-center pt-8 pb-4 overflow-y-auto relative cursor-pointer w-full group">
                        <p :class="['text-xl md:text-2xl font-bold text-center leading-relaxed break-words whitespace-pre-wrap w-full transition-all', currentTextColor]">
                            {{ isRevealed ? currentBlock : firstLine }}
                        </p>
                        
                        <div v-if="!isRevealed" class="absolute bottom-4 text-gray-500 text-sm animate-pulse flex items-center flex-col">
                            <i class="fa-solid fa-hand-pointer mb-1"></i>
                            点击屏幕显示全部内容
                        </div>
                    </div>
                    
                    <!-- 底部单个按钮 -->
                    <div class="w-full mt-4 shrink-0 flex justify-center pb-2">
                        <button @click="nextCard" class="w-full max-w-xs flex flex-col items-center justify-center p-4 bg-gray-800 hover:bg-gray-700 border border-gray-600 rounded-xl transition-all active:scale-95 shadow-lg group">
                            <i class="fa-solid fa-arrow-right text-3xl mb-2 text-blue-400 group-hover:text-blue-300"></i>
                            <span class="text-sm font-bold tracking-widest text-gray-200">下一张</span>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

        const DB_NAME = 'VocabAppDB';
        const STORE_NAME = 'records';
        const initDB = () => {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
            });
        };

        const getRecordsFromDB = async (db) => {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => {
                    const data = {};
                    req.result.forEach(item => { data[item.id] = item; });
                    resolve(data);
                };
            });
        };

        const saveRecordToDB = async (db, id, record) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put({ id, ...record });
        };

        const cleanupDB = async (db, validBlocks) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAllKeys();
            req.onsuccess = () => {
                const keys = req.result;
                const validSet = new Set(validBlocks);
                keys.forEach(key => {
                    if (!validSet.has(key)) {
                        store.delete(key);
                    }
                });
            };
        };

        const shuffleArray = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex > 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        createApp({
            setup() {
                const db = ref(null);
                const blocks = ref([]);     
                const records = ref({}); 
                const queue = ref([]); 
                const currentBlockObj = ref(null);
                const loading = ref(true);
                const needManualUpload = ref(false);
                const showSearch = ref(false);
                const searchQuery = ref('');
                const searchInput = ref(null);
                
                const cardStartTime = ref(0); 
                const isRevealed = ref(false); 

                const colorPalette = [
                    'text-white', 'text-green-300', 'text-blue-300', 'text-yellow-300', 
                    'text-purple-300', 'text-pink-300', 'text-teal-300', 'text-orange-300'
                ];
                const currentTextColor = ref('text-white');

                const countRead = computed(() => blocks.value.filter(b => {
                    const r = records.value[b];
                    return r && r.viewCount > 0; 
                }).length);

                const countUnread = computed(() => blocks.value.filter(b => {
                    const r = records.value[b];
                    return !r || !r.viewCount || r.viewCount === 0;
                }).length);

                const currentBlock = computed(() => currentBlockObj.value || '');
                
                const firstLine = computed(() => {
                    if (!currentBlock.value) return '';
                    const lines = currentBlock.value.split('\n');
                    return lines[0] + (lines.length > 1 ? '\n...' : '');
                });

                const currentAvgTime = computed(() => {
                    if (!currentBlock.value || !records.value[currentBlock.value]) return 0;
                    return records.value[currentBlock.value].avgViewTime || 0;
                });

                watch(showSearch, (newVal) => {
                    if (newVal) {
                        nextTick(() => { if (searchInput.value) searchInput.value.focus(); });
                    }
                });

                const searchResults = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return [];
                    return blocks.value.filter(b => b.toLowerCase().includes(q)).slice(0, 100);
                });

                const highlightText = (text, query) => {
                    if (!text) return '';
                    let cleanQuery = query.trim();
                    if (!cleanQuery) return text;
                    const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({
                        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                    })[m]);
                    let escapedText = escapeHtml(text);
                    let escapedQuery = escapeHtml(cleanQuery);
                    const safeRegexQuery = escapedQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(`(${safeRegexQuery})`, 'gi');
                    return escapedText.replace(regex, '<span class="bg-yellow-500 text-black font-bold px-1 rounded shadow-sm">$1</span>');
                };

                const closeSearch = () => { showSearch.value = false; searchQuery.value = ''; };
                
                const selectBlock = (block) => { 
                    currentBlockObj.value = block; 
                    closeSearch(); 
                    queue.value = []; 
                    isRevealed.value = false; 
                    cardStartTime.value = Date.now(); 
                };

                const revealCard = () => {
                    if (!isRevealed.value) {
                        isRevealed.value = true;
                    }
                };

                const removeCurrentCard = async () => {
                    const b = currentBlock.value;
                    if (!b) return;
                    
                    if (!confirm('确定要将此卡片移出题库吗？移除后将不再出现。')) return;

                    let rec = records.value[b] || { viewCount: 0, totalViewTime: 0, avgViewTime: 0 };
                    rec.isRemoved = true; 
                    records.value[b] = rec;
                    if (db.value) await saveRecordToDB(db.value, b, rec);

                    blocks.value = blocks.value.filter(item => item !== b);
                    queue.value = queue.value.filter(item => item !== b);

                    if (blocks.value.length === 0) {
                        currentBlockObj.value = "";
                        return;
                    }

                    if (queue.value.length > 0) {
                        currentBlockObj.value = queue.value.shift();
                        isRevealed.value = false;
                        cardStartTime.value = Date.now();
                    } else {
                        pickNextBlock();
                    }
                };

                const pickNextBlock = () => {
                    if (blocks.value.length === 0) return;

                    if (queue.value.length > 0) {
                        currentBlockObj.value = queue.value.shift();
                        isRevealed.value = false;
                        cardStartTime.value = Date.now(); 
                        return;
                    }

                    const availableColors = colorPalette.filter(c => c !== currentTextColor.value);
                    currentTextColor.value = availableColors[Math.floor(Math.random() * availableColors.length)];

                    let dataList = blocks.value.map(b => {
                        let r = records.value[b] || { viewCount: 0, totalViewTime: 0, avgViewTime: 0 };
                        return { 
                            text: b, 
                            avgViewTime: r.avgViewTime || 0,
                            viewCount: r.viewCount || 0
                        };
                    });

                    let unreadPool = dataList.filter(d => d.viewCount === 0);
                    let readPool = dataList.filter(d => d.viewCount > 0);

                    shuffleArray(unreadPool);
                    readPool.sort((a, b) => b.avgViewTime - a.avgViewTime);

                    let oldCards = [];
                    let newCards = [];

                    newCards.push(...unreadPool.splice(0, 2));

                    let needed = 10 - newCards.length;
                    oldCards.push(...readPool.splice(0, needed));

                    if (oldCards.length + newCards.length < 10) {
                        needed = 10 - (oldCards.length + newCards.length);
                        newCards.push(...unreadPool.splice(0, needed));
                    }

                    let selected = [...oldCards, ...newCards];
                    
                    queue.value = selected.map(item => item.text);
                    currentBlockObj.value = queue.value.shift();
                    isRevealed.value = false;
                    cardStartTime.value = Date.now();
                };

                const nextCard = async () => {
                    const b = currentBlock.value;
                    if (!b) return;

                    const now = Date.now();
                    let spentSeconds = (now - cardStartTime.value) / 1000;
                    
                    if (spentSeconds > 60) {
                        spentSeconds = 60;
                    }

                    let rec = records.value[b] || { viewCount: 0, totalViewTime: 0, avgViewTime: 0 };
                    if (rec.viewCount === undefined) {
                        rec = { viewCount: 0, totalViewTime: 0, avgViewTime: 0 };
                    }

                    rec.viewCount += 1;
                    rec.totalViewTime += spentSeconds;
                    rec.avgViewTime = rec.totalViewTime / rec.viewCount;

                    records.value[b] = rec;

                    if (db.value) await saveRecordToDB(db.value, b, rec);
                    
                    pickNextBlock();
                };

                const parseText = (text) => {
                    const normalizedText = text.replace(/\r\n/g, '\n');
                    const rawBlocks = normalizedText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
                    const allParsedBlocks = [];

                    rawBlocks.forEach(block => {
                        const lines = block.split('\n');
                        if (lines.length > 20) {
                            lines.forEach(line => {
                                const trimmedLine = line.trim();
                                if (trimmedLine.length > 0) {
                                    allParsedBlocks.push(trimmedLine);
                                }
                            });
                        } else {
                            allParsedBlocks.push(block);
                        }
                    });

                    const currentSet = new Set(allParsedBlocks);
                    
                    // 1. 彻底清理内存和数据库中：在 w.txt 已经不存在的旧卡片记录
                    for (const key in records.value) {
                        if (!currentSet.has(key)) {
                            delete records.value[key];
                        }
                    }

                    if (db.value) {
                        cleanupDB(db.value, allParsedBlocks);
                    }
                    
                    // 2. 过滤掉被手动移除的卡片与不在 w.txt 中的卡片
                    blocks.value = allParsedBlocks.filter(b => {
                        return !(records.value[b] && records.value[b].isRemoved);
                    });

                    queue.value = []; 
                    if (blocks.value.length > 0) {
                        pickNextBlock();
                    }
                    loading.value = false;
                    needManualUpload.value = false;
                };

                const initData = async () => {
                    db.value = await initDB();
                    records.value = await getRecordsFromDB(db.value);
                    try {
                        const res = await fetch('w.txt?_=' + Date.now(), { cache: 'no-store' });
                        if (!res.ok) throw new Error();
                        const text = await res.text();
                        parseText(text);
                    } catch (e) {
                        needManualUpload.value = true;
                        loading.value = false;
                    }
                };

                const handleFileUpload = (event) => {
                    const file = event.target.files[0];
                    if (!file) return;
                    loading.value = true;
                    const reader = new FileReader();
                    reader.onload = (e) => parseText(e.target.result);
                    reader.readAsText(file);
                };

                const speakBlock = () => {
                    if (!currentBlock.value) return;
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(currentBlock.value);
                    u.lang = 'ja-JP';
                    window.speechSynthesis.speak(u);
                };

                onMounted(() => initData());

                return {
                    loading, needManualUpload, currentBlock, currentAvgTime,
                    blocks, firstLine, isRevealed, revealCard,
                    countRead, countUnread, currentTextColor,
                    nextCard, removeCurrentCard, handleFileUpload, speakBlock,
                    showSearch, searchQuery, searchResults, searchInput,
                    closeSearch, selectBlock, highlightText
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
