<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>SuperMemo优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="https://rogunn789.github.io/learn/looup.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style id="custom-font-style"></style>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden; background-color: #000000; color: #ffffff; }
        body { 
            font-family: "LXGW WenKai", cursive;
            font-weight: 400;
            font-style: normal;
            font-size: 24px;
            line-height: 1.6;
        }
        [v-cloak] { display: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
        button, input, select { touch-action: manipulation; }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: #111827;
            border: 1px solid #374151;
            color: #f3f4f6;
        }
    </style>
</head>
<body>

    <div id="app" v-cloak class="h-full w-full flex flex-col items-center justify-center p-4 box-border relative overflow-hidden">
         
        <!-- 顶部左侧：朗读全部内容按钮 -->
        <button @click="speakBlock" 
                v-if="currentBlock && !loading && !needManualUpload"
                title="朗读全部背诵内容"
                class="absolute top-4 left-4 md:top-8 md:left-8 w-12 h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm z-10 active:scale-95">
            <i class="fa-solid fa-volume-high text-xl"></i>
        </button>

        <!-- 顶部右侧：搜索 & 设置按钮组 -->
        <div class="absolute top-4 right-4 md:top-8 md:right-8 flex items-center gap-3 z-10">
            <button @click="showSearch = true" 
                    title="搜索"
                    class="w-12 h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm active:scale-95">
                <i class="fa-solid fa-magnifying-glass text-xl"></i>
            </button>
            <button @click="showSettings = true" 
                    title="阅读设置"
                    class="w-12 h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-gray-700 text-gray-100 transition-colors shadow-sm active:scale-95">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </div>

        <!-- 搜索弹窗 -->
        <div v-if="showSearch" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-start z-50 pt-16 md:pt-24" @click.self="closeSearch">
            <div class="bg-gray-900 w-11/12 max-w-2xl rounded-xl shadow-2xl flex flex-col max-h-[75vh] overflow-hidden border border-gray-700 transform transition-all">
                <div class="p-4 border-b border-gray-700 flex items-center gap-3 bg-gray-800">
                    <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
                    <input ref="searchInput" v-model="searchQuery" type="text" placeholder="输入关键字精准搜索 (如 ABC)..." class="w-full text-lg bg-transparent border-none focus:outline-none text-white placeholder-gray-500" @keyup.esc="closeSearch">
                    <button @click="closeSearch" class="text-gray-500 hover:text-white px-2 text-2xl leading-none">&times;</button>
                </div>
                <div class="overflow-y-auto flex-grow p-2">
                    <div v-if="searchQuery.trim()" class="flex flex-col gap-1">
                        <div v-for="(item, index) in searchResults" :key="index" 
                             @click="selectBlock(item)" 
                             class="p-4 rounded-lg hover:bg-gray-800 cursor-pointer transition-colors border-b border-gray-800 last:border-0 text-gray-300 text-base active:bg-gray-700" 
                             v-html="highlightText(item, searchQuery)">
                        </div>
                        <div v-if="searchResults.length === 0" class="text-gray-500 text-center py-10">未找到包含该关键字的文本块</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 参照 ireader 的设置弹窗 -->
        <div v-if="showSettings" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay" @click.self="showSettings = false">
            <div class="modal-content w-11/12 max-w-md rounded-2xl shadow-2xl p-6 relative border border-gray-700">
                <button @click="showSettings = false" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <h2 class="text-xl font-bold mb-6 text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-amber-500"></i> 阅读与发音设置
                </h2>
                
                <div class="space-y-5 text-sm">
                    <!-- 字体大小 -->
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-gray-300">字体大小 (Font Size)</span>
                        <div class="flex items-center space-x-2">
                            <button @click="changeFontSize(-2)" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center font-bold text-lg border border-gray-700">-</button>
                            <span class="w-12 text-center font-mono text-amber-400">{{ settings.fontSize }}px</span>
                            <button @click="changeFontSize(2)" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center font-bold text-lg border border-gray-700">+</button>
                        </div>
                    </div>

                    <!-- 行间距 -->
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-gray-300">行间距 (Line Spacing)</span>
                        <div class="flex items-center space-x-2">
                            <button @click="changeLineSpacing(-0.2)" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center font-bold text-lg border border-gray-700">-</button>
                            <span class="w-12 text-center font-mono text-amber-400">{{ settings.lineSpacing.toFixed(1) }}</span>
                            <button @click="changeLineSpacing(0.2)" class="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 flex items-center justify-center font-bold text-lg border border-gray-700">+</button>
                        </div>
                    </div>

                    <!-- TTS 语音发音 -->
                    <div class="pt-3 border-t border-gray-800">
                        <label class="block mb-2 font-medium text-gray-300">TTS 语音发音 (Japanese Voice)</label>
                        <select v-model="settings.selectedVoiceURI" @change="saveSettings" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-xs text-gray-200 focus:outline-none focus:border-amber-500">
                            <option value="">系统默认发音 (Default)</option>
                            <option v-for="voice in availableVoices" :key="voice.voiceURI" :value="voice.voiceURI">
                                {{ voice.name }} ({{ voice.lang }}) {{ voice.localService ? '[离线]' : '' }}
                            </option>
                        </select>
                    </div>

                    <!-- 自定义字体 -->
                    <div class="pt-3 border-t border-gray-800">
                        <label class="block mb-2 font-medium text-gray-300">自定义字体 (.ttf, .otf)</label>
                        <input type="file" accept=".ttf,.otf" class="block w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 cursor-pointer" @change="handleFontUpload">
                        <p class="text-xs text-gray-400 mt-1">
                            {{ settings.fontName ? '已启用: ' + settings.fontName : '未设置自定义字体 (默认: 霞鹜文楷)' }}
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="w-full max-w-lg flex-1 flex flex-col py-2 min-h-0">
            
            <div class="flex flex-row items-center justify-center mb-6 shrink-0 font-bold tracking-widest" v-if="!loading && !needManualUpload">
                <div class="text-lg md:text-xl text-gray-300 flex items-center flex-wrap justify-center gap-4">
                    <div>
                        <span title="已背诵个数" class="text-blue-400">{{ totalMemorized }}</span> 
                        <span class="text-gray-500 mx-1">/</span> 
                        <span title="总个数">{{ totalItems }}</span>
                    </div>
                    <div class="text-yellow-400 flex items-center" title="当前内容分数">
                        <i class="fa-solid fa-star text-sm mr-1"></i>分数: {{ currentScore }}
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col rounded-xl min-h-0">
                <template v-if="loading">
                    <div class="flex-grow flex items-center justify-center text-gray-400"><span>古卷解密加载中...</span></div>
                </template>
                <template v-else-if="needManualUpload">
                    <div class="flex-grow flex flex-col items-center justify-center text-center">
                        <p class="text-red-400 text-base mb-4" v-if="errorMessage">{{ errorMessage }}</p>
                        <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-600 py-3 px-8 rounded-md transition text-white shadow-lg">
                            手动上传已加密/未加密的 w.txt
                            <input type="file" class="hidden" accept=".txt" @change="handleFileUpload">
                        </label>
                    </div>
                </template>
                <template v-else>
                    <div class="flex-1 flex flex-col items-center justify-start py-4 overflow-y-auto w-full min-h-0">
                        <div class="w-full flex flex-col min-h-full justify-start gap-4 px-2 py-2" :style="{ fontSize: settings.fontSize + 'px', lineHeight: settings.lineSpacing }">
                            <div v-for="(line, index) in currentBlockLines" :key="index"
                                 class="w-full break-words whitespace-pre-wrap leading-relaxed text-white text-left looupwrap"
                                 v-html="formatLine(line)">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-8 mt-4 shrink-0">
                        <button @click="handleAnswer('Simple')" class="flex flex-col items-center p-4 text-green-500 hover:bg-gray-800 rounded-xl transition-all active:scale-95">
                            <i class="fa-solid fa-leaf text-4xl mb-2"></i>
                            <span class="text-sm font-bold tracking-widest mt-2">简单 (+1分)</span>
                        </button>
                        <button @click="handleAnswer('Blur')" class="flex flex-col items-center p-4 text-yellow-500 hover:bg-gray-800 rounded-xl transition-all active:scale-95">
                            <i class="fa-solid fa-cloud text-4xl mb-2"></i>
                            <span class="text-sm font-bold tracking-widest mt-2">模糊 (-1分)</span>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </div>

<script>
    const { createApp, ref, computed, onMounted, watch, nextTick, reactive } = Vue;

    // --- 自适应版 XXTEA 解密算法 ---
    const CustomXXTEA = (() => {
        const DELTA = 0x9E3779B9;
        const toUint32Array = (bs, includeLength) => {
            const length = bs.length;
            let n = length >> 2;
            if ((length & 3) !== 0) ++n;
            let result;
            if (includeLength) {
                result = new Uint32Array(n + 1);
                result[n] = length;
            } else {
                result = new Uint32Array(n);
            }
            for (let i = 0; i < length; ++i) {
                result[i >> 2] |= bs[i] << ((i & 3) << 3);
            }
            return result;
        };
        
        const toUint8Array = (v, includeLength) => {
            const length = v.length;
            let n = length << 2;
            let isLengthAppended = false;
            
            if (includeLength) {
                const m = v[length - 1];
                if (m >= (n - 7) && m <= (n - 4)) {
                    n = m;
                    isLengthAppended = true;
                }
            }
            
            const result = new Uint8Array(n);
            for (let i = 0; i < n; ++i) {
                result[i] = (v[i >> 2] >> ((i & 3) << 3)) & 0xff;
            }
            
            if (!isLengthAppended) {
                let actualLength = n;
                while (actualLength > 0 && result[actualLength - 1] === 0) {
                    actualLength--;
                }
                return result.subarray(0, actualLength);
            }
            return result;
        };
        
        return {
            decrypt: (dataBytes, keyBytes) => {
                if (dataBytes.length === 0) return new Uint8Array(0);
                const v = toUint32Array(dataBytes, false);
                let k = toUint32Array(keyBytes, false);
                if (k.length < 4) {
                    const newK = new Uint32Array(4);
                    newK.set(k);
                    k = newK;
                }
                const n = v.length - 1;
                if (n < 1) return dataBytes;
                let z = v[n], y = v[0], q = Math.floor(6 + 52 / (n + 1));
                let sum = (q * DELTA) >>> 0;
                while (sum !== 0) {
                    const e = sum >>> 2 & 3;
                    for (let p = n; p > 0; p--) {
                        z = v[p - 1];
                        y = v[p] = (v[p] - (((z >>> 5 ^ y << 2) + (y >>> 3 ^ z << 4)) ^ ((sum ^ y) + (k[(p & 3) ^ e] ^ z)))) >>> 0;
                    }
                    z = v[n];
                    y = v[0] = (v[0] - (((z >>> 5 ^ y << 2) + (y >>> 3 ^ z << 4)) ^ ((sum ^ y) + (k[(0 & 3) ^ e] ^ z)))) >>> 0;
                    sum = (sum - DELTA) >>> 0;
                }
                return toUint8Array(v, true);
            }
        };
    })();

    const decryptXXTEA = (encryptedBase64, keyStr) => {
        if (!keyStr || !encryptedBase64) return null;
        try {
            const cleanBase64 = encryptedBase64.replace(/[^A-Za-z0-9+/=]/g, '');
            if (!cleanBase64) return null;
            let binaryString;
            try {
                binaryString = window.atob(cleanBase64);
            } catch (e) {
                alert("⚠️ Base64 解析失败，数据格式不合法！");
                return null;
            }
            
            const dataBytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                dataBytes[i] = binaryString.charCodeAt(i);
            }

            const encoder = new TextEncoder();
            const keyBytes = encoder.encode(keyStr.trim());
            const finalKey = new Uint8Array(16); 
            finalKey.set(keyBytes.length > 16 ? keyBytes.subarray(0, 16) : keyBytes);

            const decryptedBytes = CustomXXTEA.decrypt(dataBytes, finalKey);
            
            if (!decryptedBytes || decryptedBytes.length === 0) {
                alert("⚠️ 解密失败：密钥错误或密文损坏！");
                return null;
            }

            return new TextDecoder().decode(decryptedBytes);
        } catch (e) {
            alert("⚠️ 未知解密异常: " + e.message);
            return null;
        }
    };

    const DB_NAME = 'VocabAppDB';
    const STORE_NAME = 'records';
    const initDB = () => {
        return new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            request.onsuccess = (e) => resolve(e.target.result);
        });
    };

    const getRecordsFromDB = async (db) => {
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => {
                const data = {};
                req.result.forEach(item => { data[item.id] = item; });
                resolve(data);
            };
        });
    };

    const saveRecordToDB = async (db, id, record) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({ id, ...record });
    };

    const cleanupDB = async (db, validBlocks) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAllKeys();
        req.onsuccess = () => {
            const keys = req.result;
            const validSet = new Set(validBlocks);
            keys.forEach(key => {
                if (!validSet.has(key)) store.delete(key);
            });
        };
    };

    const shuffleArray = (array) => {
        let currentIndex = array.length, randomIndex;
        while (currentIndex > 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    };

    // 防止 iOS Safari GC 回收
    let activeUtterance = null;

    createApp({
        setup() {
            const db = ref(null);
            const blocks = ref([]);     
            const records = ref({}); 
            const queue = ref([]); 
            const currentBlockObj = ref(null);
            const loading = ref(true);
            const needManualUpload = ref(false);
            const errorMessage = ref('');
            
            // 搜索与设置状态
            const showSearch = ref(false);
            const searchQuery = ref('');
            const searchInput = ref(null);
            const showSettings = ref(false);

            // 设置属性
            const settings = reactive({
                fontSize: 24,
                lineSpacing: 1.6,
                selectedVoiceURI: '',
                customFont: null,
                fontName: null
            });

            const availableVoices = ref([]);

            const currentBlock = computed(() => currentBlockObj.value || '');

            const currentScore = computed(() => {
                const r = records.value[currentBlock.value];
                return r ? (r.score || 0) : 0;
            });

            const totalMemorized = computed(() => blocks.value.filter(b => {
                const r = records.value[b];
                return r && (r.simpleCount > 0 || r.blurCount > 0);
            }).length);

            const totalItems = computed(() => blocks.value.length);
            
            const currentBlockLines = computed(() => {
                if (!currentBlock.value) return [];
                return currentBlock.value.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            });

            const formatLine = (line) => {
                if (!line) return '';
                const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[m]);
                let escaped = escapeHtml(line);
                return escaped.replace(/\/([^\/]+)\//g, '<span class="bg-yellow-500 text-black font-bold px-1 rounded shadow-sm">$1</span>');
            };

            // 设置与配置持久化
            const loadSettings = () => {
                const saved = localStorage.getItem('w_html_settings');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        Object.assign(settings, parsed);
                        applyCustomFont();
                    } catch(e) {}
                }
            };

            const saveSettings = () => {
                localStorage.setItem('w_html_settings', JSON.stringify(settings));
                applyCustomFont();
            };

            const changeFontSize = (delta) => {
                settings.fontSize = Math.max(12, Math.min(36, settings.fontSize + delta));
                saveSettings();
            };

            const changeLineSpacing = (delta) => {
                settings.lineSpacing = Math.max(1.2, Math.min(3.8, parseFloat((settings.lineSpacing + delta).toFixed(1))));
                saveSettings();
            };

            const handleFontUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    settings.customFont = e.target.result;
                    settings.fontName = file.name;
                    saveSettings();
                };
                reader.readAsDataURL(file);
            };

            const applyCustomFont = () => {
                const fontStyle = document.getElementById('custom-font-style');
                if (!fontStyle) return;
                if (settings.customFont) {
                    fontStyle.innerHTML = `
                        @font-face { font-family: 'CustomUserFont'; src: url(${settings.customFont}); }
                        body { font-family: 'CustomUserFont', "LXGW WenKai", cursive !important; }
                    `;
                } else {
                    fontStyle.innerHTML = '';
                }
            };

            const initVoiceList = () => {
                if (!('speechSynthesis' in window)) return;
                const updateVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    const jaVoices = voices.filter(v => v.lang.toLowerCase().includes('ja'));
                    availableVoices.value = jaVoices;
                };
                updateVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = updateVoices;
                }
            };

            watch(showSearch, (newVal) => {
                if (newVal) {
                    nextTick(() => { if (searchInput.value) searchInput.value.focus(); });
                }
            });

            const searchResults = computed(() => {
                const q = searchQuery.value.trim().toLowerCase();
                if (!q) return [];
                return blocks.value.filter(b => b.toLowerCase().includes(q)).slice(0, 100);
            });

            const highlightText = (text, query) => {
                if (!text) return '';
                let cleanQuery = query.trim();
                if (!cleanQuery) return text;
                const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[m]);
                let escapedText = escapeHtml(text);
                let escapedQuery = escapeHtml(cleanQuery);
                const safeRegexQuery = escapedQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${safeRegexQuery})`, 'gi');
                return escapedText.replace(regex, '<span class="bg-yellow-500 text-black font-bold px-1 rounded shadow-sm">$1</span>');
            };

            const closeSearch = () => { showSearch.value = false; searchQuery.value = ''; };
            const selectBlock = (block) => { 
                currentBlockObj.value = block; 
                closeSearch(); 
                queue.value = []; 
            };

            const pickNextBlock = () => {
                if (blocks.value.length === 0) return;
                if (queue.value.length > 0) {
                    currentBlockObj.value = queue.value.shift();
                    return;
                }
                const now = Date.now();
                const dataList = blocks.value.map(b => {
                    let r = records.value[b] || { simpleCount: 0, blurCount: 0, lastTime: 0, score: 0 };
                    if (r.score === undefined) r.score = 0;
                    return { text: b, ...r };
                });

                let selected = [];
                let usedTexts = new Set();
                let unreviewedPool = dataList.filter(d => d.simpleCount === 0 && d.blurCount === 0);
                
                if (unreviewedPool.length > 0) {
                    unreviewedPool = shuffleArray(unreviewedPool);
                    selected.push(unreviewedPool[0]);
                    usedTexts.add(unreviewedPool[0].text);
                } else {
                    let allShuffled = shuffleArray([...dataList]);
                    selected.push(allShuffled[0]);
                    usedTexts.add(allShuffled[0].text);
                }

                let reviewedPool = dataList
                    .filter(d => (d.simpleCount > 0 || d.blurCount > 0) && (now - d.lastTime >= 30000) && !usedTexts.has(d.text))
                    .sort((a, b) => a.score - b.score); 
                
                let lowest20 = shuffleArray(reviewedPool.slice(0, 20)); 
                let selectedReviewed = lowest20.slice(0, 9); 
                selected.push(...selectedReviewed);
                selectedReviewed.forEach(d => usedTexts.add(d.text));

                if (selected.length < 10) {
                    let fillUnreviewed = unreviewedPool.filter(d => !usedTexts.has(d.text)).slice(0, 10 - selected.length);
                    selected.push(...fillUnreviewed);
                    fillUnreviewed.forEach(d => usedTexts.add(d.text));
                }
                if (selected.length < 10) {
                    let fillReviewed = dataList
                        .filter(d => (d.simpleCount > 0 || d.blurCount > 0) && !usedTexts.has(d.text))
                        .sort((a, b) => a.score - b.score)
                        .slice(0, 10 - selected.length);
                    selected.push(...fillReviewed);
                    fillReviewed.forEach(d => usedTexts.add(d.text));
                }

                queue.value = shuffleArray(selected).map(item => item.text);
                currentBlockObj.value = queue.value.length > 0 ? queue.value.shift() : blocks.value[0];
            };

            const handleAnswer = async (type) => {
                const b = currentBlock.value;
                if (!b) return;
                let rec = records.value[b] || { simpleCount: 0, blurCount: 0, lastTime: 0, score: 0 };
                if (rec.score === undefined) rec.score = 0;
                
                if (type === 'Simple') {
                    rec.simpleCount++; rec.score += 1;
                } else { 
                    rec.blurCount++; rec.score -= 1;
                }
                
                rec.lastTime = Date.now();
                records.value[b] = rec;
                if (db.value) await saveRecordToDB(db.value, b, rec);
                pickNextBlock();
            };

            const parseText = (text) => {
                const normalizedText = text.replace(/\r\n/g, '\n');
                const finalBlocks = normalizedText.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);
                blocks.value = finalBlocks;

                const currentSet = new Set(finalBlocks);
                for (const key in records.value) {
                    if (!currentSet.has(key)) delete records.value[key];
                }
                if (db.value) cleanupDB(db.value, finalBlocks);
                
                queue.value = []; 
                if (blocks.value.length > 0) pickNextBlock();
                loading.value = false;
                needManualUpload.value = false;
            };

            const initData = async () => {
                loadSettings();
                initVoiceList();
                db.value = await initDB();
                records.value = await getRecordsFromDB(db.value);
                const urlParams = new URLSearchParams(window.location.search);
                const pawd = urlParams.get('pawd');

                try {
                    const res = await fetch('w.txt?_=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) throw new Error("无法加载 w.txt 文件");
                    
                    const encryptedBase64 = (await res.text()).trim();
                    if (!pawd) {
                        errorMessage.value = 'URL 缺少密钥参数 pawd (例如: ?pawd=密钥)';
                        throw new Error('未提供解密密钥');
                    }

                    const plainText = decryptXXTEA(encryptedBase64, pawd);
                    if (!plainText) {
                        errorMessage.value = '解密失败：请检查 URL 参数 pawd 是否正确';
                        throw new Error('解密失败');
                    }
                    parseText(plainText);
                } catch (e) {
                    console.warn("自动处理异常:", e.message);
                    needManualUpload.value = true;
                    loading.value = false;
                }
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                loading.value = true;
                const pawd = new URLSearchParams(window.location.search).get('pawd');
                const reader = new FileReader();
                reader.onload = (e) => {
                    const rawContent = e.target.result.trim();
                    let textToParse = rawContent;
                    if (pawd) {
                        const decrypted = decryptXXTEA(rawContent, pawd);
                        if (decrypted) textToParse = decrypted;
                    }
                    parseText(textToParse);
                };
                reader.readAsText(file);
            };

            // 改良后的全量朗读逻辑：合并当前块全部背诵内容进行朗读
            const speakBlock = () => {
                if (!currentBlockLines.value || currentBlockLines.value.length === 0) return;
                if (!('speechSynthesis' in window)) return;

                window.speechSynthesis.cancel();

                // 将背诵块内的所有行文本拼接（用句号/换行分隔，并清洗高亮斜杠符号）
                const rawText = currentBlockLines.value
                    .map(line => line.replace(/\//g, ''))
                    .join('。 ');
                
                activeUtterance = new SpeechSynthesisUtterance(rawText);
                activeUtterance.lang = 'ja-JP';
                activeUtterance.rate = 0.95;

                // 设置选择的发音人
                if (settings.selectedVoiceURI && availableVoices.value.length > 0) {
                    const targetVoice = availableVoices.value.find(v => v.voiceURI === settings.selectedVoiceURI);
                    if (targetVoice) activeUtterance.voice = targetVoice;
                }

                window.speechSynthesis.speak(activeUtterance);
            };

            onMounted(() => initData());

            return {
                loading, needManualUpload, errorMessage, currentBlock, currentBlockLines,
                currentScore, totalMemorized, totalItems,
                handleAnswer, handleFileUpload, speakBlock,
                showSearch, searchQuery, searchResults, searchInput,
                closeSearch, selectBlock, highlightText, formatLine,
                showSettings, settings, availableVoices,
                changeFontSize, changeLineSpacing, handleFontUpload, saveSettings
            };
        }
    }).mount('#app');
</script>
</body>
</html>
