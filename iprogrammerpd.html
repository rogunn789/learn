<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT 文法 例句カード版 N5–N1</title>
<style>
:root{--bg:#eceff1;--ink:#111111;--muted:#777777;--line:#d8cdd4;--chipbg:#ffffff;--cardbg:#ffffff;--shadow:0 2px 14px rgba(80,20,50,.10)}
body.dark{--bg:#16171b;--ink:#efe9dc;--muted:#9d968a;--line:#3b3e47;--chipbg:#2e3038;--cardbg:#22242a;--shadow:0 2px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif CJK SC",serif;
line-height:1.75;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
.jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",serif}
.hide{display:none !important}
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lockbox{background:var(--cardbg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
padding:28px 24px;max-width:360px;width:100%;text-align:center}
.locktitle{font-size:24px;font-weight:800;margin-bottom:10px}
.lockhint{font-size:16px;color:var(--muted);line-height:1.6;margin:0 0 16px}
.lockinput{width:100%;font-size:19px;padding:12px;border:1px solid var(--line);border-radius:10px;
background:var(--bg);color:var(--ink);margin-bottom:12px;font-family:inherit}
.lockbtn{width:100%;appearance:none;border:none;border-radius:10px;padding:13px;font-size:19px;font-weight:800;
background:#d6006d;color:#ffffff;cursor:pointer;font-family:inherit}
.lockmsg{color:#d92b0c;font-size:16px;min-height:22px;margin:10px 0 0}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
padding:10px 12px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:var(--chipbg);color:var(--ink);
border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{background:#d6006d;color:#ffffff;border-color:transparent}
.chip.mode.on{background:#111111}
body.dark .chip.mode.on{background:#efe9dc;color:#111111}
.count{margin-left:auto;font-size:14px;color:var(--muted);font-weight:700}
.wrap{margin:0 auto;padding:14px 18px 6px}
.card{background:transparent;padding:0}
.chead{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px 18px 2px}
.pill{background:#d6006d;color:#ffffff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:16px}
.csec{font-size:18px;font-weight:700}
.qinst{margin:12px 18px 0;font-size:16px;font-weight:700;color:#a00050;background:#fff5fa;
border:1px dashed #d6006d;border-radius:8px;padding:8px 12px;text-align:center}
body.dark .qinst{background:#33222e;color:#ff8fc0}
.sent{padding:14px 18px 0;text-align:center}
.ex-ja{font-size:21px;color:#c2185b;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",serif;line-height:2}
body.dark .ex-ja{color:#ff9ec7}
.ex-zh{color:#555555;font-size:17px;margin:2px auto 0;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif}
body.dark .ex-zh{color:#b9b2a4}
.hl{color:#d6006d;font-weight:800;background:#fff59d;border-radius:3px;padding:0 2px}
body.dark .hl{background:#5c5322;color:#ffd7ea}
ruby rt{font-size:.52em;color:#666666}
body.dark ruby rt{color:#9d968a}
.blank{color:#d6006d;font-weight:800;border-bottom:3px solid #d6006d;letter-spacing:.08em;padding:0 2px}
.pat{color:#d6006d;border:3px solid #d6006d;background:#fff5fa;text-align:center;font-size:30px;font-weight:800;
margin:14px 18px 4px;padding:10px;border-radius:10px;letter-spacing:.03em;
font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",serif}
body.dark .pat{background:#33222e;color:#ff8fc0}
.pat-sub{text-align:center;color:#a00050;font-weight:800;font-size:17px;margin:2px 0 4px;
font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif}
body.dark .pat-sub{color:#ff8fc0}
.irow{padding:8px 18px 0;text-align:center}
.tag{display:inline-block;background:#111111;color:#ffffff;font-weight:800;font-size:14px;border-radius:4px;
padding:1px 10px;margin-right:10px;vertical-align:2px}
body.dark .tag{background:#efe9dc;color:#111111}
.conn{display:inline;font-size:18.5px;font-weight:700;background:#fff3cd;padding:3px 8px;border-radius:4px;
font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP",serif}
body.dark .conn{background:#3a3320;color:#ffe9a8}
.sense{font-size:17px;margin:6px 0 2px;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif}
.psense{margin:14px 18px 4px;font-size:19px;line-height:1.7;background:var(--chipbg);
border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:center}
.opts{padding:14px 18px 0;display:flex;flex-direction:column;gap:10px}
.optwrap{display:flex;flex-direction:column}
.optwrap .opt{width:100%}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:var(--chipbg);color:var(--ink);
border-radius:10px;padding:12px 14px;font-size:17px;line-height:1.6;cursor:pointer;font-family:inherit}
.opt.jp-opt{font-size:21px;text-align:left;font-weight:700}
.ono{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#d6006d;color:#ffffff;font-weight:800;
font-size:15px;align-items:center;justify-content:center;margin-right:8px;vertical-align:2px}
.opt.right .ono{background:#1d9e4f}
.opt.wrong .ono{background:#d92b0c}
.opt.right{border-color:#1d9e4f;background:#e6f7ec;color:#0d6b32}
body.dark .opt.right{background:#17301d;color:#7fe3a0}
.opt.wrong{border-color:#d92b0c;background:#fdeeea;color:#a31d05}
body.dark .opt.wrong{background:#3a1d16;color:#ff9d8a}
.opt.dim{opacity:.55}
.verdict{margin:12px 18px 0;font-size:18px;font-weight:800;text-align:center}
.verdict.ok{color:#1d9e4f}
.verdict.ng{color:#d92b0c}
.dtoggle{display:block;align-self:flex-end;margin:6px 0 0;appearance:none;background:none;border:none;color:#d6006d;font-size:17px;
font-weight:800;cursor:pointer;font-family:inherit;padding:4px 0}
.detail{margin:6px 0 0;border-top:1px dashed var(--line);padding-top:6px}
.detail .irow{text-align:left}
.detail .sent{text-align:left}
.detail .ex-zh{margin:2px 0 0}
.detail .ex-ja{font-size:18px}
.detail .ex-zh{font-size:15.5px}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.navbtn{flex:1;appearance:none;border:1px solid var(--line);background:var(--chipbg);color:var(--ink);
border-radius:12px;padding:14px 6px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.navbtn.primary{color:#ffffff;border-color:transparent;background:#d6006d}
.navbtn:disabled{opacity:.4;cursor:default}
.navbtn:active{transform:scale(.98)}
@media (max-width:640px){.pat{font-size:25px}.ex-ja{font-size:19.5px}.navbtn{font-size:14px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="lockwrap" id="lock">
<div class="lockbox">
<div class="locktitle">JLPT 文法 例句カード版</div>
<p class="lockhint">内容已加密，请输入密码解锁。<br>也可以用带 ?pwd=密码 的链接直接打开。</p>
<input class="lockinput" id="pwdInput" type="password" placeholder="密码" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
<button class="lockbtn" id="unlockBtn">解锁</button>
<p class="lockmsg" id="lockMsg"></p>
</div>
</div>
<div id="app" class="hide">
<div class="topbar">
<button class="chip lvchip on" data-lv="N5">N5</button>
<button class="chip lvchip on" data-lv="N4">N4</button>
<button class="chip lvchip on" data-lv="N3">N3</button>
<button class="chip lvchip on" data-lv="N2">N2</button>
<button class="chip lvchip on" data-lv="N1">N1</button>
<button class="chip mode modechip on" data-mode="browse">浏览</button>
<button class="chip mode modechip" data-mode="test">测试</button>
<button class="chip" id="themeBtn">🌙 夜间</button>
<span class="count" id="count"></span>
</div>
<main class="wrap"><article class="card" id="card"></article></main>
<div class="botbar" id="browseBar">
<button class="navbtn" id="prevBtn">← 上一个</button>
<button class="navbtn" id="randBtn">🎲 随机</button>
<button class="navbtn primary" id="nextBtn">下一个 →</button>
</div>
<div class="botbar hide" id="testBar">
<button class="navbtn" id="tRand">🎲 换一题</button>
<button class="navbtn" id="tFlip">显示答案</button>
<button class="navbtn primary" id="tNext">下一题 →</button>
</div>
</div>

let DATA = null, started = false;
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
async function unlock(pwd){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.n, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.i)}, key, b64(ENC.c));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text = await new Response(stream).text();
  DATA = JSON.parse(text);
}
function showLock(msg){
  document.getElementById('lockMsg').textContent = msg || '';
  document.getElementById('lock').classList.remove('hide');
}
async function tryStart(pwd){
  pwd = (pwd || '').trim();
  if (!pwd) { showLock(''); return; }
  if (!window.crypto || !crypto.subtle) {
    showLock('当前浏览器不支持解密，请换用最新版 Chrome / Safari 打开本文件。'); return;
  }
  try { await unlock(pwd); }
  catch(e){ showLock('密码不正确，无法解密。'); return; }
  document.getElementById('lock').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  if (!started){ started = true; initApp(); }
}
document.getElementById('unlockBtn').addEventListener('click', function(){
  tryStart(document.getElementById('pwdInput').value);
});
document.getElementById('pwdInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryStart(e.target.value);
});
function initApp(){
const LEVELS = ['N5','N4','N3','N2','N1'];
let levels = {N5:true,N4:true,N3:true,N2:true,N1:true};
let mode = 'browse';
let bPool = [], bCur = 0;
let test = null, testNo = 0, statA = 0, statOK = 0;
const cardEl = document.getElementById('card');
const countEl = document.getElementById('count');
const ENT = DATA.entries, EXS = DATA.exs;
function lvOfEx(x){ return ENT[x.e].lv; }
function headHtml(ent, bare){
  return '<div class="chead">' + (bare ? '' : '<span class="pill">'+ent.lv+'</span>')
       + '<span class="csec">'+ent.sec+'</span></div>';
}
function infoHtml(ent, sIdx){
  let h = '<div class="pat">'+ent.pat+'</div>';
  if (ent.sub) h += '<div class="pat-sub">'+ent.sub+'</div>';
  if (ent.conn) h += '<div class="irow"><span class="tag">接续</span><p class="conn">'+ent.conn+'</p></div>';
  h += '<div class="irow"><span class="tag">意思</span><p class="sense">'+ent.senses[sIdx]+'</p></div>';
  return h;
}
function detailHtml(eIdx, boxId){
  const ent = ENT[eIdx];
  let h = '<div class="detail hide" id="'+boxId+'">';
  if (ent.conn) h += '<div class="irow"><span class="tag">接续</span><p class="conn">'+ent.conn+'</p></div>';
  ent.senses.forEach(function(s, i){
    h += '<div class="irow"><span class="tag">意思'+(ent.senses.length>1 ? (i+1) : '')+'</span><p class="sense">'+s+'</p></div>';
  });
  h += '<div class="irow"><span class="tag">例文</span></div>';
  EXS.forEach(function(x){
    if (x.e === eIdx)
      h += '<div class="sent"><span class="ex-ja">'+x.jp+'</span><p class="ex-zh">'+x.zh+'</p></div>';
  });
  h += '</div>';
  return h;
}
function renderBrowse(){
  const x = EXS[bPool[bCur]], ent = ENT[x.e];
  let h = headHtml(ent);
  h += '<div class="sent"><span class="ex-ja">'+x.jp+'</span><p class="ex-zh">'+x.zh+'</p></div>';
  h += infoHtml(ent, x.s);
  cardEl.innerHTML = h;
  countEl.textContent = (bCur+1) + ' / ' + bPool.length + ' 句';
  window.scrollTo(0,0);
  save();
}
function buildBrowsePool(keepIdx){
  bPool = [];
  EXS.forEach(function(x, i){ if (levels[lvOfEx(x)]) bPool.push(i); });
  if (!bPool.length) bPool = EXS.map(function(_, i){ return i; });
  let p = (keepIdx !== null && keepIdx !== undefined) ? bPool.indexOf(keepIdx) : -1;
  bCur = p >= 0 ? p : 0;
}
function bShow(n){ bCur = ((n % bPool.length) + bPool.length) % bPool.length; renderBrowse(); }
function bNext(){ bShow(bCur+1); }
function bPrev(){ bShow(bCur-1); }
function bRandom(){
  if (bPool.length < 2) return;
  let r; do { r = Math.floor(Math.random()*bPool.length); } while (r === bCur);
  bShow(r);
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pickTestEx(){
  const cand = [];
  EXS.forEach(function(x, i){ if (levels[lvOfEx(x)]) cand.push(i); });
  return cand[Math.floor(Math.random()*cand.length)];
}
function drawTest(){
  testNo++;
  if (Math.random() < 0.5){
    test = {kind:1, xi: pickTestEx(), flipped:false};
    renderTest1();
  } else {
    const pairs = [];
    ENT.forEach(function(ent, e){ if (levels[ent.lv]) ent.senses.forEach(function(_, s){ pairs.push([e, s]); }); });
    const pr = pairs[Math.floor(Math.random()*pairs.length)];
    test = {kind:2, e: pr[0], s: pr[1], dir: Math.random() < 0.5 ? 0 : 1, answered:false};
    buildOptions();
    renderTest2();
  }
  updateTestBar();
  window.scrollTo(0,0);
  save();
}
function renderTest1(){
  const x = EXS[test.xi], ent = ENT[x.e];
  let h = headHtml(ent, true);
  if (!test.flipped){
    h += '<div class="sent"><span class="ex-ja">'+x.bk+'</span><p class="ex-zh">'+x.zh+'</p></div>';
  } else {
    h += '<div class="sent"><span class="ex-ja">'+x.jp+'</span><p class="ex-zh">'+x.zh+'</p></div>';
    h += infoHtml(ent, x.s);
  }
  cardEl.innerHTML = h;
  countEl.textContent = ent.lv + ' · 第 ' + testNo + ' 题 · 正确 ' + statOK + '/' + statA;
  updateTestBar();
}
function buildOptions(){
  const ent = ENT[test.e];
  let correct, cands = [];
  if (test.dir === 0){
    correct = {t: ent.senses[test.s], e: test.e, s: test.s};
    ENT.forEach(function(o, e){
      if (e === test.e) return;
      o.senses.forEach(function(t, s){ cands.push({t:t, e:e, s:s, same: o.lv === ent.lv}); });
    });
  } else {
    correct = {t: ent.pat, e: test.e, s: test.s};
    ENT.forEach(function(o, e){
      if (e === test.e || o.pat === ent.pat) return;
      cands.push({t:o.pat, e:e, s:0, same: o.lv === ent.lv});
    });
  }
  const seen = {}, opts = [correct];
  shuffle(cands.filter(function(c){ return c.same; })).concat(shuffle(cands.filter(function(c){ return !c.same; })))
    .forEach(function(c){
      if (opts.length >= 4) return;
      if (c.t === correct.t || seen[c.t]) return;
      seen[c.t] = 1; opts.push(c);
    });
  test.opts = shuffle(opts);
  test.ci = test.opts.indexOf(correct);
}
function renderTest2(){
  const ent = ENT[test.e];
  let h = headHtml(ent, true);
  if (test.dir === 0){
    h += '<div class="pat">'+ent.pat+'</div>';
    if (ent.sub) h += '<div class="pat-sub">'+ent.sub+'</div>';
  } else {
    h += '<div class="psense">'+ent.senses[test.s]+'</div>';
  }
  h += '<div class="opts">';
  test.opts.forEach(function(o, i){
    let cls = 'opt' + (test.dir === 1 ? ' jp-opt' : '');
    if (test.answered){
      if (i === test.ci) cls += ' right';
      else if (i === test.picked) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<div class="optwrap"><button class="'+cls+'" data-i="'+i+'"><span class="ono">'+(i+1)+'</span>'+o.t+'</button>'
       + '<button class="dtoggle" data-d="'+i+'">文法详细 ▸</button>'
       + detailHtml(o.e, 'dbox'+i)
       + '</div>';
  });
  h += '</div>';
  if (test.answered)
    h += '<div class="verdict '+(test.picked === test.ci ? 'ok' : 'ng')+'">'
       + (test.picked === test.ci ? '✓ 正确' : '✗ 错了，正确答案已标绿') + '</div>';
  cardEl.innerHTML = h;
  countEl.textContent = ent.lv + ' · 第 ' + testNo + ' 题 · 正确 ' + statOK + '/' + statA;
  cardEl.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      if (test.answered) return;
      test.answered = true;
      test.picked = parseInt(btn.dataset.i, 10);
      statA++;
      if (test.picked === test.ci) statOK++;
      renderTest2();
    });
  });
  cardEl.querySelectorAll('.dtoggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      const box = document.getElementById('dbox' + btn.dataset.d);
      const open = box.classList.toggle('hide') === false;
      btn.textContent = open ? '文法详细 ▾' : '文法详细 ▸';
    });
  });
}
function updateTestBar(){
  const flip = document.getElementById('tFlip');
  if (!test) return;
  flip.disabled = !(test.kind === 1 && !test.flipped);
}
function save(){
  try { localStorage.setItem('bgc2_state_v1', JSON.stringify({levels:levels, mode:mode,
    bkey: bPool.length ? bPool[bCur] : null})); } catch(e){}
}
function load(){
  try {
    const st = JSON.parse(localStorage.getItem('bgc2_state_v1') || 'null');
    if (st){
      if (st.levels) LEVELS.forEach(function(l){ if (typeof st.levels[l] === 'boolean') levels[l] = st.levels[l]; });
      if (!LEVELS.some(function(l){return levels[l];})) levels = {N5:true,N4:true,N3:true,N2:true,N1:true};
      if (st.mode === 'test' || st.mode === 'browse') mode = st.mode;
      return (typeof st.bkey === 'number') ? st.bkey : null;
    }
  } catch(e){}
  return null;
}
function syncChips(){
  document.querySelectorAll('.lvchip').forEach(function(ch){
    ch.classList.toggle('on', !!levels[ch.dataset.lv]);
  });
  document.querySelectorAll('.modechip').forEach(function(ch){
    ch.classList.toggle('on', ch.dataset.mode === mode);
  });
  document.getElementById('browseBar').classList.toggle('hide', mode !== 'browse');
  document.getElementById('testBar').classList.toggle('hide', mode !== 'test');
}
document.querySelectorAll('.lvchip').forEach(function(ch){
  ch.addEventListener('click', function(){
    const lv = ch.dataset.lv, keep = bPool.length ? bPool[bCur] : null;
    levels[lv] = !levels[lv];
    if (!LEVELS.some(function(l){return levels[l];})) levels[lv] = true;
    buildBrowsePool(keep);
    syncChips();
    save();
    if (mode === 'browse') renderBrowse(); else drawTest();
  });
});
document.querySelectorAll('.modechip').forEach(function(ch){
  ch.addEventListener('click', function(){
    if (mode === ch.dataset.mode) return;
    mode = ch.dataset.mode;
    syncChips();
    if (mode === 'browse') renderBrowse(); else drawTest();
    save();
  });
});
document.getElementById('themeBtn').addEventListener('click', function(){
  document.body.classList.toggle('dark');
  try { localStorage.setItem('bgc2_theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch(e){}
});
document.getElementById('nextBtn').addEventListener('click', bNext);
document.getElementById('prevBtn').addEventListener('click', bPrev);
document.getElementById('randBtn').addEventListener('click', bRandom);
document.getElementById('tFlip').addEventListener('click', function(){
  if (test && test.kind === 1 && !test.flipped){ test.flipped = true; renderTest1(); }
});
document.getElementById('tRand').addEventListener('click', function(){ drawTest(); });
document.getElementById('tNext').addEventListener('click', function(){ drawTest(); });
const startKey = load();
buildBrowsePool(startKey);
syncChips();
if (mode === 'test') drawTest(); else renderBrowse();
}
try { if (localStorage.getItem('bgc2_theme') === 'dark') document.body.classList.add('dark'); } catch(e){}
(function(){
  let pwd = null;
  try {
    pwd = new URLSearchParams(location.search).get('pwd');
    if (!pwd && location.hash && location.hash.indexOf('#pwd=') === 0)
      pwd = decodeURIComponent(location.hash.slice(5));
  } catch(e){}
  if (pwd) tryStart(pwd); else showLock('');
})();
</script>
