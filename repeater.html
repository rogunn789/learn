    <script>
        // IndexedDB Helper Module for Audio & LRC Cache
        const DB_NAME = 'EchoMasterDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'audio_history';

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveToCache(item) {
            try {
                const db = await openIndexedDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                item.updatedAt = Date.now();
                store.put(item);
                updateHistoryCount();
            } catch (err) {
                console.warn("IndexedDB Cache Save Failed:", err);
            }
        }

        async function getAllHistoryFromCache() {
            try {
                const db = await openIndexedDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch (err) {
                return [];
            }
        }

        async function deleteHistoryItem(id) {
            try {
                const db = await openIndexedDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(id);
                updateHistoryCount();
            } catch (err) {
                console.warn("Delete history item failed:", err);
            }
        }

        async function clearAllHistoryItems() {
            try {
                const db = await openIndexedDB();

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === null) return '00:00.0';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 10);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
        }

        function formatLrcTimestamp(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 100);
            return `[${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}]`;
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2})(?:\.\vert{}\:)(\d{2,3})\]/g;
            const parsed = [];

            lines.forEach((line) => {
                line = line.trim();
                if (!line) return;

                let match;
                const timestamps = [];
                let cleanText = line;

                while ((match = timeRegex.exec(line)) !== null) {
                    const min = parseInt(match[1], 10);
                    const sec = parseInt(match[2], 10);
                    let msStr = match[3];
                    if (msStr.length === 2) msStr += '0';
                    const ms = parseInt(msStr, 10);
                    timestamps.push(min * 60 + sec + ms / 1000);
                    cleanText = cleanText.replace(match[0], '');
                }

                cleanText = cleanText.trim();
                if (cleanText && timestamps.length > 0) {
                    timestamps.forEach(time => {
                        parsed.push({ start: time, text: cleanText });
                    });
                }
            });

            parsed.sort((a, b) => a.start - b.start);

            const duration = state.wavesurfer ? state.wavesurfer.getDuration() : 300;
            return parsed.map((item, index) => {
                const nextStart = parsed[index + 1] ? parsed[index + 1].start : duration;
                return {
                    id: index,
                    start: item.start,
                    end: Math.max(item.start + 0.5, nextStart),
                    text: item.text
                };
            });
        }

        function analyzeSilenceSegmentation() {
            if (!state.audioBuffer && state.wavesurfer) {
                state.audioBuffer = state.wavesurfer.getDecodedData();
            }

            if (!state.audioBuffer) {
                alert("请先加载有效的音频文件！");
                return;
            }

            const channelData = state.audioBuffer.getChannelData(0);
            const sampleRate = state.audioBuffer.sampleRate;
            const duration = state.audioBuffer.duration;
            
            const chunkSize = Math.floor(sampleRate * 0.02);
            const totalChunks = Math.floor(channelData.length / chunkSize);
            const minSilenceChunks = Math.floor(state.silenceMinSec / 0.02);
            const threshold = state.silenceThreshold;

            let inSpeech = false;
            let speechStart = 0;
            let silenceChunkCount = 0;
            const rawSpeechBlocks = [];

            for (let i = 0; i < totalChunks; i++) {
                const startIdx = i * chunkSize;
                let sumSquare = 0;
                for (let j = 0; j < chunkSize; j++) {
                    const sample = channelData[startIdx + j];
                    sumSquare += sample * sample;
                }
                const rms = Math.sqrt(sumSquare / chunkSize);
                const currentTime = (i * chunkSize) / sampleRate;

                if (rms >= threshold) {
                    silenceChunkCount = 0;
                    if (!inSpeech) {
                        inSpeech = true;
                        speechStart = currentTime;
                    }
                } else {
                    if (inSpeech) {
                        silenceChunkCount++;
                        if (silenceChunkCount >= minSilenceChunks) {
                            inSpeech = false;
                            const speechEnd = currentTime - (silenceChunkCount * 0.02);
                            if (speechEnd - speechStart >= 0.2) {
                                rawSpeechBlocks.push({ speechStart, speechEnd });
                            }
                        }
                    }
                }
            }

            if (inSpeech) {
                rawSpeechBlocks.push({ speechStart, speechEnd: duration });
            }

            if (rawSpeechBlocks.length === 0) {
                alert("未检测到有效语音段！请降低静音判定灵敏度或缩短断句阈值。");
                return;
            }

            const sentences = [];
            for (let k = 0; k < rawSpeechBlocks.length; k++) {
                const currentBlock = rawSpeechBlocks[k];
                let start = (k === 0) ? Math.max(0, currentBlock.speechStart - 0.1) : (rawSpeechBlocks[k - 1].speechEnd + currentBlock.speechStart) / 2;
                let end = (k === rawSpeechBlocks.length - 1) ? Math.min(duration, currentBlock.speechEnd + 0.1) : (currentBlock.speechEnd + rawSpeechBlocks[k + 1].speechStart) / 2;

                sentences.push({
                    id: k,
                    start: Number(start.toFixed(3)),
                    end: Number(end.toFixed(3)),
                    text: `片段 #${k + 1}`
                });
            }

            state.sentences = sentences;
            DOM.modeBadge.textContent = "自动中点断句";
            DOM.modeBadge.className = "text-[9px] px-1.5 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-800 font-medium";

            renderSentenceList();
            if (state.sentences.length > 0) {
                setActiveSentence(0, false);
            }
            triggerCurrentCacheSave();
        }

        function handleTimeSync(currentTime) {
            if (state.sentences.length === 0) return;

            const currentSentence = state.sentences[state.currentIndex];

            if (state.isLoopSentence && currentSentence) {
                if (currentTime >= currentSentence.end - 0.08 || currentTime < currentSentence.start) {
                    state.wavesurfer.setTime(currentSentence.start);
                    return;
                }
            }

            const foundIndex = state.sentences.findIndex(s => currentTime >= s.start && currentTime < s.end);
            if (foundIndex !== -1 && foundIndex !== state.currentIndex) {
                setActiveSentence(foundIndex, false);
            }
        }

        function setActiveSentence(index, shouldSeek = true) {
            if (index < 0 || index >= state.sentences.length) return;
            state.currentIndex = index;

            const sentence = state.sentences[index];

            if (shouldSeek && state.wavesurfer) {
                state.wavesurfer.setTime(sentence.start);
            }

            if (DOM.chkShowRegion.checked && state.wsRegions) {
                state.wsRegions.clearRegions();
                state.wsRegions.addRegion({
                    start: sentence.start,
                    end: sentence.end,
                    color: 'rgba(99, 102, 241, 0.25)',
                    drag: false,
                    resize: false
                });
            }

            renderSentenceList();

            const activeElem = document.getElementById(`sentence-item-${index}`);
            if (activeElem) {
                activeElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function getRandomSentenceIndex() {

            let nextIdx;
            do {
                nextIdx = Math.floor(Math.random() * state.sentences.length);
            } while (nextIdx === state.currentIndex);
            return nextIdx;
        }

        function bindEvents() {
            // Drag and Drop
            DOM.dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                DOM.dropZone.classList.add('border-brand-500', 'bg-brand-950/20');
            });

            DOM.dropZone.addEventListener('dragleave', () => {
                DOM.dropZone.classList.remove('border-brand-500', 'bg-brand-950/20');
            });

            DOM.dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                DOM.dropZone.classList.remove('border-brand-500', 'bg-brand-950/20');
                const files = Array.from(e.dataTransfer.files);
                files.forEach(file => {
                    if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|m4a|ogg)$/i)) {
                        loadAudioFile(file);
                    } else if (file.name.endsWith('.lrc') || file.name.endsWith('.txt')) {
                        loadLrcFile(file);
                    }
                });
            });

            DOM.inputAudio.addEventListener('change', (e) => {
                if (e.target.files[0]) loadAudioFile(e.target.files[0]);
            });

            DOM.inputLrc.addEventListener('change', (e) => {
                if (e.target.files[0]) loadLrcFile(e.target.files[0]);
            });

            DOM.btnLoadDemo.addEventListener('click', loadDemoLesson);

            // Playback controls
            DOM.btnPlayPause.addEventListener('click', () => {
                if (state.wavesurfer) state.wavesurfer.playPause();
            });

            // Requirement 1: Prev / Next Button with Random Jump Support
            DOM.btnPrev.addEventListener('click', () => {
                if (state.sentences.length === 0) return;
                if (state.isRandomMode) {
                    jumpToSentence(getRandomSentenceIndex(), true);
                } else if (state.currentIndex > 0) {
                    jumpToSentence(state.currentIndex - 1, true);
                }
            });

            DOM.btnNext.addEventListener('click', () => {
                if (state.sentences.length === 0) return;
                if (state.isRandomMode) {
                    jumpToSentence(getRandomSentenceIndex(), true);
                } else if (state.currentIndex < state.sentences.length - 1) {
                    jumpToSentence(state.currentIndex + 1, true);
                }
            });

            DOM.btnReplay.addEventListener('click', () => {
                if (state.currentIndex >= 0) {
                    jumpToSentence(state.currentIndex, true);
                }
            });

            // Single Loop Toggle
            DOM.btnToggleLoop.addEventListener('click', () => {
                state.isLoopSentence = !state.isLoopSentence;
                if (state.isLoopSentence) {
                    DOM.btnToggleLoop.classList.add('bg-brand-600', 'text-white', 'border-brand-500');

                    DOM.loopBadge.className = "absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-slate-600 border-2 border-slate-900";

            // Requirement 1: Toggle Random Playback Mode
            DOM.btnToggleRandom.addEventListener('click', () => {

                    DOM.randomBadge.className = "absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-amber-300 border-2 border-slate-900 animate-pulse";
                } else {
                    DOM.btnToggleRandom.classList.remove('bg-amber-600', 'text-white', 'border-amber-500');
                    DOM.randomBadge.className = "absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-slate-600 border-2 border-slate-900";
                }
            });

            // Speed Selector
            document.querySelectorAll('.btn-speed').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const speed = parseFloat(e.target.dataset.speed);
                    state.playbackRate = speed;
                    if (state.wavesurfer) state.wavesurfer.setPlaybackRate(speed);
                    document.querySelectorAll('.btn-speed').forEach(b => {
                        b.className = "btn-speed px-1.5 py-0.5 rounded text-slate-400 hover:text-white";
                    });
                    e.target.className = "btn-speed px-1.5 py-0.5 rounded bg-brand-600 text-white font-semibold";
                });
            });

            DOM.sliderZoom.addEventListener('input', (e) => {
                if (state.wavesurfer) state.wavesurfer.zoom(Number(e.target.value));
            });

            DOM.sliderVolume.addEventListener('input', (e) => {
                if (state.wavesurfer) state.wavesurfer.setVolume(Number(e.target.value));
            });

            DOM.chkShowRegion.addEventListener('change', (e) => {
                if (!e.target.checked && state.wsRegions) {
                    state.wsRegions.clearRegions();
                } else if (state.currentIndex >= 0) {
                    setActiveSentence(state.currentIndex, false);
                }
            });

            DOM.sliderSilenceTime.addEventListener('input', (e) => {
                state.silenceMinSec = parseFloat(e.target.value);
                DOM.valSilenceTime.textContent = `${state.silenceMinSec.toFixed(1)}s`;
            });

            DOM.sliderSilenceVol.addEventListener('input', (e) => {
                state.silenceThreshold = parseFloat(e.target.value);
                let label = "中等";
                if (state.silenceThreshold < 0.008) label = "极高灵敏";
                else if (state.silenceThreshold > 0.03) label = "低灵敏";
                DOM.valSilenceVol.textContent = `${label} (${state.silenceThreshold})`;
            });

            DOM.btnAutoSegment.addEventListener('click', analyzeSilenceSegmentation);
            DOM.btnExportLrc.addEventListener('click', exportLRC);
            DOM.inputSearch.addEventListener('input', renderSentenceList);

            DOM.btnClearList.addEventListener('click', () => {
                state.sentences = [];
                state.currentIndex = -1;
                if (state.wsRegions) state.wsRegions.clearRegions();
                renderSentenceList();
            });

            // History Modal
            DOM.btnHistory.addEventListener('click', () => {
                renderHistoryModal();
                DOM.modalHistory.classList.remove('hidden');
            });
            DOM.btnCloseHistory.addEventListener('click', () => DOM.modalHistory.classList.add('hidden'));
            DOM.btnHistoryOk.addEventListener('click', () => DOM.modalHistory.classList.add('hidden'));

            DOM.btnClearAllHistory.addEventListener('click', async () => {
                if (confirm("确定要清空本地所有缓存的历史课程和音频吗？")) {
                    await clearAllHistoryItems();
                    renderHistoryModal();
                }
            });

            // Keyboard Shortcuts Modal
            DOM.btnShortcuts.addEventListener('click', () => DOM.modalShortcuts.classList.remove('hidden'));
            DOM.btnCloseModal.addEventListener('click', () => DOM.modalShortcuts.classList.add('hidden'));
            DOM.btnModalOk.addEventListener('click', () => DOM.modalShortcuts.classList.add('hidden'));

            // Global Keybindings
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    if (state.wavesurfer) state.wavesurfer.playPause();
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    DOM.btnPrev.click();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    DOM.btnNext.click();
                } else if (e.code === 'KeyR') {
                    e.preventDefault();
                    DOM.btnReplay.click();
                } else if (e.code === 'KeyL') {
                    e.preventDefault();
                    DOM.btnToggleLoop.click();
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initWaveSurfer();
            bindEvents();
            loadDemoLesson();
            updateHistoryCount();
        });
    </script>
</body>
</html>
