<!DOCTYPE html>
<html lang="zh-CN" class="dark h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EchoMaster - 智能网络复读机</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eep2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Wavesurfer.js v7 and Regions Plugin CDN -->
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input[type=range] {
            accent-color: #6366f1;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
        /* 强化拖拽调整线的视觉效果 */
        ::part(region) {
            border-left: 2px solid rgba(255,255,255,0.4);
            border-right: 2px solid rgba(255,255,255,0.4);
        }
        ::part(region):hover {
            border-left: 2px solid #6366f1;
            border-right: 2px solid #6366f1;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 select-none overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="h-12 sm:h-14 border-b border-slate-800 bg-slate-900/90 px-3 sm:px-4 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-2 sm:space-x-3">
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 shrink-0">
                <i class="fa-solid font-bold fa-repeat text-white text-sm sm:text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm sm:text-base tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">EchoMaster</h1>
                <p class="text-[9px] sm:text-[10px] text-slate-400 -mt-0.5 hidden sm:block">智能语言学习复读机</p>
            </div>
        </div>

        <div class="flex items-center space-x-1.5 sm:space-x-3 text-xs">
            <button id="btn-history" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 hover:text-amber-300 border border-amber-500/30 transition flex items-center space-x-1 shadow-sm relative">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span class="hidden sm:inline">历史缓存</span>
                <span id="badge-history-count" class="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 font-mono">0</span>
            </button>
            <button id="btn-load-demo" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-indigo-300 hover:text-indigo-200 border border-indigo-500/30 transition flex items-center space-x-1 shadow-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="hidden sm:inline">加载示例</span>
            </button>
            <button id="btn-shortcuts" class="p-1.5 sm:p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white transition" title="快捷键说明">
                <i class="fa-solid fa-keyboard text-xs sm:text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col lg:grid lg:grid-cols-12 gap-2 sm:gap-4 p-2 sm:p-4 overflow-hidden min-h-0">
        
        <!-- TOP SECTION (Left Panel on PC) -->
        <div id="left-panel" class="lg:col-span-7 xl:col-span-8 flex flex-col space-y-2 sm:space-y-3 shrink-0 lg:shrink lg:overflow-y-auto transition-all duration-300">

            <!-- File Upload Bar -->
            <div id="drop-zone" class="glass-panel rounded-xl p-2 sm:p-3 border-2 border-dashed border-slate-700 hover:border-brand-500/50 transition duration-200 group relative shrink-0">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center space-x-2 min-w-0">
                        <div class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center text-indigo-400 shrink-0">
                            <i class="fa-solid fa-photo-film text-sm"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="text-xs font-semibold text-slate-200 truncate" id="file-status-text">可拖入 MP3/MP4/LRC/SRT 文件</div>
                            <div class="text-[10px] text-slate-400 truncate hidden sm:block" id="file-sub-status">支持提取 MP3 内嵌 USLT 歌词与导出嵌入音视频</div>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-1.5 shrink-0">
                        <label class="px-2.5 py-1 text-xs font-medium rounded-lg bg-brand-600 hover:bg-brand-500 text-white cursor-pointer transition shadow-md">
                            <i class="fa-solid fa-file-audio mr-1"></i> 音/视频
                            <input type="file" id="input-audio" accept="audio/*,video/mp4,video/*,.mp3,.wav,.m4a,.mp4,.mkv,.webm" class="hidden">
                        </label>
                        <label class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer border border-slate-700 transition">
                            <i class="fa-solid fa-closed-captioning mr-1"></i> 字幕
                            <input type="file" id="input-lrc" accept=".lrc,.srt,.txt" class="hidden">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Video Display Container -->
            <div id="video-container" class="glass-panel rounded-xl p-2 border border-slate-800 hidden shrink-0 flex flex-col items-center justify-center bg-slate-950/90 relative group" style="resize: vertical; overflow: hidden; min-height: 200px; max-height: calc(100dvh - 430px);">
                <button id="btn-toggle-layout" class="absolute top-3 right-3 z-10 w-8 h-8 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-600 shadow-lg transition opacity-0 group-hover:opacity-100" title="显示/隐藏侧边字幕列表">
                    <i class="fa-solid fa-table-columns"></i>
                </button>
                <video id="video-player" class="w-full h-full rounded-lg object-contain bg-black cursor-pointer" playsinline></video>
            </div>

            <!-- Waveform Panel -->
            <div class="glass-panel rounded-xl p-2.5 sm:p-3 flex flex-col space-y-2 relative shrink-0">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <div class="flex items-center space-x-2 min-w-0">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                        <span id="current-filename" class="font-medium text-slate-300 truncate max-w-[160px] sm:max-w-[300px]">未加载文件</span>
                    </div>
                    <div class="font-mono text-[11px] bg-slate-900/80 px-2 py-0.5 rounded border border-slate-800 shrink-0">
                        <span id="time-current" class="text-indigo-400 font-bold">00:00.0</span> / <span id="time-total" class="text-slate-400">00:00.0</span>
                    </div>
                </div>

                <!-- Waveform Canvas -->
                <div id="waveform-container" class="w-full bg-slate-950/60 rounded-lg border border-slate-800/80 p-1 relative h-16 sm:h-20 flex items-center justify-center overflow-hidden">
                    <div id="waveform-loader" class="text-xs text-slate-500 flex items-center space-x-2">
                        <i class="fa-solid fa-waveform-lines text-base animate-bounce"></i>
                        <span>等待音视频载入...</span>
                    </div>
                    <div id="waveform" class="w-full"></div>
                </div>

                <!-- Waveform Zoom Bar -->
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-magnifying-glass-minus text-slate-500 text-[10px]"></i>
                        <input id="slider-zoom" type="range" min="10" max="200" value="50" class="w-20 sm:w-32 h-1 bg-slate-800 rounded-lg cursor-pointer">
                        <i class="fa-solid fa-magnifying-glass-plus text-slate-500 text-[10px]"></i>
                    </div>
                    
                    <label class="flex items-center space-x-1 cursor-pointer text-[11px] hover:text-slate-200" title="显示或隐藏波形上的高亮拖拽分区">
                        <input type="checkbox" id="chk-show-region" checked class="rounded border-slate-700 text-brand-600 focus:ring-brand-500 bg-slate-900">
                        <span>高亮句区间</span>
                    </label>
                </div>
            </div>

            <!-- Primary Action Controls -->
            <div class="glass-panel rounded-xl p-2.5 sm:p-3 flex flex-col space-y-2 shrink-0">
                <div class="flex items-center justify-center space-x-2 sm:space-x-4">
                    <!-- Insert Breakpoint at Current Time -->
                    <button id="btn-insert-breakpoint" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 transition flex items-center justify-center border border-slate-700/60 shadow active:scale-95" title="✂️ 在当前播放位置剪开断句">
                        <i class="fa-solid fa-scissors text-sm"></i>
                    </button>

                    <!-- Prev Sentence -->
                    <button id="btn-prev" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center justify-center border border-slate-700/60 shadow active:scale-95" title="上一句">
                        <i class="fa-solid fa-backward-step text-sm"></i>
                    </button>

                    <!-- Replay Sentence -->
                    <button id="btn-replay" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-indigo-400 transition flex items-center justify-center border border-slate-700/60 shadow active:scale-95" title="重播当前句">
                        <i class="fa-solid fa-rotate-left text-sm"></i>
                    </button>

                    <!-- Play / Pause -->
                    <button id="btn-play-pause" class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 hover:from-brand-500 text-white transition flex items-center justify-center shadow-lg shadow-brand-600/30 active:scale-95" title="播放 / 暂停">
                        <i class="fa-solid fa-play text-lg ml-0.5" id="icon-play"></i>
                    </button>

                    <!-- Loop Toggle -->
                    <button id="btn-toggle-loop" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700/60 transition flex items-center justify-center relative shadow active:scale-95" title="循环模式: 不循环 (L)">
                        <i class="fa-solid fa-repeat text-sm"></i>
                        <span id="loop-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-slate-600 border-2 border-slate-900"></span>
                    </button>

                    <!-- Random Toggle -->
                    <button id="btn-toggle-random" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700/60 transition flex items-center justify-center relative shadow active:scale-95" title="随机片段播放">
                        <i class="fa-solid fa-shuffle text-sm"></i>
                        <span id="random-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-slate-600 border-2 border-slate-900"></span>
                    </button>

                    <!-- Next Sentence -->
                    <button id="btn-next" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center justify-center border border-slate-700/60 shadow active:scale-95" title="下一句">
                        <i class="fa-solid fa-forward-step text-sm"></i>
                    </button>
                </div>

                <!-- Secondary Controls Row -->
                <div class="flex items-center justify-between gap-2 pt-1 border-t border-slate-800/80">
                    <div class="flex items-center space-x-1 bg-slate-950/60 p-0.5 rounded-lg border border-slate-800 text-[11px]">
                        <button data-speed="0.75" class="btn-speed px-1.5 py-0.5 rounded text-slate-400 hover:text-white">0.75x</button>
                        <button data-speed="1.0" class="btn-speed px-1.5 py-0.5 rounded bg-brand-600 text-white font-semibold">1.0x</button>
                        <button data-speed="1.25" class="btn-speed px-1.5 py-0.5 rounded text-slate-400 hover:text-white">1.25x</button>
                        <button data-speed="1.5" class="btn-speed px-1.5 py-0.5 rounded text-slate-400 hover:text-white">1.5x</button>
                    </div>

                    <div class="flex items-center space-x-1 bg-slate-950/60 px-2 py-0.5 rounded-lg border border-slate-800">
                        <i class="fa-solid fa-volume-high text-[10px] text-slate-400"></i>
                        <input id="slider-volume" type="range" min="0" max="1" step="0.05" value="0.9" class="w-14 sm:w-20 h-1 bg-slate-800 rounded-lg cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Auto Silence Collapsible Accordion -->
            <details class="glass-panel rounded-xl p-2.5 sm:p-3 shrink-0 group">
                <summary class="flex items-center justify-between cursor-pointer select-none text-xs font-bold text-slate-200">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-scissors text-indigo-400"></i>
                        <span>智能静音断句设置</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-slate-500 text-xs transition-transform group-open:rotate-180"></i>
                </summary>

                <div class="mt-3 space-y-3 pt-2 border-t border-slate-800/80">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/60">
                        <div class="flex flex-col space-y-1">
                            <div class="flex justify-between text-xs">
                                <span class="text-slate-400">静音阈值</span>
                                <span id="val-silence-time" class="text-indigo-400 font-mono font-bold">0.5s</span>
                            </div>
                            <input id="slider-silence-time" type="range" min="0.1" max="2.0" step="0.1" value="0.5" class="h-1 bg-slate-800 rounded-lg cursor-pointer">
                        </div>

                        <div class="flex flex-col space-y-1">
                            <div class="flex justify-between text-xs">
                                <span class="text-slate-400">灵敏度</span>
                                <span id="val-silence-vol" class="text-indigo-400 font-mono font-bold">中等 (0.015)</span>
                            </div>
                            <input id="slider-silence-vol" type="range" min="0.003" max="0.05" step="0.002" value="0.015" class="h-1 bg-slate-800 rounded-lg cursor-pointer">
                        </div>
                    </div>

                    <button id="btn-auto-segment" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1.5 shadow-md">
                        <i class="fa-solid fa-bolt text-amber-300"></i>
                        <span>执行静音自动断句</span>
                    </button>
                </div>
            </details>

        </div>

        <!-- BOTTOM SECTION (Right Panel on PC) -->
        <div id="right-panel" class="lg:col-span-5 xl:col-span-4 flex-1 flex flex-col glass-panel rounded-xl sm:rounded-2xl overflow-hidden min-h-0 border border-slate-800 transition-all duration-300">
            
            <!-- Subtitle Header Bar -->
            <div class="p-2.5 border-b border-slate-800 bg-slate-900/90 flex flex-wrap items-center justify-between gap-2 shrink-0">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-list-ol text-brand-500 text-xs"></i>
                    <span class="text-xs font-bold text-slate-200">字幕列表</span>
                    <span id="badge-sentence-count" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-800 text-slate-400 border border-slate-700">0 句</span>
                    <span id="mode-badge" class="ml-1 text-[9px] px-1.5 py-0.5 rounded bg-brand-950 text-brand-300 border border-brand-800 font-medium hidden sm:inline-block">LRC 模式</span>
                </div>

                <div class="flex items-center space-x-1.5">
                    <input id="input-cover-text" type="text" placeholder="输入生成MP3封面文字" class="w-32 bg-slate-950 text-[10px] text-slate-200 px-2 py-0.5 rounded border border-slate-700 focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-600" title="若有文字则生成黑底白字封面写入MP3">
                    
                    <button id="btn-export-lrc" class="px-2 py-0.5 text-xs rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center space-x-1 shadow-sm font-medium" title="导出单独 LRC 文件">
                        <i class="fa-solid fa-file-export text-[10px]"></i>
                    </button>

                    <button id="btn-export-audio" class="px-2 py-0.5 text-xs rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center space-x-1 shadow-sm font-medium" title="导出内嵌最新字幕与封面的 MP3 音频">
                        <i class="fa-solid fa-file-audio text-[10px]"></i>
                        <span>导出 MP3</span>
                    </button>
                </div>
            </div>

            <!-- Search Field -->
            <div class="px-2 py-1.5 bg-slate-950/40 border-b border-slate-800/80 shrink-0">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-[10px] text-slate-500"></i>
                    <input id="input-search" type="text" placeholder="搜索/过滤字幕..." class="w-full bg-slate-900/90 text-xs text-slate-200 pl-7 pr-2 py-1 rounded-lg border border-slate-800 focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-600">
                </div>
            </div>

            <!-- Scrollable Subtitle Container -->
            <div id="sentence-list" class="flex-1 overflow-y-auto p-2 space-y-1.5 relative">
                <div id="empty-list-placeholder" class="h-full flex flex-col items-center justify-center text-center p-4 text-slate-500 space-y-2">
                    <div class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600">
                        <i class="fa-solid fa-closed-captioning text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-slate-400">暂无句子数据</p>
                        <p class="text-[10px] text-slate-600 mt-0.5">导入 MP3/MP4 及 LRC/SRT 字幕</p>
                    </div>
                </div>
            </div>

            <!-- List Footer Bar -->
            <div class="p-2 bg-slate-900/90 border-t border-slate-800 text-[10px] text-slate-400 flex items-center justify-between shrink-0">
                <span class="text-slate-500">可在波形图边缘左右拖拽时间线</span>
                <button id="btn-clear-list" class="hover:text-rose-400 transition">
                    <i class="fa-solid fa-trash-can mr-1"></i>清空
                </button>
            </div>
        </div>

    </main>

    <!-- Modal: History Cache Manager Dialog -->
    <div id="modal-history" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <!-- 省略部分弹窗内容，保持原样 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-4 sm:p-5 shadow-2xl space-y-3 flex flex-col max-h-[80vh]">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 shrink-0">
                <div class="flex items-center space-x-2 text-amber-400 font-bold text-sm">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>浏览器离线历史缓存</span>
                </div>
                <button id="btn-close-history" class="text-slate-400 hover:text-white text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="history-items-container" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[150px]"></div>
            <div class="pt-2 border-t border-slate-800 flex justify-between items-center shrink-0">
                <button id="btn-clear-all-history" class="text-xs text-rose-400 hover:text-rose-300">
                    <i class="fa-solid fa-trash mr-1"></i>清空全部缓存
                </button>
                <button id="btn-history-ok" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">关闭</button>
            </div>
        </div>
    </div>

    <!-- Modal: Keyboard Shortcuts Dialog -->
    <div id="modal-shortcuts" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2 text-indigo-400 font-bold text-sm">
                    <i class="fa-solid fa-keyboard"></i>
                    <span>快捷键指南</span>
                </div>
                <button id="btn-close-modal" class="text-slate-400 hover:text-white text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-2 text-xs text-slate-300">
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950/60 border border-slate-800">
                    <span>播放 / 暂停</span>
                    <kbd class="px-2 py-0.5 rounded bg-slate-800 text-indigo-300 font-mono border border-slate-700">Space</kbd>
                </div>
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950/60 border border-slate-800">
                    <span>上一句 / 下一句 (支持随机跳转)</span>
                    <kbd class="px-2 py-0.5 rounded bg-slate-800 text-indigo-300 font-mono border border-slate-700">← / →</kbd>
                </div>
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950/60 border border-slate-800">

        const DB_NAME = 'EchoMasterDB';

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveToCache(item) {
            try {
                const db = await openIndexedDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                item.updatedAt = Date.now();
                store.put(item);
                updateHistoryCount();
            } catch (err) {}
        }

        async function getAllHistoryFromCache() {
            try {
                const db = await openIndexedDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch (err) { return []; }
        }

        async function deleteHistoryItem(id) {
            try {
                const db = await openIndexedDB();
                db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(id);
                updateHistoryCount();
            } catch (err) {}
        }

        async function clearAllHistoryItems() {
            try {
                const db = await openIndexedDB();
                db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).clear();
                updateHistoryCount();
            } catch (err) {}
        }

        // --- ID3 MP3 Cover Generation & Tag Embed --- 
        async function getCoverImageBytes(text) {
            if (!text) return null;
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 640, 640);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let fontSize = 80;
            ctx.font = `bold ${fontSize}px sans-serif`;
            while (ctx.measureText(text).width > 580 && fontSize > 20) {
                fontSize -= 5;
                ctx.font = `bold ${fontSize}px sans-serif`;
            }
            ctx.fillText(text, 320, 320);

            return new Promise(resolve => {
                canvas.toBlob(blob => {
                    if (!blob) return resolve(null);
                    const reader = new FileReader();
                    reader.onload = () => resolve(new Uint8Array(reader.result));
                    reader.readAsArrayBuffer(blob);
                }, 'image/jpeg', 0.9);
            });
        }

        function extractUSLTLyrics(arrayBuffer) {
            if (!arrayBuffer || arrayBuffer.byteLength < 10) return null;
            const view = new DataView(arrayBuffer);
            const bytes = new Uint8Array(arrayBuffer);

            if (bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return null;
            const verMajor = bytes[3];
            const flags = bytes[5];
            const tagSize = ((bytes[6] & 0x7F) << 21) | ((bytes[7] & 0x7F) << 14) | ((bytes[8] & 0x7F) << 7) | (bytes[9] & 0x7F);

            let offset = 10;
            if (flags & 0x40 && offset + 4 <= arrayBuffer.byteLength) {
                const extSize = ((bytes[10] & 0x7F) << 21) | ((bytes[11] & 0x7F) << 14) | ((bytes[12] & 0x7F) << 7) | (bytes[13] & 0x7F);
                offset += 4 + extSize;
            }
            const usltFrames = [];

            while (offset < 10 + tagSize && offset + 10 <= arrayBuffer.byteLength) {
                let frameID = "";
                for (let i = 0; i < 4; i++) {
                    if (bytes[offset + i] === 0) break;
                    frameID += String.fromCharCode(bytes[offset + i]);
                }
                if (!frameID || frameID.length < 3) break;
                let frameSize = 0;
                if (verMajor === 3) {
                    frameSize = view.getUint32(offset + 4);
                } else if (verMajor === 4) {
                    frameSize = ((bytes[offset + 4] & 0x7F) << 21) | ((bytes[offset + 5] & 0x7F) << 14) | ((bytes[offset + 6] & 0x7F) << 7) | (bytes[offset + 7] & 0x7F);
                } else break;
                offset += 10;
                if (offset + frameSize > arrayBuffer.byteLength) break;

                if (frameID === 'USLT' || frameID === 'ULT') {
                    const encoding = bytes[offset];
                    const lang = String.fromCharCode(bytes[offset + 1], bytes[offset + 2], bytes[offset + 3]).toLowerCase();
                    const bodyBytes = bytes.subarray(offset + 4, offset + frameSize);
                    let lyricsText = "";
                    if (encoding === 1 || encoding === 2) {
                        let descEnd = -1;
                        for (let i = 0; i < bodyBytes.length - 1; i += 2) {
                            if (bodyBytes[i] === 0 && bodyBytes[i + 1] === 0) { descEnd = i; break; }
                        }
                        const lyricBytes = descEnd !== -1 ? bodyBytes.subarray(descEnd + 2) : bodyBytes;
                        lyricsText = new TextDecoder(encoding === 2 ? 'utf-16be' : 'utf-16le').decode(lyricBytes);
                    } else {
                        let descEnd = bodyBytes.indexOf(0);
                        const lyricBytes = descEnd !== -1 ? bodyBytes.subarray(descEnd + 1) : bodyBytes;
                        if (encoding === 3) lyricsText = new TextDecoder('utf-8').decode(lyricBytes);
                        else {
                            try { lyricsText = new TextDecoder('utf-8', { fatal: true }).decode(lyricBytes); } 
                            catch (e) { lyricsText = new TextDecoder('gbk').decode(lyricBytes); }
                        }
                    }
                    if (lyricsText && lyricsText.trim()) usltFrames.push({ lang, text: lyricsText.trim() });
                }
                offset += frameSize;
            }
            if (usltFrames.length === 0) return null;
            const preferredLangs = ['eng', 'chs', 'zho', 'chi', 'jpn'];
            usltFrames.sort((a, b) => {
                const idxA = preferredLangs.indexOf(a.lang);
                const idxB = preferredLangs.indexOf(b.lang);
                return (idxA !== -1 ? idxA : 99) - (idxB !== -1 ? idxB : 99);
            });
            return usltFrames[0];
        }

        function embedUSLTLyricsToMP3(arrayBuffer, lrcText, lang = 'eng', imgBytes = null) {
            if (!arrayBuffer) return null;
            const bytes = new Uint8Array(arrayBuffer);

            let audioOffset = 0;
            if (bytes.length >= 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
                const flags = bytes[5];
                const tagSize = ((bytes[6] & 0x7F) << 21) | ((bytes[7] & 0x7F) << 14) | ((bytes[8] & 0x7F) << 7) | (bytes[9] & 0x7F);
                audioOffset = 10 + tagSize;
                if (flags & 0x10) audioOffset += 10;
            }
            const cleanAudioBytes = bytes.subarray(Math.min(audioOffset, bytes.length));

            // 构建 USLT 帧
            const encoder = new TextEncoder();
            const lrcBytes = encoder.encode(lrcText || '');
            const langBytes = encoder.encode((lang || 'eng').slice(0, 3).padEnd(3, 'e'));
            const frameBodyLength = 1 + 3 + 1 + lrcBytes.length;
            const usltHeader = new Uint8Array(10);
            usltHeader[0] = 0x55; usltHeader[1] = 0x53; usltHeader[2] = 0x4C; usltHeader[3] = 0x54;
            usltHeader[4] = (frameBodyLength >> 24) & 0xFF; usltHeader[5] = (frameBodyLength >> 16) & 0xFF;
            usltHeader[6] = (frameBodyLength >> 8) & 0xFF; usltHeader[7] = frameBodyLength & 0xFF;
            const usltBody = new Uint8Array(frameBodyLength);
            usltBody[0] = 0x03; usltBody.set(langBytes, 1); usltBody[4] = 0x00; usltBody.set(lrcBytes, 5);

            // 构建 APIC 帧（封面图）
            let apicFrame = null;
            if (imgBytes) {
                const mimeBytes = encoder.encode('image/jpeg');
                const apicBodyLength = 1 + mimeBytes.length + 1 + 1 + 1 + imgBytes.length;
                apicFrame = new Uint8Array(10 + apicBodyLength);
                apicFrame[0] = 0x41; apicFrame[1] = 0x50; apicFrame[2] = 0x49; apicFrame[3] = 0x43;
                apicFrame[4] = (apicBodyLength >> 24) & 0xFF; apicFrame[5] = (apicBodyLength >> 16) & 0xFF;
                apicFrame[6] = (apicBodyLength >> 8) & 0xFF; apicFrame[7] = apicBodyLength & 0xFF;
                let offset = 10;
                apicFrame[offset++] = 0x00; // ISO-8859-1
                apicFrame.set(mimeBytes, offset); offset += mimeBytes.length;
                apicFrame[offset++] = 0x00; // null 终止
                apicFrame[offset++] = 0x03; // Picture Type: Cover
                apicFrame[offset++] = 0x00; // Description
                apicFrame.set(imgBytes, offset);
            }

            const usltTotalSize = usltHeader.length + usltBody.length;
            const apicTotalSize = apicFrame ? apicFrame.length : 0;
            const totalTagPayloadSize = usltTotalSize + apicTotalSize;

            const id3Header = new Uint8Array(10);
            id3Header[0] = 0x49; id3Header[1] = 0x44; id3Header[2] = 0x33;
            id3Header[3] = 0x03; id3Header[4] = 0x00; id3Header[5] = 0x00;
            id3Header[6] = (totalTagPayloadSize >> 21) & 0x7F; id3Header[7] = (totalTagPayloadSize >> 14) & 0x7F;
            id3Header[8] = (totalTagPayloadSize >> 7) & 0x7F; id3Header[9] = totalTagPayloadSize & 0x7F;

            const resultBuffer = new Uint8Array(id3Header.length + totalTagPayloadSize + cleanAudioBytes.length);
            let p = 0;
            resultBuffer.set(id3Header, p); p += id3Header.length;
            resultBuffer.set(usltHeader, p); p += usltHeader.length;
            resultBuffer.set(usltBody, p); p += usltBody.length;
            if (apicFrame) {
                resultBuffer.set(apicFrame, p); p += apicFrame.length;
            }
            resultBuffer.set(cleanAudioBytes, p);

            return new Blob([resultBuffer], { type: 'audio/mpeg' });
        }

        function initWaveSurfer() {
            state.wsRegions = WaveSurfer.Regions.create();
            state.wavesurfer = WaveSurfer.create({
                container: '#waveform', media: DOM.videoPlayer,
                waveColor: '#334155', progressColor: '#6366f1',
                cursorColor: '#818cf8', cursorWidth: 2,
                barWidth: 2, barGap: 2, barRadius: 2, height: 70,
                plugins: [state.wsRegions]
            });

            // 监听拖动边缘事件，联动前后时间戳
            state.wsRegions.on('region-updated', (region) => {
                const idx = parseInt(region.id.split('-')[1]);
                const s = state.sentences[idx];
                if (!s) return;

                const diffStart = region.start - s.start;
                const diffEnd = region.end - s.end;
                let changed = false;

                // 拖动了左侧把手 -> 同时修改上一句的结束时间
                if (Math.abs(diffStart) > 0.001) {
                    s.start = Number(region.start.toFixed(3));
                    if (idx > 0) {
                        state.sentences[idx - 1].end = s.start;
                        const prevR = state.wsRegions.getRegions().find(r => r.id === 'region-' + (idx - 1));
                        if (prevR) prevR.setOptions({ end: s.start });
                    }
                    changed = true;
                }

                // 拖动了右侧把手 -> 同时修改下一句的开始时间
                if (Math.abs(diffEnd) > 0.001) {
                    s.end = Number(region.end.toFixed(3));
                    if (idx < state.sentences.length - 1) {
                        state.sentences[idx + 1].start = s.end;
                        const nextR = state.wsRegions.getRegions().find(r => r.id === 'region-' + (idx + 1));
                        if (nextR) nextR.setOptions({ start: s.end });
                    }
                    changed = true;
                }

                if (changed) {
                    renderSentenceList();
                    triggerCurrentCacheSave();
                }
            });

        // ================= UI 与 解析支持工具 =================
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === null) return '00:00.0';
            const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${Math.floor((seconds % 1) * 10)}`;
        }
        function formatLrcTimestamp(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
            return `[${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(Math.floor((seconds % 1) * 100)).padStart(2, '0')}]`;
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split(/\r?\n/);
            const timeRegex = /\[(\d{1,3}):(\d{2})(?:[\.\:](\d{1,3}))?\]/g;
            const parsed = [];
            lines.forEach((line) => {
                line = line.trim();
                let match, timestamps = [], cleanText = line;
                timeRegex.lastIndex = 0;
                while ((match = timeRegex.exec(line)) !== null) {
                    const min = parseInt(match[1], 10), sec = parseInt(match[2], 10);
                    let ms = match[3] ? parseInt((match[3] + "00").slice(0, 3), 10) : 0;
                    timestamps.push(min * 60 + sec + ms / 1000);
                    cleanText = cleanText.replace(match[0], '');
                }
                cleanText = cleanText.trim();
                if (cleanText && timestamps.length > 0) timestamps.forEach(time => parsed.push({ start: time, text: cleanText }));
            });
            parsed.sort((a, b) => a.start - b.start);
            let duration = state.wavesurfer ? (state.wavesurfer.getDuration() || 300) : 300;
            return parsed.map((item, index) => {
                const nextStart = parsed[index + 1] ? parsed[index + 1].start : Math.max(item.start + 2, duration);
                return { id: index, start: Number(item.start.toFixed(3)), end: Number(Math.max(item.start + 0.3, nextStart).toFixed(3)), text: item.text };
            });
        }
        function parseSRT(srtText) {
            // 省略详细代码，与原文逻辑保持一致
            if (!srtText) return [];
            const parsed = [];
            const blocks = srtText.trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\n+/);
            blocks.forEach((block) => {
                const lines = block.split('\n');
                let timeLineIndex = lines.findIndex(l => l.includes('-->'));
                if (timeLineIndex === -1) return;
                const match = lines[timeLineIndex].match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{1,3})/);
                if (match) {
                    const start = parseInt(match[1])*3600 + parseInt(match[2])*60 + parseInt(match[3]) + parseInt(match[4].padEnd(3,'0').slice(0,3))/1000;
                    const end = parseInt(match[5])*3600 + parseInt(match[6])*60 + parseInt(match[7]) + parseInt(match[8].padEnd(3,'0').slice(0,3))/1000;
                    const text = lines.slice(timeLineIndex + 1).join(' ').trim();
                    if (text) parsed.push({ id: parsed.length, start: Number(start.toFixed(3)), end: Number(Math.max(start + 0.3, end).toFixed(3)), text: text });
                }
            });
            return parsed;
        }

        function triggerCurrentCacheSave() {
            if (!state.currentFilename || (!state.currentAudioBlob && !state.sentences.length)) return;
            saveToCache({ id: state.currentFilename, filename: state.currentFilename, audioBlob: state.currentAudioBlob, lrcText: state.currentLrcText, sentences: state.sentences });
        }

        // ================= 自动断句功能补充 =================
        function analyzeSilenceSegmentation() {
            if (!state.audioBuffer && state.wavesurfer) state.audioBuffer = state.wavesurfer.getDecodedData();
            if (!state.audioBuffer) return alert("请先加载有效的音视频文件！");
            
            const channelData = state.audioBuffer.getChannelData(0);
            const sampleRate = state.audioBuffer.sampleRate;
            const duration = state.audioBuffer.duration;
            const chunkSize = Math.floor(sampleRate * 0.02);
            const minSilenceChunks = Math.floor(state.silenceMinSec / 0.02);
            
            let inSpeech = false, speechStart = 0, silenceChunkCount = 0;
            const rawSpeechBlocks = [];

            for (let i = 0; i < Math.floor(channelData.length / chunkSize); i++) {
                let sumSquare = 0;
                for (let j = 0; j < chunkSize; j++) sumSquare += channelData[i * chunkSize + j] ** 2;
                const rms = Math.sqrt(sumSquare / chunkSize);
                const currentTime = (i * chunkSize) / sampleRate;

                if (rms >= state.silenceThreshold) {
                    silenceChunkCount = 0;
                    if (!inSpeech) { inSpeech = true; speechStart = currentTime; }
                } else {
                    if (inSpeech) {
                        silenceChunkCount++;
                        if (silenceChunkCount >= minSilenceChunks) {
                            inSpeech = false;
                            const speechEnd = currentTime - (silenceChunkCount * 0.02);
                            if (speechEnd - speechStart >= 0.2) rawSpeechBlocks.push({ speechStart, speechEnd });
                        }
                    }
                }
            }
            if (inSpeech) rawSpeechBlocks.push({ speechStart, speechEnd: duration });
            if (rawSpeechBlocks.length === 0) return alert("未检测到有效语音段！请降低灵敏度或缩短断句阈值。");

            const sentences = [];
            for (let k = 0; k < rawSpeechBlocks.length; k++) {
                let start = (k === 0) ? Math.max(0, rawSpeechBlocks[k].speechStart - 0.1) : (rawSpeechBlocks[k - 1].speechEnd + rawSpeechBlocks[k].speechStart) / 2;
                let end = (k === rawSpeechBlocks.length - 1) ? Math.min(duration, rawSpeechBlocks[k].speechEnd + 0.1) : (rawSpeechBlocks[k].speechEnd + rawSpeechBlocks[k + 1].speechStart) / 2;
                sentences.push({ id: k, start: Number(start.toFixed(3)), end: Number(end.toFixed(3)), text: `片段 #${k + 1}` });
            }

            state.sentences = sentences;
            DOM.modeBadge.textContent = "自动中点断句";
            renderRegions();
            renderSentenceList();
            if (state.sentences.length > 0) setActiveSentence(0, false);
            triggerCurrentCacheSave();
        }

        // ================= 新增：在当前位置切分断句 =================
        function splitAtCurrentTime() {
            if (!state.wavesurfer || state.sentences.length === 0) return;
            const t = state.wavesurfer.getCurrentTime();
            
            // 找到包含该时间的句子，或者最接近的前一个句子
            let idx = state.sentences.findIndex(s => t >= s.start && t < s.end);
            if (idx === -1) {
                // 如果刚好落在缝隙里（虽然我们逻辑上是连续的），找最后一个起点小于t的
                idx = [...state.sentences].reverse().findIndex(s => s.start <= t);
                if (idx !== -1) idx = state.sentences.length - 1 - idx;
            }

            if (idx !== -1) {
                const s = state.sentences[idx];
                // 防误触：如果离边缘太近，不切分
                if (t - s.start < 0.1 || s.end - t < 0.1) return; 

                const newSentence = {
                    start: Number(t.toFixed(3)),
                    end: s.end,
                    text: (s.text || '新片段') + ' (下半句)'
                };
                
                s.end = Number(t.toFixed(3));
                s.text = (s.text || '原片段') + ' (上半句)';

                state.sentences.splice(idx + 1, 0, newSentence);
                state.sentences.forEach((sen, i) => sen.id = i); // 重新分配 ID
                
                renderRegions();
                renderSentenceList();
                triggerCurrentCacheSave();
            }
        }

        // ================= 新增：删除指定断句并合并 =================
        function deleteSentence(idx) {
            if (idx < 0 || idx >= state.sentences.length) return;
            
            if (state.sentences.length === 1) {
                state.sentences = [];
            } else if (idx === 0) {
                // 如果是第一句，合并给下一句
                state.sentences[1].start = state.sentences[0].start;
                state.sentences[1].text = [state.sentences[0].text, state.sentences[1].text].filter(Boolean).join(' ');
                state.sentences.splice(0, 1);
            } else {
                // 其他情况，合并给上一句
                state.sentences[idx - 1].end = state.sentences[idx].end;
                state.sentences[idx - 1].text = [state.sentences[idx - 1].text, state.sentences[idx].text].filter(Boolean).join(' ');
                state.sentences.splice(idx, 1);
            }

            state.sentences.forEach((s, i) => s.id = i);
            if (state.currentIndex >= state.sentences.length) state.currentIndex = state.sentences.length - 1;
            
            renderRegions();
            renderSentenceList();
            triggerCurrentCacheSave();
        }

        function renderSentenceList() {
            const filterText = DOM.inputSearch.value.toLowerCase().trim();
            DOM.sentenceList.innerHTML = '';
            const filtered = state.sentences.filter(s => (s.text || '').toLowerCase().includes(filterText));
            DOM.badgeSentenceCount.textContent = `${filtered.length} 句`;

            if (filtered.length === 0) {
                DOM.sentenceList.appendChild(DOM.emptyPlaceholder);
                DOM.emptyPlaceholder.classList.remove('hidden');
                return;
            } else { DOM.emptyPlaceholder.classList.add('hidden'); }

            filtered.forEach((sentence) => {
                const isActive = sentence.id === state.currentIndex;
                const itemDiv = document.createElement('div');
                itemDiv.id = `sentence-item-${sentence.id}`;
                itemDiv.className = `p-2 rounded-xl border transition flex items-center justify-between space-x-2 ${
                    isActive ? 'bg-brand-600/20 border-brand-500/80 text-white shadow-md shadow-brand-500/10' : 'bg-slate-900/60 hover:bg-slate-800/80 border-slate-800/80 text-slate-300'
                }`;
                itemDiv.onclick = () => jumpToSentence(sentence.id, true);

                const leftContainer = document.createElement('div');
                leftContainer.className = 'flex items-center space-x-1.5 overflow-hidden flex-1';
                
                const indexBadge = document.createElement('span');
                indexBadge.className = 'text-[9px] font-mono px-1 py-0.2 rounded bg-slate-950/80 text-indigo-400 border border-slate-800 shrink-0';
                indexBadge.textContent = `#${sentence.id + 1}`;

                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.value = sentence.text || '';
                textInput.className = 'w-full bg-slate-950/60 text-xs text-slate-100 px-2 py-0.5 rounded border border-slate-700/60 focus:border-indigo-500 focus:outline-none transition';
                textInput.addEventListener('input', (e) => { sentence.text = e.target.value; triggerCurrentCacheSave(); });
                textInput.addEventListener('click', (e) => e.stopPropagation());

                leftContainer.appendChild(indexBadge);
                leftContainer.appendChild(textInput);

                const rightContainer = document.createElement('div');
                rightContainer.className = 'flex items-center space-x-1 shrink-0';

                const timeBadge = document.createElement('span');
                timeBadge.className = 'text-[9px] text-slate-500 font-mono hidden sm:inline mr-1';
                timeBadge.textContent = `${formatTime(sentence.start)}`;

                const playBtn = document.createElement('button');
                playBtn.className = 'w-6 h-6 rounded-lg bg-slate-800 hover:bg-brand-600 text-slate-400 hover:text-white flex items-center justify-center transition';
                playBtn.innerHTML = `<i class="fa-solid ${isActive && state.wavesurfer.isPlaying() ? 'fa-pause' : 'fa-play'} text-[10px]"></i>`;
                playBtn.onclick = (e) => { e.stopPropagation(); jumpToSentence(sentence.id, true); };

                const delBtn = document.createElement('button');
                delBtn.className = 'w-6 h-6 rounded-lg bg-slate-800/80 hover:bg-rose-600/90 text-slate-500 hover:text-white flex items-center justify-center transition ml-1';
                delBtn.title = "删除并合并至上一句";
                delBtn.innerHTML = `<i class="fa-solid fa-trash-can text-[10px]"></i>`;
                delBtn.onclick = (e) => { e.stopPropagation(); deleteSentence(sentence.id); };

                rightContainer.appendChild(timeBadge);
                rightContainer.appendChild(playBtn);
                rightContainer.appendChild(delBtn);

                itemDiv.appendChild(leftContainer);
                itemDiv.appendChild(rightContainer);
                DOM.sentenceList.appendChild(itemDiv);
            });
        }

        // ================= 导出与同步 =================
        function exportLRC() {
            if (!state.sentences || state.sentences.length === 0) return alert("没有可以导出的字幕！");
            let lrcContent = `[ti:${state.currentFilename}]\n[by:EchoMaster]\n`;
            state.sentences.forEach(s => lrcContent += `${formatLrcTimestamp(s.start)}${(s.text || '').trim()}\n`);
            
            const blob = new Blob([lrcContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(state.currentFilename || 'repeater').replace(/\.[^/.]+$/, "")}.lrc`;
            a.click();
        }

        async function exportAudioWithLyrics() {
            if (!state.sentences || state.sentences.length === 0) return alert("没有句子段落可内嵌！");
            let lrcContent = `[ti:${state.currentFilename}]\n[by:EchoMaster]\n`;
            state.sentences.forEach(s => lrcContent += `${formatLrcTimestamp(s.start)}${(s.text || '').trim()}\n`);

            let arrayBuffer = null;
            if (state.currentAudioBlob) arrayBuffer = await state.currentAudioBlob.arrayBuffer();
            else if (DEMO_AUDIO_URL) arrayBuffer = await (await fetch(DEMO_AUDIO_URL)).arrayBuffer();
            if (!arrayBuffer) return alert("未找到有效音频！");

            // 判断是否需要写入封面图
            const coverText = DOM.inputCoverText.value.trim();
            let imgBytes = null;
            if (coverText) imgBytes = await getCoverImageBytes(coverText);

            const taggedBlob = embedUSLTLyricsToMP3(arrayBuffer, lrcContent, 'eng', imgBytes);
            if (!taggedBlob) return alert("生成失败！");

            const url = URL.createObjectURL(taggedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(state.currentFilename || 'audio').replace(/\.[^/.]+$/, "")}_lyrics.mp3`;
            a.click();
        }

        function handleTimeSync(currentTime) {
            if (state.sentences.length === 0) return;
            const currentSentence = state.sentences[state.currentIndex];
            if (state.loopMode === 1 && currentSentence) {
                if (currentTime >= currentSentence.end - 0.08 || currentTime < currentSentence.start) {
                    state.wavesurfer.setTime(currentSentence.start);
                    return;
                }
            }
            const foundIndex = state.sentences.findIndex(s => currentTime >= s.start && currentTime < s.end);
            if (foundIndex !== -1 && foundIndex !== state.currentIndex) setActiveSentence(foundIndex, false);
        }

        function setActiveSentence(index, shouldSeek = true) {
            if (index < 0 || index >= state.sentences.length) return;
            state.currentIndex = index;
            const sentence = state.sentences[index];
            if (shouldSeek && state.wavesurfer) state.wavesurfer.setTime(sentence.start);
            
            // 更新 Regions 颜色高亮
            if (state.wsRegions) {
                state.wsRegions.getRegions().forEach(r => {
                    const idx = parseInt(r.id.split('-')[1]);
                    r.setOptions({
                        color: idx === index ? 'rgba(99, 102, 241, 0.4)' : (idx % 2 === 0 ? 'rgba(255, 255, 255, 0.05)' : 'rgba(255, 255, 255, 0.1)')
                    });
                });
            }
            renderSentenceList();
            const activeElem = document.getElementById(`sentence-item-${index}`);
            if (activeElem) activeElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function jumpToSentence(index, playImmediate = true) {
            setActiveSentence(index, true);
            if (playImmediate && state.wavesurfer) state.wavesurfer.play();
        }

        function bindEvents() {
            DOM.btnToggleLayout.addEventListener('click', (e) => { e.stopPropagation(); toggleSubtitlePanel(!isSubtitleHidden); });
            
            // Drag and Drop
            DOM.dropZone.addEventListener('dragover', (e) => { e.preventDefault(); DOM.dropZone.classList.add('border-brand-500', 'bg-brand-950/20'); });
            DOM.dropZone.addEventListener('dragleave', () => DOM.dropZone.classList.remove('border-brand-500', 'bg-brand-950/20'));
            DOM.dropZone.addEventListener('drop', (e) => {
                e.preventDefault(); DOM.dropZone.classList.remove('border-brand-500', 'bg-brand-950/20');
                Array.from(e.dataTransfer.files).forEach(file => {
                    const lName = file.name.toLowerCase();
                    if (file.type.startsWith('audio/') || file.type.startsWith('video/') || lName.match(/\.(mp3|wav|m4a|mp4|mkv|webm|mov)$/i)) loadAudioFile(file);
                    else if (lName.match(/\.(lrc|srt|txt)$/i)) loadLrcFile(file);
                });
            });

            DOM.inputAudio.addEventListener('change', (e) => { if(e.target.files[0]) { loadAudioFile(e.target.files[0]); e.target.value = ''; }});
            DOM.inputLrc.addEventListener('change', (e) => { if(e.target.files[0]) { loadLrcFile(e.target.files[0]); e.target.value = ''; }});
            
            DOM.btnInsertBreakpoint.addEventListener('click', splitAtCurrentTime);
            DOM.btnPlayPause.addEventListener('click', () => { if (state.wavesurfer) state.wavesurfer.playPause(); });
            DOM.btnPrev.addEventListener('click', () => {
                if (state.sentences.length === 0) return;
                if (state.isRandomMode) jumpToSentence(Math.floor(Math.random() * state.sentences.length), true);
                else if (state.currentIndex > 0) jumpToSentence(state.currentIndex - 1, true);
            });
            DOM.btnNext.addEventListener('click', () => {
                if (state.sentences.length === 0) return;
                if (state.isRandomMode) jumpToSentence(Math.floor(Math.random() * state.sentences.length), true);
                else if (state.currentIndex < state.sentences.length - 1) jumpToSentence(state.currentIndex + 1, true);
            });
            DOM.btnReplay.addEventListener('click', () => { if (state.currentIndex >= 0) jumpToSentence(state.currentIndex, true); });
            DOM.btnToggleLoop.addEventListener('click', () => {
                state.loopMode = (state.loopMode + 1) % 3;
                if (state.loopMode === 0) { DOM.btnToggleLoop.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 text-slate-400"; DOM.loopBadge.textContent = ""; }
                else if (state.loopMode === 1) { DOM.btnToggleLoop.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-brand-600 text-white"; DOM.loopBadge.textContent = "1"; DOM.loopBadge.className = "absolute -top-1 -right-1 w-3.5 h-3.5 flex items-center justify-center rounded-full bg-emerald-400 text-[9px] font-bold text-slate-950"; }
                else { DOM.btnToggleLoop.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-600 text-white"; DOM.loopBadge.textContent = "全"; DOM.loopBadge.className = "absolute -top-1 -right-1 w-3.5 h-3.5 flex items-center justify-center rounded-full bg-amber-300 text-[9px] font-bold text-slate-950"; }
            });
            
            DOM.chkShowRegion.addEventListener('change', (e) => {
                if (state.wsRegions) {
                    state.wsRegions.getRegions().forEach(r => {
                        if (r.element) r.element.style.display = e.target.checked ? '' : 'none';
                    });
                }
            });

            DOM.sliderZoom.addEventListener('input', (e) => { if (state.wavesurfer) state.wavesurfer.zoom(Number(e.target.value)); });
            DOM.sliderVolume.addEventListener('input', (e) => { if (state.wavesurfer) state.wavesurfer.setVolume(Number(e.target.value)); });
            DOM.btnAutoSegment.addEventListener('click', analyzeSilenceSegmentation);
            DOM.btnExportLrc.addEventListener('click', exportLRC);
            DOM.btnExportAudio.addEventListener('click', exportAudioWithLyrics);
            DOM.inputSearch.addEventListener('input', renderSentenceList);
            
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                if (e.code === 'Space') { e.preventDefault(); if (state.wavesurfer) state.wavesurfer.playPause(); }
                else if (e.code === 'ArrowLeft') { e.preventDefault(); DOM.btnPrev.click(); }
                else if (e.code === 'ArrowRight') { e.preventDefault(); DOM.btnNext.click(); }
            });
        }

        // 文件加载逻辑
        async function loadAudioFile(file) {
            DOM.waveformLoader.classList.remove('hidden');
            state.currentFilename = file.name; state.currentAudioBlob = file;
            DOM.currentFilename.textContent = file.name;
            updateVideoLayout(file.type.startsWith('video/') || !!file.name.match(/\.(mp4|mkv|webm|mov|avi)$/i));
            state.wavesurfer.load(URL.createObjectURL(file));
            
            try {
                const embeddedLyric = extractUSLTLyrics(await file.arrayBuffer());
                if (embeddedLyric && embeddedLyric.text) {
                    state.currentLrcText = embeddedLyric.text;
                    state.sentences = embeddedLyric.text.includes('-->') ? parseSRT(embeddedLyric.text) : parseLRC(embeddedLyric.text);
                    renderRegions(); renderSentenceList();
                    if (state.sentences.length > 0) setActiveSentence(0, false);
                }
            } catch (err) {}
            triggerCurrentCacheSave();
        }

        function loadLrcFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                state.currentLrcText = e.target.result;
                state.sentences = (file.name.toLowerCase().endsWith('.srt') || state.currentLrcText.includes('-->')) ? parseSRT(state.currentLrcText) : parseLRC(state.currentLrcText);
                renderRegions(); renderSentenceList();
                if (state.sentences.length > 0) setActiveSentence(0, false);
                triggerCurrentCacheSave();
            };
            reader.readAsText(file);
        }

        function loadDemoLesson() {
            state.currentFilename = "English_Lesson_Sample";
            state.currentLrcText = DEMO_LRC;
            DOM.currentFilename.textContent = "示例课程 - English Speech";
            DOM.waveformLoader.classList.remove('hidden');
            updateVideoLayout(false);
            state.wavesurfer.load(DEMO_AUDIO_URL);
            state.sentences = parseLRC(DEMO_LRC);
            renderRegions(); renderSentenceList();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initWaveSurfer(); bindEvents(); loadDemoLesson();
        });
    </script>
</body>
