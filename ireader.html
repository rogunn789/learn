<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Japanese Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <script src="https://rogunn789.github.io/learn/looup.js"></script>
    <style id="custom-font-style"></style>
    <style>
        :root {
            --bg-color: #171b19;
            --text-color: #e2e8f0;
            --noun-bg: #4a3f2b;
            --verb-bg: #333333;
            --base-border: rgba(255, 255, 255, 0.45);
            --ui-bg: #222a27;
            --ui-border: #384540;
            --accent-color: #d97706;
        }

        .theme-day {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --noun-bg: #e4d8c1;
            --verb-bg: #e2e8f0;
            --base-border: rgba(0, 0, 0, 0.4);
            --ui-bg: #ffffff;
            --ui-border: #cbd5e1;
            --accent-color: #b45309;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Reader Content Styling */
        #content {
            font-size: 18px;
            line-height: 2.2;
        }

        .sentence-block {
            margin-bottom: 1.25rem;
            position: relative;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border-bottom: 1px dashed var(--ui-border);
            transition: background-color 0.4s ease, border-color 0.3s;
        }
        
        .sentence-block.highlight-target {
            background-color: rgba(217, 119, 6, 0.18);
            border-left: 4px solid var(--accent-color);
        }

        /* ========================================================
           Ruby & POS Styling (Fixed for Mobile Non-overlapping)
           ======================================================== */
        ruby.token {
            display: inline-flex;
            flex-direction: column-reverse; /* 强制注音永远在上，原文字在下 */
            align-items: center;
            vertical-align: bottom;
            margin: 2px 3px;
        }

        ruby.token rt {
            display: block;
            font-size: 0.625em;
            color: var(--text-color);
            opacity: 0.85;
            line-height: 1.2;
            margin-bottom: 2px;
            font-weight: normal;
        }
        
        /* 隐藏没有注音的占位 */
        ruby.token rt:empty {
            display: none !important;
        }

        /* 背景色和下划线仅包裹主文本，和截图保持一致 */
        .token-base {
            display: block;
            padding: 2px 5px;
            border-radius: 6px;
            border-bottom: 1.5px solid var(--base-border);
            line-height: 1.25;
        }

        /* 词性颜色赋予给 .token-base，而不是整个 ruby */
        .pos-noun .token-base { background-color: var(--noun-bg); }
        .theme-day .pos-noun .token-base { color: #2a1f0e; }

        .pos-verb .token-base, .pos-adverb .token-base, .pos-adjective .token-base { background-color: var(--verb-bg); }
        .theme-day .pos-verb .token-base, .theme-day .pos-adverb .token-base, .theme-day .pos-adjective .token-base { color: #0f172a; }

        .pos-other .token-base { background-color: transparent; }

        /* Furigana toggle override */
        body.hide-furigana ruby.token rt {
            display: none !important;
        }

        /* UI Elements */
        .glass-nav {
            background-color: var(--ui-bg);
            border-top: 1px solid var(--ui-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
        }
        
        .modal-content {
            background-color: var(--bg-color);
            border: 1px solid var(--ui-border);
            color: var(--text-color);
        }

        .btn-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 0.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            cursor: pointer;
            color: var(--text-color);
            user-select: none;
            min-width: 36px;
            flex: 1;
        }

        .btn-icon:hover, .btn-icon:active {
            background-color: var(--ui-border);
        }

        /* Action Buttons */
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 6px;
            vertical-align: middle;
            transition: transform 0.2s, opacity 0.2s;
            user-select: none;
        }

        .translate-btn {
            background-color: #b94a48;
            color: white;
            opacity: 0.85;
        }
        
        .translate-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .tts-btn {
            background-color: #2563eb;
            color: white;
            opacity: 0.85;
        }

        .tts-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .tts-btn.speaking {
            background-color: #10b981;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .bookmark-btn {
            color: #94a3b8;
            background: transparent;
        }

        .bookmark-btn.active {
            color: #f59e0b;
        }

        .bookmark-btn:hover {
            transform: scale(1.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ui-border);
            border-radius: 3px;
        }

        /* Toast notification */
        #toast {
            transition: opacity 0.3s, transform 0.3s;
        }
    </style>
</head>
<body class="theme-night min-h-screen relative pb-24">

    <!-- Top Dict Loading Status Pill -->
    <div id="dict-status" class="fixed top-3 right-3 z-30 px-3 py-1 rounded-full text-xs bg-amber-600/80 text-white shadow-lg backdrop-blur flex items-center space-x-1.5 opacity-90 transition-all duration-300">
        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span id="dict-status-text">词库加载中...</span>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 transform -translate-y-2 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-xl text-sm border border-slate-700 flex items-center space-x-2">
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Main Content Area -->
    <main id="reader-container" class="max-w-3xl mx-auto pt-6 px-4 pb-8">
        <div id="book-title" class="text-2xl font-bold mb-6 text-center opacity-80"></div>
        <div id="content"></div>
        
        <div id="empty-state" class="hidden flex flex-col items-center justify-center mt-20 opacity-60 text-center">
            <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <p class="text-lg font-medium mb-2">未导入图书</p>
            <p class="text-sm opacity-70 mb-4">点击下方“导入”按钮，导入 .txt 文本开始阅读</p>
            <button onclick="triggerImport()" class="px-5 py-2.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-medium text-sm transition shadow-lg">导入 TXT 文件</button>
        </div>
    </main>

    <!-- Bottom Fixed Operating Navigation Bar -->
    <nav class="glass-nav fixed bottom-0 left-0 right-0 z-40 px-1 py-1.5 max-w-3xl mx-auto rounded-t-xl shadow-2xl">
        <div class="flex items-center justify-between text-xs">
            <!-- 1. Import -->
            <div class="btn-icon" onclick="triggerImport()" title="导入TXT">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="text-[9px] mt-0.5">导入</span>
            </div>

            <!-- 2. Fuzzy Search -->
            <div class="btn-icon" onclick="openSearchModal()" title="模糊检索">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[9px] mt-0.5">检索</span>
            </div>

            <!-- 3. Bookmarks -->
            <div class="btn-icon" onclick="openBookmarksModal()" title="书签">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                <span class="text-[9px] mt-0.5">书签</span>
            </div>

            <!-- 4. Library -->
            <div class="btn-icon" onclick="openModal('library-modal')" title="书库">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <span class="text-[9px] mt-0.5">书库</span>
            </div>

            <div class="h-5 w-px bg-gray-500 opacity-20"></div>

            <!-- 5. Prev Page -->
            <div class="btn-icon" onclick="prevPage()" title="上一页">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span class="text-[9px] mt-0.5">上一页</span>
            </div>

            <!-- Page Indicator (Now Clickable for Jumping) -->
            <div class="text-[10px] font-mono opacity-80 px-2 py-1 min-w-[50px] text-center cursor-pointer hover:bg-gray-500 hover:bg-opacity-20 rounded transition" id="page-indicator" onclick="openJumpModal()" title="点击跳转页码">0 / 0</div>

            <!-- 6. Next Page -->
            <div class="btn-icon" onclick="nextPage()" title="下一页">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                <span class="text-[9px] mt-0.5">下一页</span>
            </div>

            <div class="h-5 w-px bg-gray-500 opacity-20"></div>

            <!-- 7. Toggle Furigana -->
            <div class="btn-icon" onclick="toggleFurigana()" title="注音切换">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                <span class="text-[9px] mt-0.5" id="furigana-btn-text">注音</span>
            </div>

            <!-- 8. Day/Night Theme Toggle -->
            <div class="btn-icon" onclick="toggleTheme()" title="模式">
                <svg id="theme-icon-night" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <svg id="theme-icon-day" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-[9px] mt-0.5" id="theme-btn-text">模式</span>
            </div>

            <!-- 9. Settings -->
            <div class="btn-icon" onclick="openModal('settings-modal')" title="设置">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[9px] mt-0.5">设置</span>
            </div>
        </div>
    </nav>

    <!-- Hidden Main File Input -->
    <input type="file" id="main-book-upload" accept=".txt" class="hidden" onchange="handleBookUpload(event)">

    <!-- Jump Page Modal (New) -->
    <div id="jump-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content w-11/12 max-w-sm rounded-2xl shadow-2xl p-6 relative text-center">
            <h3 class="text-lg font-bold mb-5 flex items-center justify-center">
                <svg class="w-5 h-5 mr-2 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                跳转到指定页
            </h3>
            <div class="mb-5 flex items-center justify-center">
                <input type="number" id="jump-input" class="w-24 text-center px-3 py-2 bg-black bg-opacity-20 border border-gray-600 border-opacity-50 rounded-lg focus:outline-none focus:border-amber-500 text-xl font-mono" min="1" value="1">
                <span class="ml-3 text-sm opacity-70" id="jump-total-pages">/ 100 页</span>
            </div>
            <div class="mb-7 px-2">
                <input type="range" id="jump-range" class="w-full accent-amber-500 cursor-pointer" min="1" max="100" value="1" oninput="document.getElementById('jump-input').value = this.value">
            </div>
            <div class="flex justify-center space-x-4">
                <button onclick="closeModal('jump-modal')" class="px-5 py-2.5 rounded-lg bg-gray-600 bg-opacity-30 hover:bg-opacity-50 text-sm font-medium transition w-full">取消</button>
                <button onclick="executeJump()" class="px-5 py-2.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-sm font-medium transition w-full shadow-lg">确认跳转</button>
            </div>
        </div>
    </div>

    <!-- Fuzzy Search Modal -->
    <div id="search-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content w-11/12 max-w-xl max-h-[85vh] rounded-2xl shadow-2xl p-5 relative flex flex-col">
            <button onclick="closeModal('search-modal')" class="absolute top-4 right-4 opacity-60 hover:opacity-100 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold mb-3 flex items-center">
                <svg class="w-5 h-5 text-amber-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                全文模糊检索 (前20条)
            </h2>
            <div class="relative mb-4">
                <input type="text" id="search-input" placeholder="输入关键词（日文或中文）..." class="w-full px-4 py-2.5 bg-black/20 border border-gray-600/50 rounded-xl focus:outline-none focus:border-amber-500 text-sm" oninput="performFuzzySearch()">
            </div>
            <div id="search-results-list" class="overflow-y-auto flex-1 space-y-2.5 pr-1">
                <div class="text-center opacity-50 my-6 text-sm">请输入关键词进行搜索</div>
            </div>
        </div>
    </div>

    <!-- Bookmarks Modal -->
    <div id="bookmarks-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content w-11/12 max-w-lg max-h-[80vh] rounded-2xl shadow-2xl p-6 relative flex flex-col">
            <button onclick="closeModal('bookmarks-modal')" class="absolute top-4 right-4 opacity-60 hover:opacity-100 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <svg class="w-6 h-6 text-amber-500 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>
                本书书签 (Bookmarks)
            </h2>
            <div id="bookmarks-list" class="overflow-y-auto flex-1 space-y-3 pr-1">
                <!-- Bookmarks will be injected here -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content w-11/12 max-w-md rounded-2xl shadow-2xl p-6 relative">
            <button onclick="closeModal('settings-modal')" class="absolute top-4 right-4 opacity-60 hover:opacity-100 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold mb-6">阅读设置</h2>
            
            <div class="space-y-5">
                <!-- Font Size -->
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium">字体大小 (Font Size)</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeFontSize(-2)" class="w-8 h-8 rounded-lg bg-gray-600 bg-opacity-20 hover:bg-opacity-40 flex items-center justify-center font-bold text-lg">-</button>
                        <span id="font-size-display" class="w-12 text-center text-sm font-mono">18px</span>
                        <button onclick="changeFontSize(2)" class="w-8 h-8 rounded-lg bg-gray-600 bg-opacity-20 hover:bg-opacity-40 flex items-center justify-center font-bold text-lg">+</button>
                    </div>
                </div>

                <!-- Line Spacing -->
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium">行间距 (Line Spacing)</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeLineSpacing(-0.2)" class="w-8 h-8 rounded-lg bg-gray-600 bg-opacity-20 hover:bg-opacity-40 flex items-center justify-center font-bold text-lg">-</button>
                        <span id="line-spacing-display" class="w-12 text-center text-sm font-mono">2.2</span>
                        <button onclick="changeLineSpacing(0.2)" class="w-8 h-8 rounded-lg bg-gray-600 bg-opacity-20 hover:bg-opacity-40 flex items-center justify-center font-bold text-lg">+</button>
                    </div>
                </div>

                <!-- Custom Font Upload -->
                <div class="pt-3 border-t border-gray-600 border-opacity-30">
                    <label class="block mb-2 text-sm font-medium">自定义字体 (.ttf, .otf)</label>
                    <input type="file" id="font-upload" accept=".ttf,.otf" class="block w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 cursor-pointer" onchange="handleFontUpload(event)">
                    <p id="font-status-text" class="text-xs opacity-60 mt-1">未设置自定义字体</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Library Modal -->
    <div id="library-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content w-11/12 max-w-md max-h-[80vh] rounded-2xl shadow-2xl p-6 relative flex flex-col">
            <button onclick="closeModal('library-modal')" class="absolute top-4 right-4 opacity-60 hover:opacity-100 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-xl font-bold mb-4">书库 (Library)</h2>
            <div id="library-list" class="overflow-y-auto flex-1 space-y-3 pr-1">
                <!-- Books injected here -->
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content w-11/12 max-w-sm rounded-2xl shadow-2xl p-6 relative text-center">
            <h3 class="text-lg font-bold mb-3" id="confirm-title">确认删除</h3>
            <p class="text-sm opacity-80 mb-6" id="confirm-msg">确定要删除该书本吗？</p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeModal('confirm-modal')" class="px-4 py-2 rounded-lg bg-gray-600 bg-opacity-30 hover:bg-opacity-50 text-sm font-medium transition">取消</button>
                <button id="confirm-action-btn" class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white text-sm font-medium transition">删除</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const AppState = {
            db: null,
            tokenizer: null,
            tokenizerReady: false,
            currentBook: null,
            currentSpeakingIndex: null,
            settings: {
                theme: 'night',
                fontSize: 18,
                lineSpacing: 2.2,
                showFurigana: true,
                customFont: null,
                fontName: null,
                lastBookId: null
            },
            sentencesPerPage: 50
        };

        // --- Toast System ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2');
            }, 2500);
        }

        // --- IndexedDB Wrapper ---
        const DB = {
            init: function() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('JapaneseReaderDB', 2);
                    
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('books')) {
                            db.createObjectStore('books', { keyPath: 'id', autoIncrement: true });
                        }
                        if (!db.objectStoreNames.contains('settings')) {
                            db.createObjectStore('settings', { keyPath: 'id' });
                        }
                    };

                    request.onsuccess = (e) => {
                        AppState.db = e.target.result;
                        resolve();
                    };
                    
                    request.onerror = (e) => reject(e.target.error);
                });
            },
            
            getSettings: function() {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('settings', 'readonly');
                    const store = tx.objectStore('settings');
                    const req = store.get('main');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            
            saveSettings: function(settings) {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('settings', 'readwrite');
                    const store = tx.objectStore('settings');
                    const req = store.put({ id: 'main', ...settings });
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            },
            
            addBook: function(title, chunks) {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    const book = { 
                        title, 
                        chunks, 
                        lastPage: 0, 
                        bookmarks: [], 
                        addedAt: Date.now() 
                    };
                    const req = store.add(book);
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onerror = () => reject(req.error);
                });
            },
            
            updateBook: function(book) {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    const req = store.put(book);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            },
            
            getBook: function(id) {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('books', 'readonly');
                    const store = tx.objectStore('books');
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            
            getAllBooksInfo: function() {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('books', 'readonly');
                    const store = tx.objectStore('books');
                    const req = store.getAll();
                    req.onsuccess = () => {
                        const infos = req.result.map(b => ({
                            id: b.id, 
                            title: b.title, 
                            lastPage: b.lastPage,
                            totalPages: Math.ceil(b.chunks.length / AppState.sentencesPerPage),
                            bookmarksCount: (b.bookmarks || []).length,
                            addedAt: b.addedAt
                        }));
                        resolve(infos.sort((a,b) => b.addedAt - a.addedAt));
                    };
                    req.onerror = () => reject(req.error);
                });
            },

            deleteBook: function(id) {
                return new Promise((resolve, reject) => {
                    const tx = AppState.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            }
        };

        // --- Core Application Initialization ---
        async function initialize() {
            try {
                await DB.init();
                
                // Load Settings
                const savedSettings = await DB.getSettings();
                if (savedSettings) {
                    AppState.settings = { ...AppState.settings, ...savedSettings };
                }
                
                applySettings();

                // Load active book INSTANTLY without waiting for NLP dict
                if (AppState.settings.lastBookId) {
                    await loadBook(AppState.settings.lastBookId);
                } else {
                    showEmptyState();
                }

                // Asynchronously load Kuromoji dict in background (non-blocking)
                initTokenizerInBackground();

            } catch (e) {
                console.error("Initialization error:", e);
                showToast("数据库初始化失败");
            }
        }

        // Background non-blocking Kuromoji dictionary builder
        function initTokenizerInBackground() {
            if (typeof kuromoji === 'undefined') return;

            // 1. 修复 kuromoji.js 内部将 https:// 误切为 https:/ 导致 404 的 Bug
            if (!window._xhrPatched) {
                const origOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, ...args) {
                    if (typeof url === 'string' && url.includes('kuromoji')) {
                        url = url.replace(/^(https?:\/)(?!\/)/, '$1/');
                    }
                    return origOpen.call(this, method, url, ...args);
                };
                window._xhrPatched = true;
            }
            
            // 2. 补充末尾斜杠 /
            kuromoji.builder({ dicPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/" }).build((err, tokenizer) => {
                const statusEl = document.getElementById('dict-status');
                if (err) {
                    console.warn("Kuromoji load failed:", err);
                    document.getElementById('dict-status-text').innerText = '注音库离线';
                    setTimeout(() => statusEl.classList.add('opacity-0', 'pointer-events-none'), 3000);
                    return;
                }
                
                AppState.tokenizer = tokenizer;
                AppState.tokenizerReady = true;

                // Update UI badge
                document.getElementById('dict-status-text').innerText = '注音库已就绪';
                setTimeout(() => statusEl.classList.add('opacity-0', 'pointer-events-none'), 2500);

                // Re-render current page with furigana/POS tags automatically
                if (AppState.currentBook) {
                    renderPage();
                }
            });
        }

        function showEmptyState() {
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('content').innerHTML = '';
            document.getElementById('book-title').innerText = '';
            updatePageIndicator();
        }

        function applySettings() {
            // Theme
            const nightIcon = document.getElementById('theme-icon-night');
            const dayIcon = document.getElementById('theme-icon-day');
            if (AppState.settings.theme === 'day') {
                document.body.classList.replace('theme-night', 'theme-day');
                nightIcon.classList.add('hidden');
                dayIcon.classList.remove('hidden');
            } else {
                document.body.classList.replace('theme-day', 'theme-night');
                dayIcon.classList.add('hidden');
                nightIcon.classList.remove('hidden');
            }

            // Furigana
            if (AppState.settings.showFurigana) {
                document.body.classList.remove('hide-furigana');
                document.getElementById('furigana-btn-text').innerText = '注音';
            } else {
                document.body.classList.add('hide-furigana');
                document.getElementById('furigana-btn-text').innerText = '隐藏';
            }

            // Typography
            const content = document.getElementById('content');
            content.style.fontSize = `${AppState.settings.fontSize}px`;
            content.style.lineHeight = AppState.settings.lineSpacing;
            document.getElementById('font-size-display').innerText = `${AppState.settings.fontSize}px`;
            document.getElementById('line-spacing-display').innerText = AppState.settings.lineSpacing.toFixed(1);

            // Custom Font
            if (AppState.settings.customFont) {
                document.getElementById('custom-font-style').innerHTML = `
                    @font-face { font-family: 'CustomUserFont'; src: url(${AppState.settings.customFont}); }
                    #content { font-family: 'CustomUserFont', system-ui, sans-serif !important; }
                `;
                document.getElementById('font-status-text').innerText = `已启用: ${AppState.settings.fontName || '自定义字体'}`;
            } else {
                document.getElementById('custom-font-style').innerHTML = '';
                document.getElementById('font-status-text').innerText = '未设置自定义字体';
            }
        }

        async function saveSettings() {
            await DB.saveSettings(AppState.settings);
            applySettings();
        }

        // --- Trigger Imports ---
        function triggerImport() {
            document.getElementById('main-book-upload').click();
        }

        function handleBookUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                // Split sentences by Japanese & Chinese punctuation
                let chunks = text.match(/[^。！？\n]+[。！？\n]*|[。！？\n]+/g) || [];
                chunks = chunks.map(c => c.trim()).filter(c => c.length > 0);

                if (chunks.length === 0) {
                    showToast("文件内容为空或格式不支持");
                    return;
                }

                const title = file.name.replace(/\.txt$/i, '');
                const bookId = await DB.addBook(title, chunks);
                
                AppState.settings.lastBookId = bookId;
                await saveSettings();
                
                await loadBook(bookId);
                showToast(`导入成功：《${title}》`);
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function handleFontUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                AppState.settings.customFont = e.target.result;
                AppState.settings.fontName = file.name;
                await saveSettings();
                showToast("自定义字体已启用并被系统缓存");
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // --- Book Reading & Rendering ---
        async function loadBook(id) {
            const book = await DB.getBook(id);
            if (!book) {
                AppState.settings.lastBookId = null;
                saveSettings();
                showEmptyState();
                return;
            }

            if (!book.bookmarks) book.bookmarks = [];

            AppState.currentBook = book;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('book-title').innerText = book.title;
            
            renderPage();
        }

        function renderPage(targetSentenceIndex = null) {
            if (!AppState.currentBook) return;

            const { chunks, lastPage, bookmarks = [] } = AppState.currentBook;
            const start = lastPage * AppState.sentencesPerPage;
            const end = Math.min(start + AppState.sentencesPerPage, chunks.length);
            const pageChunks = chunks.slice(start, end);

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';

            pageChunks.forEach((chunk, index) => {
                const globalIndex = start + index;
                const isBookmarked = bookmarks.some(b => b.sentenceIndex === globalIndex);
                
                const block = document.createElement('div');
                block.id = `sentence-${globalIndex}`;
                block.className = `sentence-block ${targetSentenceIndex === globalIndex ? 'highlight-target' : ''}`;
                
                const textDiv = document.createElement('div');
                textDiv.className = 'sentence-text inline-block';
                textDiv.innerHTML = processSentenceNLP(chunk);

                // 1. Translate Button (文)
                const transBtn = document.createElement('button');
                transBtn.className = 'action-btn translate-btn';
                transBtn.innerText = '文';
                transBtn.title = '翻译句子';
                transBtn.onclick = () => translateSentence(chunk, globalIndex);

                // 2. TTS Voice Reading Button (🔊)
                const ttsBtn = document.createElement('button');
                ttsBtn.id = `tts-btn-${globalIndex}`;
                ttsBtn.className = `action-btn tts-btn ${AppState.currentSpeakingIndex === globalIndex ? 'speaking' : ''}`;
                ttsBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>`;
                ttsBtn.title = '日文语音朗读';
                ttsBtn.onclick = () => speakJapaneseSentence(chunk, globalIndex);

                // 3. Bookmark Button (⭐)
                const bmBtn = document.createElement('button');
                bmBtn.className = `action-btn bookmark-btn ${isBookmarked ? 'active' : ''}`;
                bmBtn.title = isBookmarked ? "移除书签" : "添加书签";
                bmBtn.innerHTML = `<svg class="w-4 h-4" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>`;
                bmBtn.onclick = (e) => {
                    e.stopPropagation();
                    toggleBookmark(globalIndex, chunk);
                };

                const transDiv = document.createElement('div');
                transDiv.id = `trans-${globalIndex}`;
                transDiv.className = 'mt-2 text-sm opacity-80 hidden p-3 rounded-lg bg-black bg-opacity-20 border border-gray-600 border-opacity-30';

                block.appendChild(textDiv);
                block.appendChild(transBtn);
                block.appendChild(ttsBtn);
                block.appendChild(bmBtn);
                block.appendChild(transDiv);
                contentDiv.appendChild(block);
            });

            updatePageIndicator();

            if (targetSentenceIndex !== null) {
                setTimeout(() => {
                    const targetEl = document.getElementById(`sentence-${targetSentenceIndex}`);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 120);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function updatePageIndicator() {
            const indicator = document.getElementById('page-indicator');
            if (!AppState.currentBook) {
                indicator.innerText = '0 / 0';
                return;
            }
            const total = Math.ceil(AppState.currentBook.chunks.length / AppState.sentencesPerPage);
            const current = AppState.currentBook.lastPage + 1;
            indicator.innerText = `${current} / ${total}`;
        }

        async function nextPage() {
            if (!AppState.currentBook) return;
            const totalPages = Math.ceil(AppState.currentBook.chunks.length / AppState.sentencesPerPage);
            if (AppState.currentBook.lastPage < totalPages - 1) {
                AppState.currentBook.lastPage++;
                await DB.updateBook(AppState.currentBook);
                renderPage();
            }
        }

        async function prevPage() {
            if (!AppState.currentBook) return;
            if (AppState.currentBook.lastPage > 0) {
                AppState.currentBook.lastPage--;
                await DB.updateBook(AppState.currentBook);
                renderPage();
            }
        }

        // --- Jump Page Features ---
        function openJumpModal() {
            if (!AppState.currentBook) {
                showToast("请先导入或选择一本书籍");
                return;
            }
            const total = Math.ceil(AppState.currentBook.chunks.length / AppState.sentencesPerPage);
            const current = AppState.currentBook.lastPage + 1;
            
            const jumpInput = document.getElementById('jump-input');
            const jumpRange = document.getElementById('jump-range');
            
            jumpInput.max = total;
            jumpInput.value = current;
            jumpRange.max = total;
            jumpRange.value = current;
            document.getElementById('jump-total-pages').innerText = `/ ${total} 页`;
            
            // 绑定事件：滑动条与输入框同步
            jumpInput.oninput = function() {
                let val = parseInt(this.value);
                if (val > total) val = total;
                if (val < 1) val = 1;
                jumpRange.value = val || 1;
            };

            openModal('jump-modal');
        }

        async function executeJump() {
            if (!AppState.currentBook) return;
            const total = Math.ceil(AppState.currentBook.chunks.length / AppState.sentencesPerPage);
            let target = parseInt(document.getElementById('jump-input').value);
            
            if (isNaN(target) || target < 1) target = 1;
            if (target > total) target = total;
            
            AppState.currentBook.lastPage = target - 1;
            await DB.updateBook(AppState.currentBook);
            
            closeModal('jump-modal');
            renderPage();
            showToast(`已成功跳转至第 ${target} 页`);
        }


        // --- Japanese TTS Speech Synthesis ---
        function speakJapaneseSentence(text, globalIndex) {
            if (!('speechSynthesis' in window)) {
                showToast("当前浏览器不支持 TTS 语音朗读");
                return;
            }

            // Stop if currently speaking the same sentence
            if (window.speechSynthesis.speaking && AppState.currentSpeakingIndex === globalIndex) {
                window.speechSynthesis.cancel();
                setSpeakingState(null);
                return;
            }

            window.speechSynthesis.cancel(); // Stop active voices

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.95; // Slightly natural pace for study

            // Find best Japanese voice
            const voices = window.speechSynthesis.getVoices();
            const jaVoice = voices.find(v => v.lang.startsWith('ja') || v.lang === 'ja_JP');
            if (jaVoice) {
                utterance.voice = jaVoice;
            }

            utterance.onstart = () => {
                setSpeakingState(globalIndex);
            };

            utterance.onend = () => {
                setSpeakingState(null);
            };

            utterance.onerror = (e) => {
                console.error("TTS Error:", e);
                setSpeakingState(null);
            };

            window.speechSynthesis.speak(utterance);
        }

        function setSpeakingState(index) {
            if (AppState.currentSpeakingIndex !== null) {
                const prevBtn = document.getElementById(`tts-btn-${AppState.currentSpeakingIndex}`);
                if (prevBtn) prevBtn.classList.remove('speaking');
            }
            AppState.currentSpeakingIndex = index;
            if (index !== null) {
                const curBtn = document.getElementById(`tts-btn-${index}`);
                if (curBtn) curBtn.classList.add('speaking');
            }
        }

        // --- Fuzzy Search Modal & Engine ---
        function openSearchModal() {
            if (!AppState.currentBook) {
                showToast("请先导入或选择一本书籍");
                return;
            }
            openModal('search-modal');
            setTimeout(() => {
                const input = document.getElementById('search-input');
                input.value = '';
                input.focus();
                document.getElementById('search-results-list').innerHTML = '<div class="text-center opacity-50 my-6 text-sm">请输入关键词进行检索</div>';
            }, 150);
        }

        function performFuzzySearch() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results-list');

            if (!query || !AppState.currentBook) {
                resultsDiv.innerHTML = '<div class="text-center opacity-50 my-6 text-sm">请输入关键词进行检索</div>';
                return;
            }

            const chunks = AppState.currentBook.chunks;
            const matches = [];

            for (let i = 0; i < chunks.length; i++) {
                const text = chunks[i];
                if (text.toLowerCase().includes(query)) {
                    matches.push({
                        sentenceIndex: i,
                        text: text,
                        page: Math.floor(i / AppState.sentencesPerPage) + 1
                    });
                }
                if (matches.length >= 20) break; // Limit top 20
            }

            resultsDiv.innerHTML = '';

            if (matches.length === 0) {
                resultsDiv.innerHTML = `<div class="text-center opacity-50 my-6 text-sm">未找到与 “${escapeHtml(query)}” 相关的句子</div>`;
                return;
            }

            matches.forEach(m => {
                const item = document.createElement('div');
                item.className = 'p-3 rounded-xl border border-gray-600 border-opacity-30 bg-black bg-opacity-10 hover:bg-opacity-20 cursor-pointer transition';
                item.onclick = () => jumpToSentence(m.sentenceIndex);

                // Highlight keyword
                const regex = new RegExp(`(${query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
                const highlightedText = escapeHtml(m.text).replace(regex, '<mark class="bg-amber-500/40 text-amber-200 px-0.5 rounded">$1</mark>');

                item.innerHTML = `
                    <div class="text-xs text-amber-500 font-semibold mb-1">第 ${m.page} 页 · 句子 #${m.sentenceIndex + 1}</div>
                    <div class="text-sm opacity-90 leading-relaxed">${highlightedText}</div>
                `;
                resultsDiv.appendChild(item);
            });
        }

        async function jumpToSentence(sentenceIndex) {
            closeModal('search-modal');
            const targetPage = Math.floor(sentenceIndex / AppState.sentencesPerPage);
            AppState.currentBook.lastPage = targetPage;
            await DB.updateBook(AppState.currentBook);
            renderPage(sentenceIndex);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- Bookmark Functionality ---
        async function toggleBookmark(sentenceIndex, excerpt) {
            if (!AppState.currentBook) return;

            if (!AppState.currentBook.bookmarks) {
                AppState.currentBook.bookmarks = [];
            }

            const existingIdx = AppState.currentBook.bookmarks.findIndex(b => b.sentenceIndex === sentenceIndex);

            if (existingIdx >= 0) {
                AppState.currentBook.bookmarks.splice(existingIdx, 1);
                showToast("已移除书签");
            } else {
                AppState.currentBook.bookmarks.push({
                    sentenceIndex,
                    excerpt: excerpt.substring(0, 35) + (excerpt.length > 35 ? '...' : ''),
                    timestamp: Date.now()
                });
                showToast("书签保存成功");
            }

            await DB.updateBook(AppState.currentBook);
            renderPage(sentenceIndex);
        }

        function openBookmarksModal() {
            if (!AppState.currentBook) {
                showToast("请先导入或打开一本书");
                return;
            }

            const list = document.getElementById('bookmarks-list');
            const bookmarks = AppState.currentBook.bookmarks || [];

            list.innerHTML = '';

            if (bookmarks.length === 0) {
                list.innerHTML = '<div class="text-center opacity-50 my-6 text-sm">本书暂无书签</div>';
            } else {
                const sorted = [...bookmarks].sort((a,b) => a.sentenceIndex - b.sentenceIndex);
                sorted.forEach(bm => {
                    const pageNum = Math.floor(bm.sentenceIndex / AppState.sentencesPerPage) + 1;
                    const item = document.createElement('div');
                    item.className = 'p-3 rounded-xl border border-gray-600 border-opacity-30 bg-black bg-opacity-10 hover:bg-opacity-20 cursor-pointer transition flex items-center justify-between';
                    
                    const info = document.createElement('div');
                    info.className = 'flex-1 min-w-0 pr-3';
                    info.onclick = () => jumpToSentence(bm.sentenceIndex);
                    info.innerHTML = `
                        <div class="text-xs text-amber-500 font-semibold mb-1">第 ${pageNum} 页 · 句子 #${bm.sentenceIndex + 1}</div>
                        <div class="text-sm truncate opacity-90">${bm.excerpt}</div>
                    `;

                    const delBtn = document.createElement('button');
                    delBtn.className = 'p-1.5 text-red-400 hover:text-red-500 transition opacity-70 hover:opacity-100';
                    delBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        toggleBookmark(bm.sentenceIndex, bm.excerpt);
                        openBookmarksModal();
                    };

                    item.appendChild(info);
                    item.appendChild(delBtn);
                    list.appendChild(item);
                });
            }

            openModal('bookmarks-modal');
        }

        // --- Japanese Morphological Parsing & Furigana ---
        function katakanaToHiragana(src) {
            return src.replace(/[\u30a1-\u30f6]/g, function(match) {
                var chr = match.charCodeAt(0) - 0x60;
                return String.fromCharCode(chr);
            });
        }

        function hasKanji(str) {
            return /[\u4e00-\u9faf]/.test(str);
        }

        function processSentenceNLP(sentence) {
            if (!AppState.tokenizerReady || !AppState.tokenizer) return sentence;
            
            try {
                const tokens = AppState.tokenizer.tokenize(sentence);
                let html = '';

                tokens.forEach(token => {
                    const surface = token.surface_form;
                    const readingKata = token.reading;
                    const pos = token.pos;

                    let posClass = 'pos-other';
                    if (pos === '名詞') {
                        posClass = 'pos-noun'; // Brown background
                    } else if (pos === '動詞' || pos === '副詞' || pos === '形容詞') {
                        posClass = 'pos-verb'; // Dark grey background
                    }

                    if (hasKanji(surface) && readingKata && readingKata !== surface) {
                        const readingHira = katakanaToHiragana(readingKata);
                        html += `<ruby class="token ${posClass}"><span class="token-base">${surface}</span><rt>${readingHira}</rt></ruby>`;
                    } else {
                        html += `<ruby class="token ${posClass}"><span class="token-base border-none">${surface}</span><rt></rt></ruby>`;
                    }
                });

                return html;
            } catch (e) {
                return sentence;
            }
        }

        // --- Translation API Integration ---
        async function translateSentence(text, idx) {
            const transDiv = document.getElementById(`trans-${idx}`);
            if (transDiv.classList.contains('hidden') || transDiv.innerText.includes('翻译中')) {
                transDiv.classList.remove('hidden');
                transDiv.innerText = '正在调用接口翻译中...';
                try {
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=${encodeURIComponent(text)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    let translatedText = '';
                    if (data && data[0]) {
                        data[0].forEach(item => {
                            if (item[0]) translatedText += item[0];
                        });
                    }
                    transDiv.innerText = translatedText || '翻译响应异常，请稍后重试。';
                } catch (e) {
                    console.error("Translation error", e);
                    transDiv.innerText = '网络连接失败，无法完成翻译。';
                }
            } else {
                transDiv.classList.add('hidden');
            }
        }

        // --- Settings Controls ---
        function toggleTheme() {
            AppState.settings.theme = AppState.settings.theme === 'night' ? 'day' : 'night';
            saveSettings();
        }

        function toggleFurigana() {
            AppState.settings.showFurigana = !AppState.settings.showFurigana;
            saveSettings();
        }

        function changeFontSize(delta) {
            AppState.settings.fontSize = Math.max(12, Math.min(36, AppState.settings.fontSize + delta));
            saveSettings();
        }

        function changeLineSpacing(delta) {
            AppState.settings.lineSpacing = Math.max(1.2, Math.min(3.8, parseFloat((AppState.settings.lineSpacing + delta).toFixed(1))));
            saveSettings();
        }

        // --- Modal Helpers ---
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            
            if (id === 'library-modal') {
                populateLibrary();
            }
            
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function populateLibrary() {
            const list = document.getElementById('library-list');
            list.innerHTML = '<div class="text-center opacity-50 my-4 text-sm">加载书库中...</div>';
            
            const books = await DB.getAllBooksInfo();
            list.innerHTML = '';
            
            if (books.length === 0) {
                list.innerHTML = '<div class="text-center opacity-50 my-4 text-sm">书库空空如也</div>';
                return;
            }

            books.forEach(book => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 rounded-xl border border-gray-600 border-opacity-30 bg-black bg-opacity-10 hover:bg-opacity-20 cursor-pointer transition';
                
                const info = document.createElement('div');
                info.className = 'flex-1 min-w-0 pr-4';
                info.onclick = async () => {
                    closeModal('library-modal');
                    AppState.settings.lastBookId = book.id;
                    await saveSettings();
                    await loadBook(book.id);
                };
                info.innerHTML = `
                    <div class="font-bold text-sm truncate mb-1">${book.title}</div>
                    <div class="text-xs opacity-60">进度: 第 ${book.lastPage + 1} / ${book.totalPages} 页 · 书签: ${book.bookmarksCount} 个</div>
                `;

                const delBtn = document.createElement('button');
                delBtn.className = 'p-1.5 text-red-400 hover:text-red-500 transition opacity-70 hover:opacity-100 rounded-full hover:bg-red-500 hover:bg-opacity-20';
                delBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    confirmDeleteBook(book.id, book.title);
                };

                item.appendChild(info);
                item.appendChild(delBtn);
                list.appendChild(item);
            });
        }

        function confirmDeleteBook(id, title) {
            document.getElementById('confirm-title').innerText = "确认删除书本";
            document.getElementById('confirm-msg').innerText = `确定要删除《${title}》及其相关书签吗？`;
            
            const actionBtn = document.getElementById('confirm-action-btn');
            actionBtn.onclick = async () => {
                closeModal('confirm-modal');
                await DB.deleteBook(id);
                if (AppState.currentBook && AppState.currentBook.id === id) {
                    AppState.currentBook = null;
                    AppState.settings.lastBookId = null;
                    await saveSettings();
                    showEmptyState();
                }
                showToast("已成功删除图书");
                populateLibrary();
            };

            openModal('confirm-modal');
        }

        // Bootstrap App
        window.addEventListener('DOMContentLoaded', initialize);

    </script>
</body>
