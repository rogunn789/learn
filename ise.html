<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEのための文章術 · 答题卡</title>
<style>
:root{--bg:#fdf9ef;--card:#fffdf6;--ink:#222;--sub:#777;--line:#e8e0cd;--accent:#d6006d;--jpb:#fff5f9}
body.dark{--bg:#17141f;--card:#221d2e;--ink:#eee;--sub:#9a93a8;--line:#3a3350;--jpb:#2b1a26}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
.hide{display:none!important}
button{font-family:inherit}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
.lockbox{text-align:center;padding:24px;max-width:340px;width:92%}
.locktitle{font-size:21px;font-weight:700;margin:0 0 6px}
.lockhint{color:var(--sub);font-size:13px;margin:0 0 16px;line-height:1.6}
.lockbox input{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);margin-bottom:10px}
.lockbtn{width:100%;padding:12px;font-size:16px;font-weight:700;border:none;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
.lockmsg{color:#d43d2a;font-size:13px;min-height:18px;margin-top:8px}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-top)*0);display:flex;gap:8px;align-items:center}
.topbar select{flex:1;min-width:0;padding:8px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.nbtn{flex:none;padding:8px 12px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.stage{padding:64px 12px 96px;max-width:760px;margin:0 auto}
.qhead{font-size:12.5px;color:var(--sub);margin:2px 0 10px;line-height:1.6}
.qhead .tp{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;cursor:pointer;min-height:300px}
.qlabel{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 9px;margin-bottom:12px}
.alabel{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#0b5cad;border-radius:6px;padding:2px 9px;margin-bottom:12px}
.qtext{font-family:"Hiragino Maru Gothic ProN","TsukuA Maru Gothic","TsukuB Maru Gothic","Hiragino Mincho ProN",serif;font-size:21px;line-height:1.75;margin:0}
.atext{font-family:"Hiragino Maru Gothic ProN","TsukuA Maru Gothic","TsukuB Maru Gothic","Hiragino Mincho ProN",serif;font-size:18.5px;line-height:1.8;margin:0 0 14px}
.acn{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Noto Serif CJK SC",serif;font-size:16.5px;line-height:1.75;color:#0b5cad;margin:0;border-top:1px dashed var(--line);padding-top:12px}
body.dark .acn{color:#7cc4ff}
.flipnote{text-align:center;color:var(--sub);font-size:12.5px;margin-top:14px}
.srcnote{font-size:12px;color:var(--sub);margin-top:12px}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.botrow{display:flex;gap:8px;align-items:center;max-width:760px;margin:0 auto}
.bbtn{flex:1;padding:11px 0;font-size:15px;font-weight:700;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer}
.bbtn.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
</style>
</head>

    h += '<div class="card" id="qcard"><span class="qlabel">問</span><p class="qtext">' + esc(e.q) + '</p><p class="srcnote">出典：' + esc(e.src) + '</p><p class="flipnote">点卡片看答案 · 双击随机下一张</p></div>';
  } else {
    h += '<div class="card" id="qcard"><span class="alabel">答</span><p class="atext">' + esc(e.a) + '</p><p class="acn">' + esc(e.cn) + '</p><p class="srcnote">出典：' + esc(e.src) + '</p><p class="flipnote">点卡片回问题 · 双击随机下一张</p></div>';
  }
  document.getElementById('stage').innerHTML = h;
  window.scrollTo(0, 0);
  var card = document.getElementById('qcard');
  var lastTap = 0;
  card.addEventListener('click', function(ev){
    var now = Date.now();
    if (now - lastTap < 330){ lastTap = 0; jumpRandom(); return; }
    lastTap = now;
    setTimeout(function(){
      if (lastTap && Date.now() - lastTap >= 320) { flip(); lastTap = 0; }
    }, 340);
  });
}
function flip(){
  faceFront = !faceFront;
  if (!faceFront && !seenSet[cur]){
    seenSet[cur] = 1;
    lsS('seqa_seen', JSON.stringify(Object.keys(seenSet).map(Number)));
    document.getElementById('stats').textContent = '已看 ' + Object.keys(seenSet).length + ' · 共 ' + CARDS.length + ' 张';
  }
  renderFace();
}
function jumpRandom(){
  var p = pool(); if (p.length < 2) return;
  var n; do { n = p[Math.floor(Math.random() * p.length)]; } while (n === cur);
  show(n);
}
function step(d){
  var p = pool(); if (!p.length) return;
  var i = p.indexOf(cur); if (i < 0) i = 0;
  show(p[(i + d + p.length) % p.length]);
}
function startApp(){
  if (started) return; started = true;
  document.getElementById('lock').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  var sel = document.getElementById('chapSel');
  var oh = '<option value="ALL">全部（15 回）</option>';
  for (var i = 0; i < CHAPS.length; i++) oh += '<option value="' + i + '">' + esc(chapShort(CHAPS[i])) + ' ' + esc(CHAPS[i].replace(/^第\d+回\s*/, '')) + '</option>';
  sel.innerHTML = oh;
  sel.value = chapFilter;
  sel.addEventListener('change', function(){ chapFilter = sel.value; lsS('seqa_ch', chapFilter); show(cur); });
  document.getElementById('nbtn').addEventListener('click', function(ev){
    ev.stopPropagation();
    var d = document.body.classList.contains('dark') ? 'light' : 'dark';
    lsS('seqa_theme', d); applyT(d);
  });
  document.getElementById('prevBtn').addEventListener('click', function(ev){ ev.stopPropagation(); step(-1); });
  document.getElementById('nextBtn').addEventListener('click', function(ev){ ev.stopPropagation(); step(1); });
  document.getElementById('randBtn').addEventListener('click', function(ev){ ev.stopPropagation(); jumpRandom(); });
  show(cur);
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('lockBtn').addEventListener('click', function(){
    tryUnlock(document.getElementById('pwdInput').value);
  });
  document.getElementById('pwdInput').addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') tryUnlock(document.getElementById('pwdInput').value);
  });
  var m = (location.search || '').match(/[?&]pwd=([^&]+)/) || (location.hash || '').match(/pwd=([^&]+)/);
  if (m) tryUnlock(decodeURIComponent(m[1]));
});
</script>
